                </div>
                {dispo.length ? (
                  <div className="divide-y divide-gray-100 overflow-hidden rounded-xl bg-white">
                    {dispo.map(p => (
                      <button key={p.id} onClick={() => onItem(p.id, {})} className="flex w-full items-center gap-3 px-3 py-2.5 text-left hover:bg-gray-50">
                        <span className="grid h-6 w-6 shrink-0 place-items-center rounded-md bg-accent text-sm font-bold text-white">+</span>
                        <span className="min-w-0 flex-1 text-sm font-medium">{p.nom}</span>
                        <span className="tabular shrink-0 text-xs text-gray-500">{eur(num(p.prix))}{xHT()}{p.type === 'mensuel' ? ' / mois' : ''}</span>
                      </button>
                    ))}
                  </div>
                ) : <p className="px-1 text-sm text-gray-500">Toutes les prestations {tout ? 'du catalogue' : 'de ce domaine'} sont déjà dans le pack.</p>}
              </div>
            )}
          </div>
        );
      })()}

      <div className="mt-6 grid gap-5 lg:grid-cols-[1fr_1.2fr]">
        <div className="space-y-4">
          {remiseInput('ponctuel', 'Remise sur le prix à la commande', pk.id)}
          {remiseInput('mensuel', 'Remise sur le prix mensuel', pk.id)}
          <p className="text-xs text-gray-500">La remise affichée au client est toujours calculée par rapport aux tarifs à la carte.</p>
        </div>
        <div className="rounded-2xl bg-gray-50 p-2">
          <TableRemise r={r} tva={s.tva} />
        </div>
      </div>

      <div className="mt-6 flex flex-wrap gap-2">
        <button onClick={onSave} className="rounded-xl bg-accent px-5 py-3 text-sm font-semibold text-white shadow-sm hover:brightness-110">Enregistrer mes modifications</button>
        {!actif && <button onClick={onChoisir} className="rounded-xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white">Choisir cette formule</button>}
        <button onClick={onReset} className="rounded-xl border border-gray-200 px-4 py-3 text-sm font-medium text-gray-600 hover:bg-gray-50">Revenir à la composition d'origine</button>
      </div>
    </div>
  );
}

// Sélecteur de priorité affichée au client : Indispensable (verrouillé), Recommandé, Au choix.
const PRIO_STYLE = { essentiel: 'bg-rose-600 text-white', recommande: 'bg-emerald-600 text-white', option: 'bg-slate-600 text-white' };
function ChoixPriorite({ value, onChange }) {
  return (
    <div className="mt-1.5 inline-flex rounded-lg bg-gray-100 p-0.5" role="radiogroup" aria-label="Priorité">
      {PRIORITES.map(x => (
        <button key={x.v} type="button" role="radio" aria-checked={value === x.v} onClick={() => onChange(x.v)}
          className={'rounded-md px-2 py-1 text-[11px] font-semibold transition ' + (value === x.v ? PRIO_STYLE[x.v] + ' shadow-sm' : 'text-gray-500 hover:text-ink')}>
          {x.v === 'essentiel' ? '🔒 ' : ''}{x.label}
        </button>
      ))}
    </div>
  );
}

// Mode à la carte : comparer la sélection avec une formule, sans rien ajouter sans validation.
function Comparaison({ s, onProposer }) {
  const sel = s.prestations.filter(p => p.selected);
  const [packId, setPackId] = useState('');
  const [garder, setGarder] = useState(true);
  if (!sel.length) return null;
  const eff = (pk) => itemsEffectifs(s, pk);
  const overlap = (pk) => sel.filter(p => eff(pk)[p.id]).length;
  const auto = s.packs.find(pk => sel.every(p => eff(pk)[p.id])) || [...s.packs].sort((a, b) => overlap(b) - overlap(a))[0];
  const pack = s.packs.find(x => x.id === packId) || auto;
  const { carte, pk, enPlus, horsPack } = comparer(s, pack, garder);
  const dP = pk.ttcP - carte.ttcP, dM = pk.ttcM - carte.ttcM, dT = pk.totalTTC - carte.totalTTC;
  const duree = carte.mois ? `sur ${carte.mois} mois` : 'le 1er mois';
  const bloc = (titre, r, accent) => (
    <div className={'rounded-2xl p-4 ' + (accent ? 'bg-accent text-white' : 'bg-white ring-1 ring-gray-200')}>
      <p className={'text-xs font-bold uppercase tracking-wide ' + (accent ? 'text-white/70' : 'text-gray-500')}>{titre}</p>
      <p className="tabular mt-1 font-display text-2xl font-semibold leading-tight">{eur(r.ttcP)}<span className={'ml-1 font-sans text-xs ' + (accent ? 'text-white/70' : 'text-gray-500')}>{FRANCHISE ? 'à la commande' : 'TTC à la commande'}</span></p>
      {r.ttcM > 0 && <p className="tabular font-semibold">+ {eur(r.ttcM)} <span className={'text-xs font-normal ' + (accent ? 'text-white/70' : 'text-gray-500')}>{FRANCHISE ? '/ mois' : 'TTC / mois'}</span></p>}
      <p className={'tabular mt-1 text-xs ' + (accent ? 'text-white/70' : 'text-gray-500')}>Total {duree} : {eur(r.totalTTC)}{xTTC()}</p>
    </div>
  );
  return (
    <div className="mt-8 rounded-3xl bg-gray-50 p-4 sm:p-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="font-display text-lg font-semibold">Comparer avec une formule</p>
          <p className="text-sm text-gray-500">La sélection à la carte face à un pack : ce qui est en plus, et la différence de prix.</p>
        </div>
        <Segmented value={pack.id} options={s.packs.map(x => ({ v: x.id, label: x.nom.replace(/^Pack\s+/i, '') }))} onChange={setPackId} />
      </div>
      <div className="mt-4 grid gap-3 sm:grid-cols-2">
        {bloc('Sélection à la carte', carte)}
        {bloc(pack.nom, pk, true)}
      </div>
      <div className="tabular mt-3 rounded-2xl bg-white px-4 py-3 text-sm ring-1 ring-gray-200">
        <span className="font-semibold">Différence avec le {pack.nom} : </span>
        {signe(dP)} à la commande · {signe(dM)} par mois · <strong>{signe(dT)} {duree}</strong>
        {pk.economie > 0.5 && <span className="block text-emerald-700">Le pack inclut {eur(pk.economie)}{xTTC()} de remise par rapport aux mêmes prestations à la carte.</span>}
      </div>
      <div className="mt-4 grid gap-4 sm:grid-cols-2">
        <div>
          <p className="text-sm font-semibold">En plus dans le pack {enPlus.length ? `(${enPlus.length})` : ''}</p>
          {enPlus.length ? (
            <ul className="mt-1.5 space-y-1 text-sm">{enPlus.map(p => (
              <li key={p.id} className="flex justify-between gap-3"><span>+ {p.nom}</span><span className="tabular shrink-0 text-gray-500">{eur(pk.lineCat(p))}{xHT()}{p.type === 'mensuel' ? '/mois' : ''}</span></li>
            ))}</ul>
          ) : <p className="mt-1 text-sm text-gray-500">Rien : le pack contient exactement la sélection.</p>}
        </div>
        {horsPack.length > 0 && (
          <div>
            <p className="text-sm font-semibold">Choisies à la carte mais pas dans le pack</p>
            <ul className="mt-1.5 space-y-1 text-sm text-gray-700">{horsPack.map(p => <li key={p.id}>• {p.nom}</li>)}</ul>
            <label className="mt-2 flex items-center gap-2 text-sm">
              <input type="checkbox" checked={garder} onChange={e => setGarder(e.target.checked)} className="h-4 w-4 accent-[#1f3a5f]" />
              Les garder dans la formule (au prix à la carte)
            </label>
          </div>
        )}
      </div>
      <button onClick={() => onProposer(pack, garder ? horsPack : [], enPlus)}
        className="mt-5 w-full rounded-xl bg-accent py-3 text-[15px] font-semibold text-white shadow-sm hover:brightness-110 sm:w-auto sm:px-6">
        Proposer le {pack.nom} à la place
      </button>
    </div>
  );
}

/* ============================ Application ============================ */
function App() {
  const [s, setS] = useState(load);
  FRANCHISE = num(s.tva) === 0;
  const [open, setOpen] = useState({ client: true });
  const [showProposal, setShowProposal] = useState(false);
  const [showDevis, setShowDevis] = useState(false);
  const [preview, setPreview] = useState(null);
  const [msg, setMsg] = useState('');
  const timer = useRef();

  useEffect(() => {
    try { localStorage.setItem(STORE, JSON.stringify(s)); }
    catch { toast('Mémoire locale pleine : retirez quelques photos.'); }
  }, [s]);

  const toast = (m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(''), 4500); };
  const set = (patch) => setS(prev => ({ ...prev, ...(typeof patch === 'function' ? patch(prev) : patch) }));
  const setClient = (k, v) => set(p => ({ client: { ...p.client, [k]: v } }));
  const setVendeur = (k, v) => set(p => ({ vendeur: { ...p.vendeur, [k]: v } }));
  const setPrest = (id, patch) => set(p => ({ prestations: p.prestations.map(x => x.id === id ? { ...x, ...patch } : x) }));
  const toggle = (k) => setOpen(o => ({ ...o, [k]: !o[k] }));
  const [perso, setPerso] = useState(''); // formule en cours de personnalisation
  useEffect(() => {
    if (!perso) return;
    const esc = (e) => e.key === 'Escape' && setPerso('');
    document.addEventListener('keydown', esc);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
  }, [perso]);
  const setPack = (id, patch) => set(p => ({ packs: p.packs.map(x => x.id === id ? { ...x, ...(typeof patch === 'function' ? patch(x) : patch) } : x) }));
  const setPackItem = (id, prestId, val) => set(p => {
    const x = p.packs.find(k => k.id === id);
    const items = { ...x.items };
    const herite = itemsHerites(p, x)[prestId];
    const cur = items[prestId];
    if (val === null) items[prestId] = herite ? { retire: true } : { ...(cur || {}), off: true };   // décoché : reste dans la liste
    else if (cur && cur.retire && herite && !Object.keys(val).length) delete items[prestId];           // recoché : reprend la formule parente
    else { const { off, retire, ...reste } = val; items[prestId] = cur && cur.off && !Object.keys(val).length ? (({ off: o, ...r }) => r)(cur) : reste; }
    return { packs: p.packs.map(k => k.id === id ? { ...k, items } : k) };
  });
  const allerOffre = () => { setOpen(o => ({ ...o, offre: true })); setTimeout(() => document.getElementById('offre')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30); };
  const changerMode = (m) => { set({ mode: m }); allerOffre(); };
  const choisir = (id) => { set({ mode: 'formule', pack: id }); toast((s.packs.find(x => x.id === id) || {}).nom + ' choisi. Le récapitulatif en haut est à jour.'); };
  const proposer = (pack, garder, enPlus) => {
    const ajout = [...enPlus.map(p => p.nom), ...garder.map(p => p.nom + ' (gardée)')];
    if (ajout.length && !confirm(`Passer au ${pack.nom} ?\n\nPrestations ajoutées par rapport à la sélection :\n• ${ajout.join('\n• ')}\n\nValidez seulement si le client est d'accord.`)) return;
    set(p => ({ mode: 'formule', pack: pack.id,
      packs: p.packs.map(x => x.id === pack.id ? { ...x, items: { ...x.items, ...Object.fromEntries(garder.map(g => [g.id, {}])) } } : x) }));
    toast(`${pack.nom} proposé. Votre sélection à la carte reste enregistrée dans l'onglet À la carte.`);
    allerOffre();
  };

  const c = useMemo(() => compute(s), [s]);
  const cTous = useMemo(() => compute({ ...s, exclus: {} }), [s]);
  const packsCalc = useMemo(() => Object.fromEntries(s.packs.map(pk => [pk.id, calc(s, packLines(s, pk), pk.remises)])), [s]);
  const sugg = useMemo(() => suggestions(s.reponses), [s.reponses]);
  const numero = useMemo(() => {
    const d = today();
    return `DEV-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${(s.client.entreprise || 'X').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'X'}`;
  }, [s.client.entreprise]);

  const answer = (q, o) => set(p => {
    const cur = p.reponses[q.id] || [];
    const next = q.multi ? (cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o]) : (cur.includes(o) ? [] : [o]);
    return { reponses: { ...p.reponses, [q.id]: next } };
  });

  const addPhotos = async (files) => {
    const out = [];
    for (const f of files) { try { out.push(await compress(f, 1400, 0.8)); } catch {} }
    set(p => ({ visuels: { ...p.visuels, photos: [...p.visuels.photos, ...out].slice(0, 12) } }));
  };
  const addLogo = async (f) => { if (!f) return; try { const d = await compress(f, 600, 0.9); set(p => ({ visuels: { ...p.visuels, logo: d } })); } catch { toast('Image illisible.'); } };

  const nouveauClient = () => {
    if (!confirm('Commencer un nouveau client ? La fiche, les réponses, la sélection et les visuels seront effacés. Vos tarifs et vos coordonnées sont conservés.')) return;
    set(p => ({ ...DEFAULTS, client: blankClient, visuels: { logo: '', photos: [], demoUrl: '' }, prestations: p.prestations.map(x => ({ ...x, selected: false })), vendeur: p.vendeur,
      inclus: p.inclus, paiement: p.paiement, validite: p.validite, tva: p.tva, offres: p.offres, packs: p.packs, combos: p.combos, mode: 'carte', pack: '' }));
    setPerso('');
    setOpen({ client: true });
  };

  const addCustom = (type, offre = 'base') => set(p => ({ prestations: [...p.prestations, { id: 'perso-' + Date.now(), type, nom: 'Nouvelle prestation', description: 'Description de la prestation', prix: 0, qte: 1, unite: '', selected: true, offre }] }));

  const answered = QUESTIONS.filter(q => (s.reponses[q.id] || []).length || (s.notes[q.id] || '').trim());
  const clientHint = [s.client.entreprise, s.client.responsable].filter(Boolean).join(' · ') || 'Coordonnées du commerçant';

  const generate = () => {
    if (c.mode === 'formule' && !c.pack) { toast('Choisissez une formule avant de générer la proposition.'); allerOffre(); return; }
    if (!c.sel.length) { toast(c.mode === 'formule' ? 'Cette formule ne contient aucune prestation.' : 'Cochez au moins une prestation avant de générer la proposition.'); allerOffre(); return; }
    setShowProposal(true);
    window.scrollTo(0, 0);
  };

  // appelée comme une fonction (et non <RemiseInput/>) pour que le champ garde le focus pendant la saisie
  // packId : remise d'une formule ; sinon remise de la vente à la carte
  const remiseInput = (k, label, packId) => {
    const pk = packId && s.packs.find(x => x.id === packId);
    const r = pk ? pk.remises[k] : s.remises[k];
    const maj = (patch) => pk
      ? setPack(packId, x => ({ remises: { ...x.remises, [k]: { ...x.remises[k], ...patch } } }))
      : set(p => ({ remises: { ...p.remises, [k]: { ...p.remises[k], ...patch } } }));
    return (
      <div>
        <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">{label}</p>
        <div className="flex items-center gap-2">
          <input type="number" inputMode="decimal" min="0" value={r.valeur} onChange={e => maj({ valeur: e.target.value })} className={inputCls + ' tabular w-28'} />
          <Segmented value={r.mode} options={[{ v: '%', label: '%' }, { v: '€', label: '€' }]} onChange={v => maj({ mode: v })} />
        </div>
      </div>
    );
  };

  return (
    <>
      <div id="app-main">
        {/* Récapitulatif permanent */}
        <div className="sticky top-0 z-40 border-b border-gray-200 bg-white/90 backdrop-blur" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
          <div className="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2.5 sm:px-6">
            <div className="flex w-full items-center gap-3 sm:w-auto" role="tablist">
              <div className="grid flex-1 grid-cols-2 rounded-xl bg-gray-100 p-1 sm:flex-none">
                {[['carte', 'À la carte'], ['formule', 'Formules']].map(([m, l]) => (
                  <button key={m} role="tab" aria-selected={s.mode === m} onClick={() => changerMode(m)}
                    className={'rounded-lg px-4 py-2 text-sm font-bold uppercase tracking-wide transition ' + (s.mode === m ? 'bg-white text-ink shadow-sm' : 'text-gray-500 hover:text-ink')}>{l}</button>
                ))}
              </div>
              <p className="truncate text-xs text-gray-500 sm:hidden">{c.mode === 'formule' ? (c.pack ? c.pack.nom : 'Aucune formule') : `${c.sel.length} presta.`}</p>
            </div>
            <div className="grid min-w-0 flex-1 grid-cols-3 gap-2 sm:gap-6">
              {[[c.mode === 'formule' && c.pack ? c.pack.nom.replace(/^Pack\s+/i, '') + ' · initial' : 'Initial', eur(c.htP), (FRANCHISE ? '' : eur(c.ttcP) + ' TTC')],
                ['Par mois', eur(c.htM), (FRANCHISE ? '' : eur(c.ttcM) + ' TTC')],
                [c.mois ? `Total ${c.mois} mois` : 'Total 1er mois', eur(c.totalHT), (FRANCHISE ? '' : eur(c.totalTTC) + ' TTC')]].map(([l, v, sub]) => (
                <div key={l} className="min-w-0">
                  <p className="truncate text-[10.5px] font-medium uppercase tracking-wide text-gray-500 sm:text-[11px]">{l}</p>
                  <p className="tabular truncate text-[15px] font-semibold sm:text-lg">{v}<span className="ml-1 text-[10px] font-normal text-gray-400">{uHT()}</span></p>
                  <p className="tabular hidden truncate text-[11px] text-gray-500 sm:block">{sub}</p>
                </div>
              ))}
            </div>
            <button onClick={generate} className="hidden rounded-xl bg-accent px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:brightness-110 sm:block">Générer la proposition commerciale</button>
          </div>
        </div>

        <main className="mx-auto max-w-5xl space-y-4 px-4 pb-32 pt-6 sm:px-6">
          <div className="flex flex-wrap items-end justify-between gap-3 pb-2">
            <div>
              <h1 className="font-display text-2xl font-semibold sm:text-3xl">Proposition commerciale</h1>
              <p className="text-sm text-gray-500">Enregistrement automatique sur cet appareil.</p>
            </div>
            <button onClick={nouveauClient} className="rounded-xl border border-gray-200 bg-white px-3.5 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50">Nouveau client</button>
          </div>

          {/* 1. Fiche client */}
          <Section n="1" title="Fiche client" hint={clientHint} open={!!open.client} onToggle={() => toggle('client')}>
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Nom de l'entreprise"><input className={inputCls} value={s.client.entreprise} onChange={e => setClient('entreprise', e.target.value)} placeholder="Boulangerie du Port" /></Field>
              <Field label="Responsable"><input className={inputCls} value={s.client.responsable} onChange={e => setClient('responsable', e.target.value)} placeholder="Prénom Nom" autoComplete="off" /></Field>
              <Field label="Téléphone"><input className={inputCls} type="tel" inputMode="tel" value={s.client.telephone} onChange={e => setClient('telephone', e.target.value)} placeholder="06 12 34 56 78" autoComplete="off" /></Field>
              <Field label="Email"><input className={inputCls} type="email" inputMode="email" value={s.client.email} onChange={e => setClient('email', e.target.value)} placeholder="contact@commerce.fr" autoComplete="off" /></Field>
              <Field label="Adresse" className="sm:col-span-2"><input className={inputCls} value={s.client.adresse} onChange={e => setClient('adresse', e.target.value)} placeholder="Rue, code postal, ville" autoComplete="off" /></Field>
              <Field label="Secteur d'activité" className="sm:col-span-2">
                <input className={inputCls} list="secteurs" value={s.client.secteur} onChange={e => setClient('secteur', e.target.value)} placeholder="Boulangerie, restaurant, coiffure…" />
                <datalist id="secteurs">{['Boulangerie-pâtisserie', 'Restaurant', 'Café / bar', 'Salon de coiffure', 'Institut de beauté', 'Boutique de vêtements', 'Fleuriste', 'Épicerie fine', 'Boucherie', 'Artisan'].map(x => <option key={x} value={x} />)}</datalist>
              </Field>
            </div>
          </Section>

          {/* 2. Découverte */}
          <Section n="2" title="Découverte commerciale" hint={answered.length ? `${answered.length} / ${QUESTIONS.length} questions renseignées` : 'Questions à poser pendant le rendez-vous'}
            open={!!open.decouverte} onToggle={() => toggle('decouverte')}>
            <div className="space-y-6">
              {QUESTIONS.map((q, i) => (
                <div key={q.id}>
                  <p className="font-medium"><span className="mr-2 text-gray-400">{i + 1}.</span>{q.q}{q.multi && <span className="ml-2 text-xs font-normal text-gray-400">plusieurs choix</span>}</p>
                  <div className="mt-2.5 flex flex-wrap gap-2">
                    {q.options.map(o => <Chip key={o} active={(s.reponses[q.id] || []).includes(o)} onClick={() => answer(q, o)}>{o}</Chip>)}
                  </div>
                  <input className={inputCls + ' mt-2.5 text-sm'} placeholder="Notes…" value={s.notes[q.id] || ''}
                    onChange={e => set(p => ({ notes: { ...p.notes, [q.id]: e.target.value } }))} />
                </div>
              ))}

              {answered.length > 0 && (
                <div className="rounded-2xl bg-gray-50 p-5">
                  <p className="font-display text-lg font-semibold">Synthèse des besoins</p>
                  <ul className="mt-3 space-y-2 text-sm">
                    {answered.map(q => (
                      <li key={q.id}>
                        <span className="text-gray-500">{q.q.replace(' ?', '')} : </span>
                        <span className="font-medium">{(s.reponses[q.id] || []).join(', ') || '—'}</span>
                        {(s.notes[q.id] || '').trim() && <span className="text-gray-600"> · {s.notes[q.id]}</span>}
                      </li>
                    ))}
                  </ul>
                  {sugg.size > 0 && (
                    <div className="mt-4 flex flex-wrap items-center gap-3 border-t border-gray-200 pt-4">
                      <p className="text-sm text-gray-600"><span className="font-semibold text-ink">{sugg.size} prestations</span> correspondent à ces besoins.</p>
                      <button className="rounded-xl bg-ink px-3.5 py-2 text-sm font-semibold text-white"
                        onClick={() => { set(p => ({ mode: 'carte', prestations: p.prestations.map(x => sugg.has(x.id) ? { ...x, selected: true } : x) })); allerOffre(); toast('Prestations suggérées cochées dans l\'onglet À la carte. Comparez ensuite avec une formule.'); }}>
                        Cocher les suggestions
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </Section>

          {/* 3. Constructeur d'offre */}
          <div id="offre" className="scroll-mt-32">
          <Section n="3" title={s.mode === 'formule' ? 'Formules' : 'À la carte'}
            hint={s.mode === 'formule'
              ? (c.pack ? `${c.pack.nom} · ${c.sel.length} prestations` : 'Choisissez une des trois formules')
              : (c.sel.length ? `${c.sel.length} prestation${c.sel.length > 1 ? 's' : ''} sélectionnée${c.sel.length > 1 ? 's' : ''}` : 'Cochez les prestations, ajustez prix et descriptions')}
            open={!!open.offre} onToggle={() => toggle('offre')}>
            {s.mode === 'formule' && (
              <div>
                {[['unite', 'À l\'unité', 'Le client ne prend qu\'un seul service.'], ['formule', 'Formules complètes', 'Plusieurs services regroupés, à prix réduit.']].map(([g, titre, sous]) => {
                  const liste = s.packs.filter(pk => (pk.groupe || 'formule') === g);
                  if (!liste.length) return null;
                  return (
                    <div key={g} className="pt-3">
                      <div className="mb-4 flex items-baseline gap-3 border-b border-gray-100 pb-2">
                        <p className="font-display text-lg font-bold">{titre}</p>
                        <p className="text-sm text-gray-500">{sous}</p>
                      </div>
                      <div className={'grid items-start gap-5 ' + (liste.length === 2 ? 'md:grid-cols-2 lg:max-w-[66%]' : 'md:grid-cols-3')}>
                        {liste.map(pk => (
                          <PackCard key={pk.id} pk={pk} r={packsCalc[pk.id]} actif={s.pack === pk.id} ouvert={perso === pk.id} mois={s.engagement}
                            onChoisir={() => choisir(pk.id)} onPerso={() => setPerso(perso === pk.id ? '' : pk.id)} />
                        ))}
                      </div>
                    </div>
                  );
                })}
                {perso && (() => {
                  const pk = s.packs.find(x => x.id === perso);
                  return (
                    <div className="fixed inset-0 z-50 overflow-y-auto bg-gray-900/50 sm:p-6" onClick={e => { if (e.target === e.currentTarget) setPerso(''); }}>
                      <div className="mx-auto max-w-5xl">
                        <div className="sticky top-0 z-10 flex items-center gap-3 rounded-b-2xl bg-white/95 px-4 py-3 shadow-sm backdrop-blur sm:rounded-2xl">
                          <button onClick={() => setPerso('')} className="rounded-xl bg-gray-100 px-4 py-2 text-sm font-semibold hover:bg-gray-200">← Retour aux formules</button>
                          <p className="min-w-0 flex-1 truncate font-display font-bold">{pk.nom}</p>
                          <p className="tabular hidden text-sm text-gray-600 sm:block">{eur(packsCalc[pk.id].htP)}{xHT()}{packsCalc[pk.id].htM > 0 ? ` + ${eur(packsCalc[pk.id].htM)}${xHT()} / mois` : ''}</p>
                        </div>
                  <PackEditor s={s} pk={pk} r={packsCalc[pk.id]} actif={s.pack === pk.id} remiseInput={remiseInput} onPrio={(id, v) => setPrest(id, { priorite: v })}
                    onPack={patch => setPack(pk.id, patch)} onItem={(id, val) => setPackItem(pk.id, id, val)}
                    onSave={() => { setPerso(''); toast(`${pk.nom} enregistré sur cet appareil.`); }}
                    onChoisir={() => choisir(pk.id)}
                    onReset={() => { if (confirm(`Remettre le ${pk.nom} dans sa composition d'origine (prestations, prix, remises, textes) ?`)) setPack(pk.id, { ...PACKS.find(x => x.id === pk.id) }); }} />
                        <div className="h-8" />
                      </div>
                    </div>
                  );
                })()}
                <p className="mt-5 text-sm text-gray-500">Les formules utilisent les prix du catalogue (onglet À la carte). Une prestation n'apparaît qu'une fois par formule.</p>
              </div>
            )}
            {s.mode === 'carte' && <>
            {(s.offres || OFFRES).map((o, i) => {
              const items = s.prestations.filter(p => (OFFRE_IDS.includes(p.offre) ? p.offre : 'base') === o.id);
              const r = c.offres.find(x => x.id === o.id);
              return (
                <div key={o.id} className="mb-8 last:mb-0">
                  <div className="mb-3 flex flex-wrap items-baseline justify-between gap-2 border-b border-gray-100 pb-2">
                    <h3 className="font-display text-lg font-semibold"><span className="mr-2 text-gray-400">{i + 1}</span>{o.nom}{o.id === 'fidel' && <span className="ml-2 rounded-full bg-gray-100 px-2 py-0.5 align-middle font-sans text-[11px] font-semibold text-gray-600">Option</span>}</h3>
                    <span className="tabular text-sm text-gray-500">{r ? [r.htP > 0 && eur(r.htP) + xHT(), r.htM > 0 && eur(r.htM) + xHT() + ' / mois'].filter(Boolean).join(' + ') : 'rien de coché'}</span>
                  </div>
                  <div className="grid gap-3 lg:grid-cols-2">
                    {items.map(p => (
                      <PrestationCard key={p.id} p={p} offres={s.offres || OFFRES} suggested={sugg.has(p.id)} onChange={patch => setPrest(p.id, patch)}
                        onRemove={p.id.startsWith('perso-') ? () => set(prev => ({ prestations: prev.prestations.filter(x => x.id !== p.id) })) : null} />
                    ))}
                  </div>
                  <div className="mt-3 flex flex-wrap gap-4 text-sm font-medium text-accent">
                    <button onClick={() => addCustom('ponctuel', o.id)} className="hover:underline">+ Prestation (une fois)</button>
                    <button onClick={() => addCustom('mensuel', o.id)} className="hover:underline">+ Abonnement (par mois)</button>
                  </div>
                </div>
              );
            })}
            <div className="mt-6 rounded-2xl bg-gray-50 p-4 sm:p-5">
              <p className="font-display text-lg font-semibold">Les catégories</p>
              <p className="mb-4 text-sm text-gray-500">Leurs noms regroupent les prestations dans la proposition, à la carte comme en formule.</p>
              <div className="space-y-3">
                {(s.offres || OFFRES).map((o, i) => {
                  const r = c.offres.find(x => x.id === o.id);
                  return (
                    <div key={o.id} className="grid gap-2 border-b border-gray-200 pb-3 last:border-0 sm:grid-cols-[1fr_1.4fr_auto] sm:items-center">
                      <input className={inputCls + ' font-semibold'} value={o.nom} aria-label={'Nom de l\'offre ' + (i + 1)}
                        onChange={e => set(p => ({ offres: (p.offres || OFFRES).map(x => x.id === o.id ? { ...x, nom: e.target.value } : x) }))} />
                      <input className={inputCls + ' text-sm'} value={o.tag} aria-label="Phrase d'accroche"
                        onChange={e => set(p => ({ offres: (p.offres || OFFRES).map(x => x.id === o.id ? { ...x, tag: e.target.value } : x) }))} />
                      <span className="tabular text-sm text-gray-600 sm:text-right">{r ? `${r.items.length} presta. · ${eur(r.ttcP)} + ${eur(r.ttcM)}/mois${xTTC()}` : 'vide'}</span>
                      <textarea rows={2} className={inputCls + ' text-sm sm:col-span-3'} value={o.explication || ''} aria-label="Explication simple"
                        placeholder="En une phrase simple : c'est quoi ?"
                        onChange={e => set(p => ({ offres: (p.offres || OFFRES).map(x => x.id === o.id ? { ...x, explication: e.target.value } : x) }))} />
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="mt-6 rounded-2xl bg-gray-50 p-4 sm:p-5">
              <p className="font-display text-lg font-semibold">Formules proposées dans le devis</p>
              <p className="mb-4 text-sm text-gray-500">Elles regroupent les packs cochés ci-dessus avec une remise. Dans le devis, le client choisit un pack seul ou une formule.</p>
              <div className="space-y-4">
                {(s.combos || COMBOS).map(k => {
                  const r = combos(s, c).find(x => x.id === k.id);
                  const maj = (patch) => set(p => ({ combos: (p.combos || COMBOS).map(x => x.id === k.id ? { ...x, ...patch } : patch.recommande ? { ...x, recommande: false } : x) }));
                  return (
                    <div key={k.id} className="grid gap-2 border-b border-gray-200 pb-4 last:border-0 sm:grid-cols-[1fr_1.3fr_130px]">
                      <input className={inputCls + ' font-semibold'} value={k.nom} aria-label="Nom de la formule" onChange={e => maj({ nom: e.target.value })} />
                      <input className={inputCls + ' text-sm'} value={k.sous} aria-label="Sous-titre" onChange={e => maj({ sous: e.target.value })} />
                      <div className="relative">
                        <input type="number" inputMode="decimal" min="0" max="100" className={inputCls + ' tabular pr-16'} value={k.remise} aria-label="Remise en %" onChange={e => maj({ remise: e.target.value })} />
                        <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">% remise</span>
                      </div>
                      <div className="flex flex-wrap items-center gap-2 sm:col-span-3">
                        {(s.offres || OFFRES).map(o => (
                          <Chip key={o.id} active={k.blocs.includes(o.id)} onClick={() => maj({ blocs: k.blocs.includes(o.id) ? k.blocs.filter(x => x !== o.id) : OFFRE_IDS.filter(x => x === o.id || k.blocs.includes(x)) })}>{o.nom.replace(/^(Pack|Option)\s+/, '')}</Chip>
                        ))}
                        <label className="ml-1 flex items-center gap-1.5 text-sm text-gray-600">
                          <input type="radio" name="combo-reco" checked={!!k.recommande} onChange={() => maj({ recommande: true })} className="h-4 w-4 accent-[#1f3a5f]" />Recommandée
                        </label>
                        <span className="tabular ml-auto text-sm text-gray-600">{r ? [r.htP > 0 && eur(r.htP) + xHT(), r.htM > 0 && eur(r.htM) + xHT() + '/mois'].filter(Boolean).join(' + ') : 'non affichée (packs pas encore cochés)'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            <Comparaison s={s} onProposer={proposer} />
            </>}
          </Section>
          </div>

          {/* 4. Tarifs et remises */}
          <Section n="4" title="Tarifs et remises" hint={`${FRANCHISE ? 'TVA non applicable' : 'TVA ' + s.tva + ' %'} · ${c.mois ? 'engagement ' + c.mois + ' mois' : 'sans engagement'}${c.remP + c.remM > 0.005 ? ' · remise appliquée' : ''}`}
            open={!!open.tarifs} onToggle={() => toggle('tarifs')}>
            <div className="grid gap-6 lg:grid-cols-[1fr_340px]">
              <div className="space-y-6">
                <div className="grid gap-5 sm:grid-cols-2">
                  {remiseInput('ponctuel', c.mode === 'formule' && c.pack ? `Remise ${c.pack.nom} · à la commande` : 'Remise sur la création', c.mode === 'formule' && c.pack ? c.pack.id : undefined)}
                  {remiseInput('mensuel', c.mode === 'formule' && c.pack ? `Remise ${c.pack.nom} · par mois` : 'Remise sur les mensualités', c.mode === 'formule' && c.pack ? c.pack.id : undefined)}
                </div>
                <div>
                  <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">Durée d'engagement</p>
                  <div className="flex flex-wrap gap-2">{ENGAGEMENTS.map(e => <Chip key={e.v} active={s.engagement === e.v} onClick={() => set({ engagement: e.v })}>{e.label}</Chip>)}</div>
                </div>
                <div className="grid gap-5 sm:grid-cols-3">
                  <Field label="TVA (%) · 0 = non applicable"><input type="number" inputMode="decimal" min="0" className={inputCls + ' tabular'} value={s.tva} onChange={e => set({ tva: e.target.value })} /></Field>
                  <Field label="Validité du devis (jours)"><input type="number" inputMode="numeric" min="1" className={inputCls + ' tabular'} value={s.validite} onChange={e => set({ validite: e.target.value })} /></Field>
                  <div>
                    <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">Acompte</p>
                    <div className="flex items-center gap-2">
                      <input type="checkbox" checked={s.acompte.actif} onChange={e => set(p => ({ acompte: { ...p.acompte, actif: e.target.checked } }))} className="h-5 w-5 accent-[#1f3a5f]" aria-label="Activer l'acompte" />
                      <input type="number" inputMode="decimal" min="0" max="100" disabled={!s.acompte.actif} className={inputCls + ' tabular w-24 disabled:bg-gray-50 disabled:text-gray-400'} value={s.acompte.pct}
                        onChange={e => set(p => ({ acompte: { ...p.acompte, pct: e.target.value } }))} />
                      <span className="text-sm text-gray-500">%</span>
                    </div>
                  </div>
                </div>
              </div>
              <div className="rounded-2xl bg-gray-50 p-5 text-sm">
                {[['Création' + xHT(), eur(c.brutP)], c.remP > 0.005 ? ['Remise création', '−' + eur(c.remP)] : null, [FRANCHISE ? 'Création, net à payer' : 'Création TTC', eur(c.ttcP)],
                  ['Mensualité' + xHT(), eur(c.brutM)], c.remM > 0.005 ? ['Remise mensuelle', '−' + eur(c.remM)] : null, [FRANCHISE ? 'Mensualité, net à payer' : 'Mensualité TTC', eur(c.ttcM)]]
                  .filter(Boolean).map(([l, v]) => <div key={l} className="flex justify-between py-1"><span className="text-gray-600">{l}</span><span className="tabular font-medium">{v}</span></div>)}
                <div className="mt-2 border-t border-gray-200 pt-2">
                  <div className="flex justify-between py-1 font-semibold"><span>{(c.mois ? `Total ${c.mois} mois` : 'Total 1er mois') + xTTC()}</span><span className="tabular">{eur(c.totalTTC)}</span></div>
                  {c.acompte > 0 && <div className="flex justify-between py-1 text-gray-600"><span>Acompte ({s.acompte.pct} %)</span><span className="tabular">{eur(c.acompte)}</span></div>}
                </div>
              </div>
            </div>
          </Section>

          {/* 5. Visuels */}
          <Section n="5" title="Visuels et démonstration" hint={[s.visuels.logo && 'logo', s.visuels.photos.length && `${s.visuels.photos.length} photo(s)`, s.visuels.demoUrl && 'site de démo'].filter(Boolean).join(' · ') || 'Logo, photos du commerce, site de démonstration'}
            open={!!open.visuels} onToggle={() => toggle('visuels')}>
            <div className="grid gap-6 sm:grid-cols-[200px_1fr]">
              <div>
                <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">Logo</p>
                <label className="grid aspect-square cursor-pointer place-items-center overflow-hidden rounded-2xl border border-dashed border-gray-300 bg-gray-50 text-sm text-gray-500 hover:border-gray-400">
                  {s.visuels.logo ? <img src={s.visuels.logo} alt="Logo" className="max-h-full max-w-full object-contain p-4" /> : <span>Ajouter le logo</span>}
                  <input type="file" accept="image/*" className="hidden" onChange={e => addLogo(e.target.files[0])} />
                </label>
                {s.visuels.logo && <button onClick={() => set(p => ({ visuels: { ...p.visuels, logo: '' } }))} className="mt-2 text-xs text-gray-400 hover:text-red-600">Retirer</button>}
              </div>
              <div>
                <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">Photos du commerce</p>
                <div className="grid grid-cols-3 gap-2 sm:grid-cols-4">
                  {s.visuels.photos.map((ph, i) => (
                    <div key={i} className="group relative">
                      <button onClick={() => setPreview(i)} className="block w-full"><img src={ph} alt="" className="aspect-square w-full rounded-xl object-cover" /></button>
                      <button onClick={() => set(p => ({ visuels: { ...p.visuels, photos: p.visuels.photos.filter((_, j) => j !== i) } }))}
                        className="absolute right-1.5 top-1.5 grid h-7 w-7 place-items-center rounded-full bg-black/60 text-white" aria-label="Retirer la photo">×</button>
                    </div>
                  ))}
                  <label className="grid aspect-square cursor-pointer place-items-center rounded-xl border border-dashed border-gray-300 bg-gray-50 text-center text-sm text-gray-500 hover:border-gray-400">
                    <span>+ Photos<br /><span className="text-xs">appareil ou galerie</span></span>
                    <input type="file" accept="image/*" multiple className="hidden" onChange={e => addPhotos([...e.target.files])} />
                  </label>
                </div>
              </div>
            </div>
            <div className="mt-6 flex flex-wrap items-end gap-3">
              <Field label="Site internet de démonstration" className="min-w-[240px] flex-1">
                <input className={inputCls} type="url" inputMode="url" value={s.visuels.demoUrl} onChange={e => set(p => ({ visuels: { ...p.visuels, demoUrl: e.target.value.trim() } }))} placeholder="https://…" />
              </Field>
              {s.visuels.demoUrl && <a href={s.visuels.demoUrl} target="_blank" rel="noopener" className="rounded-xl bg-ink px-4 py-2.5 text-sm font-semibold text-white">Ouvrir la démo</a>}
            </div>
          </Section>

          {/* 6. Contenu de la proposition */}
          <Section n="6" title="Contenu de la proposition" hint="Présentation, services inclus, paiement, vos coordonnées" open={!!open.contenu} onToggle={() => toggle('contenu')}>
            <div className="space-y-5">
              <Field label="Présentation du projet (laisser vide pour un texte automatique)">
                <textarea rows={3} className={inputCls} value={s.presentation} onChange={e => set({ presentation: e.target.value })} placeholder="Quelques lignes sur le projet du client…" />
              </Field>
              <div className="grid gap-5 sm:grid-cols-2">
                <Field label="Maintenance et services inclus (une ligne par élément)"><textarea rows={5} className={inputCls} value={s.inclus} onChange={e => set({ inclus: e.target.value })} /></Field>
                <Field label="Conditions de paiement"><textarea rows={5} className={inputCls} value={s.paiement} onChange={e => set({ paiement: e.target.value })} /></Field>
              </div>
              <div>
                <p className="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500">Vos coordonnées (conservées d'un client à l'autre)</p>
                <div className="grid gap-4 sm:grid-cols-2">
                  {[['nom', 'Votre nom'], ['societe', 'Votre société'], ['telephone', 'Téléphone'], ['email', 'Email'], ['siret', 'SIRET']].map(([k, l]) => (
                    <Field key={k} label={l}><input className={inputCls} value={s.vendeur[k]} onChange={e => setVendeur(k, e.target.value)} /></Field>
                  ))}
                </div>
              </div>
            </div>
          </Section>
        </main>

        {/* Bouton principal mobile */}
        <div className="fixed inset-x-0 bottom-0 z-40 border-t border-gray-200 bg-white/95 p-3 backdrop-blur sm:hidden" style={{ paddingBottom: 'calc(.75rem + env(safe-area-inset-bottom))' }}>
          <button onClick={generate} className="w-full rounded-xl bg-accent py-3.5 text-base font-semibold text-white shadow-sm active:brightness-110">Générer la proposition commerciale</button>
        </div>

        {preview !== null && (
          <div className="fixed inset-0 z-[60] grid place-items-center bg-black/90 p-4" onClick={() => setPreview(null)}>
            <img src={s.visuels.photos[preview]} alt="" className="max-h-[85vh] max-w-full rounded-lg object-contain" />
            <p className="absolute bottom-6 text-sm text-white/70">Touchez pour fermer</p>
          </div>
        )}
      </div>

      {showProposal && !showDevis && <Proposal s={s} c={c} cTous={cTous} numero={numero} onClose={() => setShowProposal(false)} toast={toast}
        onExclu={(pid) => set(p => ({ exclus: { ...(p.exclus || {}), [pid]: !(p.exclus || {})[pid] } }))}
        onChoix={(choisi) => set({ choisi })} onOption={() => set(p => ({ optionOuverte: !p.optionOuverte }))} onDevis={() => { setShowDevis(true); window.scrollTo(0, 0); }} />}
      {showProposal && showDevis && (() => { const d = devisCalc(s, c); return d
        ? <Devis s={s} d={d} numero={numero} toast={toast} onBack={() => setShowDevis(false)} />
        : (setTimeout(() => setShowDevis(false)), null); })()}
      <Toast msg={msg} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
