/* ============================ Phase 1 : tableau de bord, pipeline, fiche client 360° ============================ */
const PERIODES = [['mois', 'Ce mois'], ['trimestre', 'Ce trimestre'], ['annee', 'Cette année'], ['tout', 'Tout']];
const debutPeriode = (p) => { const d = new Date(); if (p === 'mois') return new Date(d.getFullYear(), d.getMonth(), 1);
  if (p === 'trimestre') return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3, 1); if (p === 'annee') return new Date(d.getFullYear(), 0, 1); return new Date(0); };
const dansPeriode = (iso, p) => !!iso && new Date(iso) >= debutPeriode(p);
const valeurContrat = (x) => x.P + x.M * Math.max(1, x.mois || 0); // création + mensuel sur la durée d'engagement
const OUVERTES = ['a_contacter', 'rdv', 'proposition', 'negociation'];

// Remet l'index à jour depuis les dossiers (montants signés, probabilités…)
function rafraichirIndex() {
  const idx = lireJSON(IDX); if (!idx) return null;
  let change = false;
  idx.dossiers = idx.dossiers.map(e => { const st = lireJSON(DK(e.id)); if (!st) return e; const n = entreeDe(e.id, st, e);
    const a = JSON.stringify({ ...e, maj: 0 }), b = JSON.stringify({ ...n, maj: 0 }); if (a === b) return e; change = true; return { ...n, maj: e.maj }; });
  if (change) { try { ecrireJSON(IDX, idx); } catch {} }
  return idx;
}

// Change l'étape d'un dossier depuis le pipeline (glisser-déposer ou flèches)
function changerEtapeDossier(id, etape) {
  const st = lireJSON(DK(id)); if (!st) return false;
  const su = st.suivi || {};
  if (normEtape(su.etape) === etape) return false;
  let motif = '';
  if (etape === 'perdu') { motif = prompt('Motif de la perte ? (prix, pas le moment, concurrent…)'); if (motif === null) return false; }
  if (etape === 'signe' && !Object.keys(st.signes || {}).length && !confirm('Marquer cette affaire comme gagnée sans devis signé électroniquement ?')) return false;
  st.suivi = { ...su, etape, proba: undefined, ...(etape === 'perdu' ? { motif, perduLe: new Date().toISOString() } : {}), ...(etape === 'signe' ? { gagneLe: su.gagneLe || new Date().toISOString() } : {}),
    ...(etape === 'signe' || etape === 'perdu' ? { prochaine: { date: '', action: '' } } : {}),
    historique: [...(su.historique || []), { date: new Date().toISOString(), type: 'auto', texte: `Étape : ${etapeDe(etape).label}${motif ? ' · ' + motif : ''}` }] };
  sauverDossier(id, st);
  return true;
}

// Indicateurs, tous calculés à partir des dossiers
function indicateurs(ds, periode) {
  const actifs = ds.filter(d => !d.archive);
  const signes = ds.flatMap(d => (d.signesListe || []).map(x => ({ ...x, dossier: d })));
  const signesP = signes.filter(x => dansPeriode(x.quand, periode));
  const gagnes = ds.filter(d => d.etape === 'signe' && dansPeriode(d.gagneLe || ((d.signesListe || [])[0] || {}).quand, periode)).length;
  const perdus = ds.filter(d => d.etape === 'perdu' && dansPeriode(d.perduLe || d.maj, periode)).length;
  const ouvertes = actifs.filter(d => OUVERTES.includes(d.etape));
  const enAttente = actifs.filter(d => ['proposition', 'negociation'].includes(d.etape));
  const auj = isoJour();
  return {
    caSigne: signesP.reduce((a, x) => a + valeurContrat(x), 0),
    caSigneP: signesP.reduce((a, x) => a + x.P, 0), caSigneM: signesP.reduce((a, x) => a + x.M, 0), nbSignes: signesP.length,
    mrr: ds.filter(d => d.etape === 'signe').reduce((a, d) => a + (d.signesListe || []).reduce((b, x) => b + x.M, 0), 0),
    enAttente: enAttente.length, montantAttente: enAttente.reduce((a, d) => a + (d.estime || 0), 0),
    prospects: actifs.filter(d => ['a_contacter', 'rdv'].includes(d.etape)).length,
    conversion: gagnes + perdus ? Math.round(gagnes / (gagnes + perdus) * 100) : null, gagnes, perdus,
    pondere: ouvertes.reduce((a, d) => a + (d.estime || 0) * (d.proba ?? 0) / 100, 0),
    moyen: signesP.length ? signesP.reduce((a, x) => a + valeurContrat(x), 0) / signesP.length : 0,
    actions: actifs.filter(d => OUVERTES.includes(d.etape) && d.prochaine && d.prochaine.date).sort((a, b) => a.prochaine.date.localeCompare(b.prochaine.date)).slice(0, 8),
    rdvs: actifs.filter(d => d.rdv && d.rdv.date && d.rdv.date >= auj).sort((a, b) => (a.rdv.date + a.rdv.heure).localeCompare(b.rdv.date + b.rdv.heure)).slice(0, 5),
  };
}

/* ============================ Phase 2 : commandes, factures, paiements, avoirs ============================ */
// Montants financiers en CENTIMES (entiers) : pas d'erreur d'arrondi. Une facture émise n'est jamais modifiée :
// on la corrige par un avoir. Ce module aide à facturer ; ce n'est pas un logiciel de comptabilité certifié.
const FK = 'crm-v3-finance';
const cts = (e) => Math.round(num(e) * 100);
const eurC = (c) => eur((c || 0) / 100);
const lireFinance = () => ({ v: 1, compteurs: {}, commandes: [], factures: [], paiements: [], journal: [], abonnements: [], depenses: [], ...(lireJSON(FK) || {}) });
const prochainNumero = (f, type) => {
  const an = new Date().getFullYear(), k = type + '-' + an;
  f.compteurs = { ...(f.compteurs || {}) }; f.compteurs[k] = (f.compteurs[k] || 0) + 1;
  return `${{ facture: 'FA', avoir: 'AV', commande: 'CMD' }[type]}-${an}-${String(f.compteurs[k]).padStart(type === 'commande' ? 3 : 4, '0')}`;
};
function useFinance() {
  const [f, setF] = useState(lireFinance);
  useEffect(() => { const h = (e) => { if (e.key === FK) setF(lireFinance()); }; window.addEventListener('storage', h); return () => window.removeEventListener('storage', h); }, []);
  // maj(fn, journal) : modifie, trace et enregistre ; renvoie ce que fn renvoie
  const maj = (fn, journal) => { const x = lireFinance(); const r = fn(x); if (journal) x.journal = [...(x.journal || []), { date: new Date().toISOString(), ...journal }];
    ecrireJSON(FK, x); setF(x); return r; };
  return [f, maj];
}
const MODES_PAIEMENT = ['Virement', 'Carte bancaire', 'Chèque', 'Espèces', 'Prélèvement'];
const STATUTS_FACTURE = {
  brouillon: ['Brouillon', 'bg-gray-100 text-gray-700'], emise: ['Émise', 'bg-sky-100 text-sky-800'], envoyee: ['Envoyée', 'bg-indigo-100 text-indigo-800'],
  partielle: ['Partiellement payée', 'bg-amber-100 text-amber-800'], payee: ['Payée', 'bg-emerald-100 text-emerald-800'], retard: ['En retard', 'bg-red-100 text-red-700'],
  annulee: ['Annulée par avoir', 'bg-gray-200 text-gray-600 line-through'], avoir: ['Avoir', 'bg-violet-100 text-violet-800'],
};
const STATUTS_COMMANDE = { en_cours: ['En cours', '#0369a1'], validation: ['Validation client', '#b45309'], livree: ['Livrée', '#047857'], annulee: ['Annulée', '#9ca3af'] };
const Badge = ({ k, map = STATUTS_FACTURE }) => <span className={'whitespace-nowrap rounded-full px-2.5 py-0.5 text-[11px] font-bold ' + (map[k] || ['', ''])[1]}>{(map[k] || [k])[0]}</span>;
const totalLignes = (lignes) => lignes.reduce((a, x) => a + Math.round(num(x.qte || 1) * (x.pu || 0)), 0);

// État de paiement d'une facture, calculé (jamais saisi à la main)
function etatFacture(fa, f) {
  if (fa.type === 'avoir') return { paye: 0, avoirs: 0, du: -fa.totalTTC, reste: 0, statut: fa.statut === 'brouillon' ? 'brouillon' : 'avoir' };
  const paye = f.paiements.filter(p => p.factureId === fa.id).reduce((a, p) => a + (p.type === 'remboursement' ? -p.montant : p.montant), 0);
  const avoirs = f.factures.filter(x => x.type === 'avoir' && x.factureOrigine === fa.id && x.statut !== 'brouillon').reduce((a, x) => a + x.totalTTC, 0);
  const du = fa.totalTTC - avoirs, reste = du - paye;
  let statut = fa.statut;
  if (fa.statut !== 'brouillon') {
    if (avoirs >= fa.totalTTC && paye <= 0) statut = 'annulee';
    else if (reste <= 0) statut = 'payee';
    else if (fa.dateEcheance && fa.dateEcheance < isoJour()) statut = 'retard';
    else if (paye > 0) statut = 'partielle';
  }
  return { paye, avoirs, du, reste: Math.max(0, reste), trop: Math.max(0, -reste), statut };
}
// Soldes par client : facturé (factures émises − avoirs) − encaissé
function soldesClients(f) {
  const s = {};
  const ligne = (id) => (s[id] = s[id] || { facture: 0, encaisse: 0, retard: 0 });
  f.factures.filter(x => x.statut !== 'brouillon').forEach(x => { ligne(x.dossierId).facture += x.type === 'avoir' ? -x.totalTTC : x.totalTTC;
    if (x.type !== 'avoir' && etatFacture(x, f).statut === 'retard') ligne(x.dossierId).retard += etatFacture(x, f).reste; });
  f.paiements.forEach(p => { ligne(p.dossierId).encaisse += p.type === 'remboursement' ? -p.montant : p.montant; });
  Object.values(s).forEach(x => { x.solde = x.facture - x.encaisse; });
  return s;
}
const nomDossier = (id) => ((lireJSON(IDX) || { dossiers: [] }).dossiers.find(d => d.id === id) || {}).entreprise || 'Client supprimé';

// Commande créée à partir d'un devis signé (version signée figée) ou, à défaut, du devis en cours
const SITE_IDS = ['site', 'miseenligne', 'domaine', 'hebergement', 'maintenance', 'majsite'];
const SOCIAL_IDS = ['social', 'contenus', 'reels', 'tiktok', 'blog'];
function creerCommande(maj, dossierId, devisNumero) {
  const st = load(lireJSON(DK(dossierId)));
  const sg = (st.signes || {})[devisNumero], sn = sg && sg.payload && lire(sg.payload);
  const d = sn ? sn.d : devisCalc(st, compute(st));
  if (!d) return null;
  const lignes = (part, type) => part.groupes.flatMap(o => o.lignes.map(p => ({ id: p.id, bloc: o.id, nom: p.nom, type, qte: Math.max(1, num(p.qte) || 1), pu: cts(p.prix) })));
  const lP = lignes(d.P, 'ponctuel'), lM = lignes(d.M, 'mensuel');
  const ids = [...lP, ...lM].map(x => x.id);
  return maj(f => {
    const c = { id: nouvelId(), numero: prochainNumero(f, 'commande'), dossierId, devisNumero, titre: d.titre, creeLe: new Date().toISOString(),
      lignes: [...lP, ...lM], brutP: cts(d.P.brut), netP: cts(d.P.ttc), brutM: cts(d.M.brut), netM: cts(d.M.ttc), mois: d.mois || 0,
      acomptePct: st.acompte && st.acompte.actif ? num(st.acompte.pct) : 0, statut: 'en_cours', livraisonPrevue: plusJours(30), responsable: vendeurInfo(st.vendeur).nom,
      taches: lP.map(x => ({ id: nouvelId(), texte: 'Réaliser : ' + x.nom, responsable: '', echeance: '', fait: false })),
      site: ids.some(i => SITE_IDS.includes(i)) ? { url: '', domaine: '', hebergement: '', maintenance: lM.some(x => x.id === 'maintenance') ? 'Incluse' : '', miseEnLigne: '', renouvellement: '' } : null,
      social: ids.some(i => SOCIAL_IDS.includes(i)) ? { frequence: '', prevues: 0, produites: 0, publiees: 0 } : null,
      validationClient: '', livreeLe: '' };
    f.commandes = [...f.commandes, c];
    return c.id;
  }, { action: 'commande créée', ref: devisNumero, dossierId });
}

// Factures : acompte, solde (en déduisant les acomptes), mensualité, ou libre. Créées en brouillon.
function creerFacture(maj, cmd, mode) {
  const st = load(lireJSON(DK(cmd.dossierId)));
  const tva = num(st.tva);
  return maj(f => {
    const deCmd = f.factures.filter(x => x.commandeId === cmd.id && x.statut !== 'brouillon' && x.type === 'facture' && etatFacture(x, f).statut !== 'annulee');
    let lignes = [], objet = '';
    if (mode === 'acompte') {
      const pct = cmd.acomptePct || 30;
      objet = `Acompte de ${pct} % · commande ${cmd.numero} (devis ${cmd.devisNumero})`;
      lignes = [{ designation: `Acompte de ${pct} % sur la commande ${cmd.numero} : ${cmd.titre}`, qte: 1, pu: Math.round(cmd.netP * pct / 100) }];
    } else if (mode === 'solde') {
      objet = `Réalisations · commande ${cmd.numero} (devis ${cmd.devisNumero})`;
      lignes = cmd.lignes.filter(x => x.type === 'ponctuel').map(x => ({ designation: x.nom, qte: x.qte, pu: x.pu }));
      if (cmd.brutP - cmd.netP > 0) lignes.push({ designation: 'Remise commerciale', qte: 1, pu: -(cmd.brutP - cmd.netP) });
      deCmd.filter(x => x.nature === 'acompte').forEach(x => lignes.push({ designation: `Acompte déjà facturé (facture ${x.numero})`, qte: 1, pu: -x.totalHT }));
    } else if (mode === 'mensuel') {
      const mois = new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      objet = `Abonnement · ${mois} · commande ${cmd.numero}`;
      lignes = cmd.lignes.filter(x => x.type === 'mensuel').map(x => ({ designation: `${x.nom} (${mois})`, qte: x.qte, pu: x.pu }));
      if (cmd.brutM - cmd.netM > 0) lignes.push({ designation: 'Remise commerciale', qte: 1, pu: -(cmd.brutM - cmd.netM) });
    } else { objet = `Commande ${cmd.numero}`; lignes = [{ designation: '', qte: 1, pu: 0 }]; }
    const fa = { id: nouvelId(), type: 'facture', nature: mode, numero: '', statut: 'brouillon', dossierId: cmd.dossierId, commandeId: cmd.id, objet, lignes, tva,
      dateEmission: '', dateEcheance: '', creeLe: new Date().toISOString(), journal: [{ date: new Date().toISOString(), texte: 'Brouillon créé' }] };
    Object.assign(fa, totauxFacture(fa));
    f.factures = [...f.factures, fa];
    return fa.id;
  }, { action: 'brouillon de facture', ref: cmd.numero, dossierId: cmd.dossierId });
}
const totauxFacture = (fa) => { const ht = totalLignes(fa.lignes); const t = Math.round(ht * num(fa.tva) / 100); return { totalHT: ht, totalTVA: t, totalTTC: ht + t }; };

          </a>; })}</div>
          : <div className="rounded-2xl border border-dashed border-gray-300 p-8 text-center text-sm text-gray-500">Aucune commande ici. Une commande se crée depuis la fiche d'un client, à partir d'un devis signé.</div>}

function FormPaiement({ f, maj, dossierId, factureId, onFini, type = 'paiement' }) {
  const ouvertes = f.factures.filter(x => x.type === 'facture' && x.statut !== 'brouillon' && (!dossierId || x.dossierId === dossierId) && (type === 'remboursement' ? etatFacture(x, f).trop > 0 : etatFacture(x, f).reste > 0));
  const [fid, setFid] = useState(factureId || (ouvertes[0] || {}).id || '');
  const fa = f.factures.find(x => x.id === fid), et = fa && etatFacture(fa, f);
  const [montant, setMontant] = useState(et ? ((type === 'remboursement' ? et.trop : et.reste) / 100).toFixed(2) : '');
  const [date, setDate] = useState(isoJour()), [mode, setMode] = useState('Virement'), [note, setNote] = useState('');
  const valider = () => {
    const m = cts(montant);
    if (!fa) return alert('Choisissez une facture émise.');
    if (m <= 0) return alert('Le montant doit être positif.');
    const max = type === 'remboursement' ? et.trop : et.reste;
    if (m > max && !confirm(`Le montant dépasse ${type === 'remboursement' ? 'le trop-perçu' : 'le reste dû'} (${eurC(max)}). Enregistrer quand même ?`)) return;
    maj(x => { x.paiements = [...x.paiements, { id: nouvelId(), type, dossierId: fa.dossierId, factureId: fa.id, date, montant: m, mode, note, creeLe: new Date().toISOString() }]; },
      { action: type === 'remboursement' ? 'remboursement' : 'paiement reçu', ref: fa.numero + ' · ' + eurC(m), dossierId: fa.dossierId });
    onFini && onFini();
  };
  if (!ouvertes.length && !factureId) return <p className="text-sm text-gray-500">{type === 'remboursement' ? 'Aucun trop-perçu à rembourser.' : 'Aucune facture émise en attente de paiement.'}</p>;
  return (
    <div className="grid gap-2 sm:grid-cols-2">
      <label className="text-sm sm:col-span-2"><span className="text-[11px] font-bold uppercase tracking-wider text-gray-500">Facture</span>
        <select value={fid} onChange={e => { setFid(e.target.value); const y = f.factures.find(z => z.id === e.target.value); if (y) { const e2 = etatFacture(y, f); setMontant(((type === 'remboursement' ? e2.trop : e2.reste) / 100).toFixed(2)); } }} className="mt-0.5 w-full rounded-lg border border-gray-200 px-3 py-2">
          {(factureId && !ouvertes.some(o => o.id === factureId) ? [fa, ...ouvertes] : ouvertes).filter(Boolean).map(x => <option key={x.id} value={x.id}>{x.numero} · {nomDossier(x.dossierId)} · reste {eurC(etatFacture(x, f).reste)}</option>)}
        </select></label>
      <label className="text-sm"><span className="text-[11px] font-bold uppercase tracking-wider text-gray-500">Montant (€)</span><input type="number" step="0.01" min="0" value={montant} onChange={e => setMontant(e.target.value)} className="mt-0.5 w-full rounded-lg border border-gray-200 px-3 py-2 text-right" /></label>
      <label className="text-sm"><span className="text-[11px] font-bold uppercase tracking-wider text-gray-500">Date</span><input type="date" value={date} onChange={e => setDate(e.target.value)} className="mt-0.5 w-full rounded-lg border border-gray-200 px-3 py-2" /></label>
      <label className="text-sm"><span className="text-[11px] font-bold uppercase tracking-wider text-gray-500">Mode</span><select value={mode} onChange={e => setMode(e.target.value)} className="mt-0.5 w-full rounded-lg border border-gray-200 px-3 py-2">{MODES_PAIEMENT.map(m => <option key={m}>{m}</option>)}</select></label>
      <label className="text-sm"><span className="text-[11px] font-bold uppercase tracking-wider text-gray-500">Note</span><input value={note} onChange={e => setNote(e.target.value)} placeholder="Réf. virement…" className="mt-0.5 w-full rounded-lg border border-gray-200 px-3 py-2" /></label>
      <button onClick={valider} className="rounded-xl bg-emerald-600 py-2.5 text-sm font-semibold text-white sm:col-span-2">{type === 'remboursement' ? 'Enregistrer le remboursement' : 'Enregistrer le paiement'}</button>
    </div>
  );
}

function PageFacture({ id }) {
  const [f, maj] = useFinance();
  const fa = f.factures.find(x => x.id === id);
  const [paiement, setPaiement] = useState(false), [rembours, setRembours] = useState(false), [msg, setMsg] = useState('');
  if (!fa) return <Shell page="factures"><div className="p-8 text-center text-gray-500">Facture introuvable. <a href="#/factures" className="underline">Retour</a></div></Shell>;
  const toast = (m) => { setMsg(m); setTimeout(() => setMsg(''), 4000); };
  const e = etatFacture(fa, f), brouillon = fa.statut === 'brouillon';
  const st = load(lireJSON(DK(fa.dossierId)) || {});
  const cl = st.client || {}, vi = vendeurInfo((lireJSON(IDX) || {}).vendeur || st.vendeur || {});
  FRANCHISE = num(fa.tva) === 0;
  const setF = (patch) => maj(x => { x.factures = x.factures.map(y => { if (y.id !== id) return y; if (y.statut !== 'brouillon') return y; const n = { ...y, ...patch }; return { ...n, ...totauxFacture(n) }; }); });
  const setLigne = (i, patch) => setF({ lignes: fa.lignes.map((l, j) => j === i ? { ...l, ...patch } : l) });
  const emettre = () => {
    if (!fa.lignes.length || fa.totalTTC === 0 && fa.type === 'facture') return alert('La facture est vide.');
    if (fa.lignes.some(l => !String(l.designation || '').trim())) return alert('Chaque ligne doit avoir une désignation.');
    if (!vi.siret || !(lireJSON(IDX) || {}).vendeur?.adresse) { if (!confirm('Votre SIRET ou votre adresse manque dans « Vos coordonnées » : ce sont des mentions obligatoires. Émettre quand même ?')) return; }
    if (!confirm(`Émettre la ${fa.type === 'avoir' ? 'note d\'avoir' : 'facture'} ?\n\nElle reçoit un numéro définitif et ne pourra plus être modifiée (seulement corrigée par un avoir).`)) return;

// Abonnement créé à partir des services mensuels d'une commande

const renouvellementDe = (a) => (a.engagement && a.debut ? ajouterMois(a.debut, num(a.engagement)) : '');
// Facture de la mensualité d'un abonnement (brouillon), et prochaine échéance avancée d'un mois
function facturerAbonnement(maj, a) {
  const cmd = lireFinance().commandes.find(c => c.id === a.commandeId);
  const st = load(lireJSON(DK(a.dossierId)) || {});
  return maj(f => {
    const mois = new Date((a.prochaineEcheance || isoJour()) + 'T12:00').toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    const brut = a.services.reduce((s, x) => s + x.montant, 0);
    const lignes = a.services.map(x => ({ designation: `${x.nom} (${mois})`, qte: 1, pu: x.montant }));
    if (brut - a.montantM > 0) lignes.push({ designation: 'Remise commerciale', qte: 1, pu: -(brut - a.montantM) });
    const fa = { id: nouvelId(), type: 'facture', nature: 'mensuel', abonnementId: a.id, numero: '', statut: 'brouillon', dossierId: a.dossierId, commandeId: a.commandeId,
      objet: `Abonnement · ${mois}${cmd ? ' · commande ' + cmd.numero : ''}`, lignes, tva: num(st.tva), dateEmission: '', dateEcheance: '', creeLe: new Date().toISOString(), journal: [{ date: new Date().toISOString(), texte: 'Brouillon créé' }] };

// Indicateurs récurrents sur une période
function recurrent(f, periode) {
  const abos = f.abonnements || [], auj = isoJour(), deb = isoJour(debutPeriode(periode));

  const mrr = actifs.reduce((s, a) => s + a.montantM, 0);
  const nouveaux = abos.filter(a => a.debut && a.debut >= deb);
  const resilies = abos.filter(a => a.resilieLe && a.resilieLe >= deb);
  const actifsDebut = abos.filter(a => aboActifA(a, deb)).length;
  return { mrr, arr: mrr * 12, actifs: actifs.length, nouveaux: nouveaux.length, resilies: resilies.length, perdu: resilies.reduce((s, a) => s + a.montantM, 0),
    churn: actifsDebut ? Math.round(resilies.length / actifsDebut * 100) : null };
}

// Rentabilité : CA facturé − dépenses. Ce n'est ni la trésorerie, ni le bénéfice net (cotisations et impôts non déduits).
function rentabilite(f, periode) {
  const deb = isoJour(debutPeriode(periode));
  const fact = f.factures.filter(x => x.statut !== 'brouillon' && x.dateEmission >= deb);
  const ca = fact.reduce((s, x) => s + (x.type === 'avoir' ? -x.totalTTC : x.totalTTC), 0);
  const dep = (f.depenses || []).filter(d => d.date >= deb);
  const depenses = dep.reduce((s, d) => s + d.montant, 0), directes = dep.filter(d => d.dossierId).reduce((s, d) => s + d.montant, 0);
  const encaisse = f.paiements.filter(p => p.date >= deb).reduce((s, p) => s + (p.type === 'remboursement' ? -p.montant : p.montant), 0);
  const parClient = {};
  fact.forEach(x => { const c = (parClient[x.dossierId] = parClient[x.dossierId] || { ca: 0, dep: 0 }); c.ca += x.type === 'avoir' ? -x.totalTTC : x.totalTTC; });
  dep.filter(d => d.dossierId).forEach(d => { const c = (parClient[d.dossierId] = parClient[d.dossierId] || { ca: 0, dep: 0 }); c.dep += d.montant; });
  return { ca, depenses, directes, margeBrute: ca - directes, resultat: ca - depenses, tresorerie: encaisse - depenses, encaisse, parClient };
}

// CA signé par prestation et par pack, à partir des commandes (montants nets : la remise est répartie au prorata)
function caParPrestation(f, deb) {
  const pres = {}, packs = {};
  f.commandes.filter(c => c.statut !== 'annulee' && c.creeLe >= deb).forEach(c => {
    const kP = c.brutP ? c.netP / c.brutP : 1, kM = c.brutM ? c.netM / c.brutM : 1;
    c.lignes.forEach(l => {
      const v = Math.round(l.pu * l.qte * (l.type === 'mensuel' ? kM * Math.max(1, c.mois || 0) : kP));
      const p = (pres[l.id] = pres[l.id] || { nom: (CATALOGUE.find(x => x.id === l.id) || {}).court || l.nom, ca: 0, n: 0 }); p.ca += v; p.n++;
      const bloc = l.bloc || (CATALOGUE.find(x => x.id === l.id) || {}).offre || 'base';
      const k = (packs[bloc] = packs[bloc] || { ca: 0, cmds: new Set() }); k.ca += v; k.cmds.add(c.id);
    });
  });
  return { pres, packs };
}

    if (c.site && c.site.renouvellement && c.site.renouvellement <= dans(30)) out.push({ niv: c.site.renouvellement < auj ? 3 : 1, txt: `Renouvellement du domaine ${c.site.domaine || ''}`, sous: `${nomDossier(c.dossierId)} · le ${jourCourt(c.site.renouvellement)}`, h: '#/commande/' + c.id });
  });

const NIVEAUX = { 3: ['Critique', 'bg-red-100 text-red-800', '⛔'], 2: ['Important', 'bg-amber-100 text-amber-900', '⚠'], 1: ['À suivre', 'bg-sky-100 text-sky-900', 'ℹ'] };

  if (!a.length) return <div className="rounded-2xl bg-white p-4 text-sm text-gray-500 ring-1 ring-black/5">✓ Rien à traiter : aucune relance, échéance ou retard.</div>;
  return (
    <div className="rounded-2xl bg-white p-4 ring-1 ring-black/5">
      <p className="font-semibold">À traiter <span className="font-normal text-gray-500">{a.length}</span></p>
      <ul className="mt-2 divide-y divide-gray-100">{(tout ? a : a.slice(0, max)).map((x, i) => (
        <li key={i}><a href={x.h} className="flex items-center gap-3 py-2.5 hover:bg-gray-50">
          <span className={'shrink-0 rounded-full px-2 py-0.5 text-[11px] font-bold ' + NIVEAUX[x.niv][1]}>{NIVEAUX[x.niv][2]} {NIVEAUX[x.niv][0]}</span>
          <span className="min-w-0"><span className="block truncate font-medium">{x.txt}</span><span className="block truncate text-[13px] text-gray-500">{x.sous}</span></span></a></li>))}</ul>
      {a.length > max && <button onClick={() => setTout(!tout)} className="mt-1 text-sm font-medium text-gray-500 underline">{tout ? 'Réduire' : `Voir les ${a.length} alertes`}</button>}
    </div>
  );
}

// ---------- graphiques (SVG, survol + vue tableau) ----------
const echelle = (max) => { if (max <= 0) return [0, 1]; const p = Math.pow(10, Math.floor(Math.log10(max))); const n = [1, 2, 2.5, 5, 10].map(k => k * p).find(v => v * 4 >= max) || p * 10; return [0, n * 4]; };
const eurCourt = (c) => { const e = c / 100; return Math.abs(e) >= 1000 ? (e / 1000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' k€' : Math.round(e) + ' €'; };
function CarteGraphe({ titre, sous, legende, children, tableau, vide }) {
  const [vue, setVue] = useState('graphe');
  return (
    <div className="rounded-2xl bg-white p-4 ring-1 ring-black/5">
      <div className="flex flex-wrap items-start justify-between gap-2">
        <div><p className="font-semibold">{titre}</p>{sous && <p className="text-xs text-gray-500">{sous}</p>}</div>
        {!vide && tableau && <button onClick={() => setVue(vue === 'graphe' ? 'table' : 'graphe')} className="rounded-lg px-2 py-1 text-xs font-medium text-gray-500 ring-1 ring-gray-200 hover:bg-gray-50">{vue === 'graphe' ? 'Voir le tableau' : 'Voir le graphique'}</button>}
      </div>
      {vide ? <p className="py-8 text-center text-sm text-gray-400">{vide}</p> : <>
        {legende && vue === 'graphe' && <div className="mt-2 flex flex-wrap gap-3 text-xs text-gray-600">{legende.map(([n, c]) => <span key={n} className="flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm" style={{ background: c }} />{n}</span>)}</div>}
        <div className="mt-2">{vue === 'graphe' ? children : tableau}</div>
      </>}
    </div>
  );
}
const TableSimple = ({ tete, lignes }) => (
  <div className="overflow-x-auto"><table className="tabular w-full text-[13px]"><thead><tr className="border-b border-gray-200 text-left text-[11px] uppercase tracking-wide text-gray-500">{tete.map((t, i) => <th key={i} className={'py-1.5 ' + (i ? 'text-right' : '')}>{t}</th>)}</tr></thead>
    <tbody>{lignes.map((l, i) => <tr key={i} className="border-b border-gray-50">{l.map((v, j) => <td key={j} className={'py-1.5 ' + (j ? 'text-right' : '')}>{v}</td>)}</tr>)}</tbody></table></div>);

function BarresMois({ mois, series }) {
  const [survol, setSurvol] = useState(null);
  const W = 640, H = 220, g = 44, b = 20, h = H - b - 8;
  const [, max] = echelle(Math.max(1, ...series.flatMap(s => s.valeurs)));
  const bande = (W - g) / mois.length, larg = Math.min(18, (bande - 10) / series.length - 2);
  const y = (v) => 8 + h - (v / max) * h;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label="Histogramme mensuel">
        {[0, 1, 2, 3, 4].map(i => { const v = max / 4 * i; return <g key={i}><line x1={g} x2={W} y1={y(v)} y2={y(v)} stroke="#e5e7eb" strokeWidth="1" /><text x={g - 6} y={y(v) + 3} textAnchor="end" fontSize="10" fill="#6b7280">{eurCourt(v)}</text></g>; })}
        {mois.map((m, i) => { const x0 = g + i * bande + (bande - series.length * (larg + 2)) / 2;
          return <g key={m}>
            {series.map((s, j) => { const v = s.valeurs[i], hh = Math.max(0, y(0) - y(v)), x = x0 + j * (larg + 2), r = Math.min(4, hh / 2, larg / 2);
              return hh > 0 ? <path key={j} d={`M${x},${y(0)} V${y(v) + r} Q${x},${y(v)} ${x + r},${y(v)} H${x + larg - r} Q${x + larg},${y(v)} ${x + larg},${y(v) + r} V${y(0)} Z`} fill={s.coul} opacity={survol === null || survol === i ? 1 : 0.35} /> : null; })}
            <text x={g + i * bande + bande / 2} y={H - 4} textAnchor="middle" fontSize="10" fill="#6b7280">{libMois(m)}</text>
            <rect x={g + i * bande} y="0" width={bande} height={H} fill="transparent" onMouseEnter={() => setSurvol(i)} onMouseLeave={() => setSurvol(null)} onTouchStart={() => setSurvol(i)} />
          </g>; })}
      </svg>
      {survol !== null && <div className="pointer-events-none absolute top-0 rounded-lg bg-white px-3 py-2 text-xs shadow-lg ring-1 ring-black/10" style={{ left: `min(calc(${((g + survol * bande + bande) / W) * 100}% + 4px), calc(100% - 170px))` }}>
        <p className="font-semibold">{libMois(mois[survol])}</p>{series.map(s => <p key={s.nom} className="flex items-center justify-between gap-4"><span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm" style={{ background: s.coul }} />{s.nom}</span><span className="tabular font-medium">{eurC(s.valeurs[survol])}</span></p>)}</div>}
    </div>
  );
}
function CourbeMois({ mois, valeurs, coul = SERIE[0], nom }) {
  const [survol, setSurvol] = useState(null);
  const W = 640, H = 180, g = 44, b = 20, h = H - b - 10;
  const [, max] = echelle(Math.max(1, ...valeurs));
  const pas = mois.length > 1 ? (W - g - 40) / (mois.length - 1) : 0, x = (i) => g + 16 + i * pas, y = (v) => 10 + h - (v / max) * h;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label={nom}>
        {[0, 1, 2, 3, 4].map(i => { const v = max / 4 * i; return <g key={i}><line x1={g} x2={W} y1={y(v)} y2={y(v)} stroke="#e5e7eb" /><text x={g - 6} y={y(v) + 3} textAnchor="end" fontSize="10" fill="#6b7280">{eurCourt(v)}</text></g>; })}
        {survol !== null && <line x1={x(survol)} x2={x(survol)} y1="10" y2={y(0)} stroke="#9ca3af" strokeDasharray="3 3" />}
        <polyline points={valeurs.map((v, i) => `${x(i)},${y(v)}`).join(' ')} fill="none" stroke={coul} strokeWidth="2" strokeLinejoin="round" />
        {valeurs.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r={survol === i ? 5 : 4} fill={coul} stroke="#fff" strokeWidth="2" />)}
        {mois.map((m, i) => <text key={m} x={x(i)} y={H - 4} textAnchor="middle" fontSize="10" fill="#6b7280">{libMois(m)}</text>)}
        {mois.map((m, i) => <rect key={'h' + m} x={x(i) - pas / 2} y="0" width={Math.max(pas, 30)} height={H} fill="transparent" onMouseEnter={() => setSurvol(i)} onMouseLeave={() => setSurvol(null)} onTouchStart={() => setSurvol(i)} />)}
      </svg>
      {survol !== null && <div className="pointer-events-none absolute top-0 rounded-lg bg-white px-3 py-2 text-xs shadow-lg ring-1 ring-black/10" style={{ left: `min(calc(${(x(survol) / W) * 100}% + 8px), calc(100% - 150px))` }}><p className="font-semibold">{libMois(mois[survol])}</p><p className="tabular">{nom} : <b>{eurC(valeurs[survol])}</b></p></div>}
    </div>
  );
}
function BarresH({ lignes, coul = SERIE[0] }) {
  const max = Math.max(1, ...lignes.map(l => Math.abs(l.v)));
  return <ul className="space-y-2">{lignes.map(l => (
    <li key={l.nom} className="text-[13px]" title={`${l.nom} : ${eurC(l.v)}`}>
      <div className="flex justify-between gap-3"><span className="truncate">{l.nom}</span><span className="tabular shrink-0 font-medium">{eurC(l.v)}{l.sous ? <span className="ml-1 font-normal text-gray-500">{l.sous}</span> : null}</span></div>
      <div className="mt-1 h-2 rounded-full bg-gray-100"><div className="h-full rounded-full" style={{ width: Math.max(2, Math.abs(l.v) / max * 100) + '%', background: l.v < 0 ? '#e34948' : coul }} /></div>
    </li>))}</ul>;
}

function PageStats() {

  const deb = mois[0] + '-01';
  const parMois = (fn) => mois.map(m => fn(m));
  const signe = parMois(m => idx.dossiers.flatMap(d => d.signesListe || []).filter(s => cleMois(s.quand) === m).reduce((a, s) => a + Math.round(valeurContrat(s) * 100), 0));
  const facture = parMois(m => f.factures.filter(x => x.statut !== 'brouillon' && cleMois(x.dateEmission) === m).reduce((a, x) => a + (x.type === 'avoir' ? -x.totalTTC : x.totalTTC), 0));
  const encaisse = parMois(m => f.paiements.filter(p => cleMois(p.date) === m).reduce((a, p) => a + (p.type === 'remboursement' ? -p.montant : p.montant), 0));
  const depenses = parMois(m => (f.depenses || []).filter(d => cleMois(d.date) === m).reduce((a, d) => a + d.montant, 0));
  const mrr = parMois(m => (f.abonnements || []).filter(a => aboActifA(a, finMois(m))).reduce((s, a) => s + a.montantM, 0));
  const { pres, packs } = caParPrestation(f, deb);
  const lp = Object.values(pres).sort((a, b) => b.ca - a.ca), top = lp.slice(0, 7), autres = lp.slice(7).reduce((s, x) => s + x.ca, 0);
  const ds = idx.dossiers.map(d => ({ ...d, etape: normEtape(d.etape) }));
  const gagnes = ds.filter(d => d.etape === 'signe' && (d.gagneLe || '') >= deb).length, perdus = ds.filter(d => d.etape === 'perdu' && (d.perduLe || d.maj || '') >= deb).length;
  const signesL = ds.flatMap(d => d.signesListe || []).filter(s => (s.quand || '') >= deb);
  const moyen = signesL.length ? signesL.reduce((a, s) => a + valeurContrat(s), 0) / signesL.length : 0;
  const impayes = f.factures.filter(x => x.type === 'facture' && x.statut !== 'brouillon').map(x => ({ x, e: etatFacture(x, f) })).filter(({ e }) => e.reste > 0);
  const rent = rentabilite(f, 'tout');
  const deps = (f.depenses || []).filter(d => d.date >= deb);
  const parClient = Object.entries(f.factures.filter(x => x.statut !== 'brouillon' && x.dateEmission >= deb).reduce((acc, x) => { acc[x.dossierId] = (acc[x.dossierId] || 0) + (x.type === 'avoir' ? -x.totalTTC : x.totalTTC); return acc; }, {}))
    .map(([id, ca]) => { const dep = deps.filter(d => d.dossierId === id).reduce((s, d) => s + d.montant, 0); return { nom: nomDossier(id), v: ca - dep, sous: dep ? `(CA ${eurC(ca)} − ${eurC(dep)})` : '' }; }).sort((a, b) => b.v - a.v);
  const depPres = (id) => deps.filter(d => d.prestation === id).reduce((s, d) => s + d.montant, 0);
  const offres = (lireJSON(DK('boulangerie')) || {}).offres || OFFRES;
  const pondere = ds.filter(d => !d.archive && OUVERTES.includes(d.etape)).reduce((a, d) => a + (d.estime || 0) * (d.proba ?? 0) / 100, 0);
  const mrrAct = recurrent(f, 'tout').mrr;
  const aucun = (arr) => arr.every(v => !v);
  return (
    <Shell page="stats">
      <div className="mx-auto max-w-6xl space-y-4 px-4 pb-28 pt-6 sm:px-6">
        <div className="flex flex-wrap items-end justify-between gap-3"><h1 className="font-display text-2xl font-bold sm:text-3xl">Statistiques</h1>
          <div className="flex rounded-xl bg-gray-100 p-1">{[[3, '3 mois'], [6, '6 mois'], [12, '12 mois'], [0, 'Tout']].map(([v, l]) => <button key={v} onClick={() => setN(v)} className={'rounded-lg px-3 py-1.5 text-[13px] font-semibold ' + (n === v ? 'bg-white text-ink shadow-sm' : 'text-gray-500')}>{l}</button>)}</div></div>
        <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
          <Tuile titre="Taux de conversion" val={gagnes + perdus ? Math.round(gagnes / (gagnes + perdus) * 100) + ' %' : '—'} sous={`${gagnes} gagnée(s), ${perdus} perdue(s)`} />
          <Tuile titre="Contrat moyen" val={moyen ? eur(moyen) : '—'} sous={`${signesL.length} devis signé(s)`} />
          <Tuile titre="Factures impayées" val={impayes.length} sous={eurC(impayes.reduce((a, { e }) => a + e.reste, 0)) + ' à encaisser'} cls={impayes.some(({ e }) => e.statut === 'retard') ? 'bg-red-50 text-red-900' : 'bg-white'} href="#/factures" />
          <Tuile titre="Prévision 3 mois" val={eur(mrrAct * 3 / 100 + pondere)} sous={`MRR × 3 (${eurC(mrrAct * 3)}) + pipeline pondéré (${eur(pondere)})`} cls="bg-sky-50 text-sky-900" />
        </div>
        <CarteGraphe titre="Chiffre d'affaires mensuel" sous="Signé (création + mensuel sur l'engagement), facturé et encaissé : trois mesures différentes"
          legende={[['Signé', SERIE[0]], ['Facturé', SERIE[1]], ['Encaissé', SERIE[2]]]} vide={aucun([...signe, ...facture, ...encaisse]) && 'Pas encore de données sur la période.'}
          tableau={<TableSimple tete={['Mois', 'Signé', 'Facturé', 'Encaissé', 'Dépenses']} lignes={mois.map((m, i) => [libMois(m), eurC(signe[i]), eurC(facture[i]), eurC(encaisse[i]), eurC(depenses[i])])} />}>
          <BarresMois mois={mois} series={[{ nom: 'Signé', coul: SERIE[0], valeurs: signe }, { nom: 'Facturé', coul: SERIE[1], valeurs: facture }, { nom: 'Encaissé', coul: SERIE[2], valeurs: encaisse }]} />
        </CarteGraphe>
        <div className="grid gap-4 lg:grid-cols-2">
          <CarteGraphe titre="Évolution du MRR" sous="Abonnements actifs en fin de mois" vide={aucun(mrr) && 'Aucun abonnement actif sur la période.'}
            tableau={<TableSimple tete={['Mois', 'MRR']} lignes={mois.map((m, i) => [libMois(m), eurC(mrr[i])])} />}>
            <CourbeMois mois={mois} valeurs={mrr} nom="MRR" />
          </CarteGraphe>
          <CarteGraphe titre="Répartition du CA par prestation" sous="CA signé net (commandes), remises réparties" vide={!lp.length && 'Aucune commande sur la période.'}
            tableau={<TableSimple tete={['Prestation', 'CA', 'Dépenses', 'Marge']} lignes={lp.map((x, i) => { const id = Object.keys(pres).find(k => pres[k] === x); return [x.nom, eurC(x.ca), eurC(depPres(id)), eurC(x.ca - depPres(id))]; })} />}>
            <BarresH lignes={[...top.map(x => ({ nom: x.nom, v: x.ca })), ...(autres ? [{ nom: 'Autres', v: autres }] : [])]} />
          </CarteGraphe>
          <CarteGraphe titre="Performance des packs" sous="CA signé net par famille de prestations" vide={!Object.keys(packs).length && 'Aucune commande sur la période.'}
            tableau={<TableSimple tete={['Pack', 'Commandes', 'CA']} lignes={Object.entries(packs).map(([k, x]) => [(offres.find(o => o.id === k) || { nom: k }).nom, x.cmds.size, eurC(x.ca)])} />}>
            <BarresH lignes={Object.entries(packs).map(([k, x]) => ({ nom: (offres.find(o => o.id === k) || { nom: k }).nom, v: x.ca, sous: `· ${x.cmds.size} cmd` })).sort((a, b) => b.v - a.v)} />
          </CarteGraphe>
          <CarteGraphe titre="Rentabilité par client" sous="Facturé − dépenses affectées au client" vide={!parClient.length && 'Aucune facture émise sur la période.'}
            tableau={<TableSimple tete={['Client', 'Marge']} lignes={parClient.map(x => [x.nom, eurC(x.v)])} />}>
            <BarresH lignes={parClient.slice(0, 8)} coul={SERIE[2]} />
          </CarteGraphe>
        </div>
        <CarteGraphe titre="Rentabilité mensuelle" sous="Facturé − dépenses du mois (résultat estimé)" vide={aucun([...facture, ...depenses]) && 'Pas encore de factures ni de dépenses.'}
          tableau={<TableSimple tete={['Mois', 'Facturé', 'Dépenses', 'Résultat']} lignes={mois.map((m, i) => [libMois(m), eurC(facture[i]), eurC(depenses[i]), eurC(facture[i] - depenses[i])])} />}>
          <BarresMois mois={mois} series={[{ nom: 'Facturé', coul: SERIE[1], valeurs: facture }, { nom: 'Dépenses', coul: SERIE[0], valeurs: depenses }]} />
        </CarteGraphe>
        <p className="text-[11px] text-gray-400">Depuis le début : facturé {eurC(rent.ca)}, dépenses {eurC(rent.depenses)}, résultat estimé {eurC(rent.resultat)}, trésorerie (encaissé − dépenses) {eurC(rent.tresorerie)}. Le résultat estimé n'est pas un bénéfice net : cotisations sociales et impôts ne sont pas déduits.</p>
      </div>
    </Shell>
  );
}

function PageMenu() {
  return <Shell page="menu"><div className="mx-auto max-w-md space-y-2 px-4 pb-28 pt-6"><h1 className="mb-3 font-display text-2xl font-bold">Menu</h1>
    {NAV.map(([h, l, i]) => <a key={h} href={h} className="flex items-center gap-3 rounded-2xl bg-white px-4 py-3.5 text-[15px] font-semibold ring-1 ring-black/5"><span className="w-6 text-center">{i}</span>{l}</a>)}</div></Shell>;
}

function App({ dossierId }) {
  const [s, setS] = useState(() => {
    if (!dossierId) return load();
    const idx = lireJSON(IDX) || {};
    const st = load(lireJSON(DK(dossierId)));
    const vIdx = idx.vendeur && Object.values(idx.vendeur).some(x => String(x || '').trim() && x !== 'M.' && x !== DEFAULTS.vendeur.statut);
    return { ...st, vendeur: { ...DEFAULTS.vendeur, ...(vIdx ? idx.vendeur : st.vendeur) } };
  });
  FRANCHISE = num(s.tva) === 0;
  DOSSIER_COURANT = dossierId || null;
  useEffect(() => {
    if (!dossierId) return;
    const f = (e) => { if (e.key === DK(dossierId) && e.newValue) { try { setS(p => ({ ...load(JSON.parse(e.newValue)), vendeur: p.vendeur })); } catch {} } };
    window.addEventListener('storage', f); return () => window.removeEventListener('storage', f);
  }, [dossierId]);
  const [open, setOpen] = useState({ client: true });
  const [showProposal, setShowProposal] = useState(false);
  const [showDevis, setShowDevis] = useState(false);
  const [signerAuto, setSignerAuto] = useState(false);
  const [preview, setPreview] = useState(null);
  const [msg, setMsg] = useState('');
  const timer = useRef();

  useEffect(() => {
    try { if (dossierId) { const r = sauverDossier(dossierId, s); if (r !== s && r && Object.keys(r.signes || {}).length !== Object.keys(s.signes || {}).length) setS(r); } else localStorage.setItem(STORE, JSON.stringify(s)); }
    catch { toast('Mémoire de l\'appareil pleine : retirez des photos ou archivez des dossiers après une sauvegarde.'); }
  }, [s]);

  const toast = (m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(''), 4500); };
  const set = (patch) => setS(prev => ({ ...prev, ...(typeof patch === 'function' ? patch(prev) : patch) }));
  const setClient = (k, v) => set(p => ({ client: { ...p.client, [k]: v } }));
  const setVendeur = (k, v) => set(p => ({ vendeur: { ...p.vendeur, [k]: v } }));
  const setPrest = (id, patch) => set(p => ({ prestations: p.prestations.map(x => x.id === id ? { ...x, ...patch } : x) }));
  const toggle = (k) => setOpen(o => ({ ...o, [k]: !o[k] }));
  const [perso, setPerso] = useState(''); // formule en cours de personnalisation
  useEffect(() => {
    if (!perso) return;
    const esc = (e) => e.key === 'Escape' && setPerso('');
    document.addEventListener('keydown', esc);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', esc); document.body.style.overflow = ''; };
  }, [perso]);
  const setPack = (id, patch) => set(p => ({ packs: p.packs.map(x => x.id === id ? { ...x, ...(typeof patch === 'function' ? patch(x) : patch) } : x) }));
  const setPackItem = (id, prestId, val) => set(p => {
    const x = p.packs.find(k => k.id === id);
    const items = { ...x.items };
    const herite = itemsHerites(p, x)[prestId];
    const cur = items[prestId];
    if (val === null) items[prestId] = herite ? { retire: true } : { ...(cur || {}), off: true };   // décoché : reste dans la liste
    else if (cur && cur.retire && herite && !Object.keys(val).length) delete items[prestId];           // recoché : reprend la formule parente
    else { const { off, retire, ...reste } = val; items[prestId] = cur && cur.off && !Object.keys(val).length ? (({ off: o, ...r }) => r)(cur) : reste; }
    return { packs: p.packs.map(k => k.id === id ? { ...k, items } : k) };
  });
  const allerOffre = () => { setOpen(o => ({ ...o, offre: true })); setTimeout(() => document.getElementById('offre')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30); };
  const changerMode = (m) => { set({ mode: m }); allerOffre(); };
  const choisir = (id) => { set({ mode: 'formule', pack: id }); toast((s.packs.find(x => x.id === id) || {}).nom + ' choisi. Le récapitulatif en haut est à jour.'); };
  const proposer = (pack, garder, enPlus) => {
    const ajout = [...enPlus.map(p => p.nom), ...garder.map(p => p.nom + ' (gardée)')];
    if (ajout.length && !confirm(`Passer au ${pack.nom} ?\n\nPrestations ajoutées par rapport à la sélection :\n• ${ajout.join('\n• ')}\n\nValidez seulement si le client est d'accord.`)) return;
    set(p => ({ mode: 'formule', pack: pack.id,
      packs: p.packs.map(x => x.id === pack.id ? { ...x, items: { ...x.items, ...Object.fromEntries(garder.map(g => [g.id, {}])) } } : x) }));
    toast(`${pack.nom} proposé. Votre sélection à la carte reste enregistrée dans l'onglet À la carte.`);
    allerOffre();
  };

  const c = useMemo(() => compute(s), [s]);
  const cTous = useMemo(() => compute({ ...s, exclus: {} }), [s]);
  const packsCalc = useMemo(() => Object.fromEntries(s.packs.map(pk => [pk.id, calc(s, packLines(s, pk), pk.remises)])), [s]);
  const sugg = useMemo(() => suggestions(s.reponses), [s.reponses]);
  const numero = useMemo(() => {
    if (s.suivi && s.suivi.numero) return s.suivi.numero; // numéro figé du dossier
    const d = today();
    return `DEV-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${(s.client.entreprise || 'X').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'X'}`;
  }, [s.client.entreprise, s.suivi && s.suivi.numero]);

  const answer = (q, o) => set(p => {
    const cur = p.reponses[q.id] || [];
    const next = q.multi ? (cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o]) : (cur.includes(o) ? [] : [o]);
    return { reponses: { ...p.reponses, [q.id]: next } };
  });

  const addPhotos = async (files) => {
    const out = [];
    for (const f of files) { try { out.push(await compress(f, 1400, 0.8)); } catch {} }
    set(p => ({ visuels: { ...p.visuels, photos: [...p.visuels.photos, ...out].slice(0, 12) } }));
  };
  const addLogo = async (f) => { if (!f) return; try { const d = await compress(f, 600, 0.9); set(p => ({ visuels: { ...p.visuels, logo: d } })); } catch { toast('Image illisible.'); } };


  const addCustom = (type, offre = 'base') => set(p => ({ prestations: [...p.prestations, { id: 'perso-' + Date.now(), type, nom: 'Nouvelle prestation', description: 'Description de la prestation', prix: 0, qte: 1, unite: '', selected: true, offre }] }));

  const answered = QUESTIONS.filter(q => (s.reponses[q.id] || []).length || (s.notes[q.id] || '').trim());
  const clientHint = [s.client.entreprise, s.client.responsable].filter(Boolean).join(' · ') || 'Coordonnées du commerçant';

  const generate = () => {
    if (c.mode === 'formule' && !c.pack) { toast('Choisissez une formule avant de générer la proposition.'); allerOffre(); return; }
    if (!c.sel.length) { toast(c.mode === 'formule' ? 'Cette formule ne contient aucune prestation.' : 'Cochez au moins une prestation avant de générer la proposition.'); allerOffre(); return; }
    setShowProposal(true);
    window.scrollTo(0, 0);
  };

  // appelée comme une fonction (et non <RemiseInput/>) pour que le champ garde le focus pendant la saisie
  // packId : remise d'une formule ; sinon remise de la vente à la carte
  const remiseInput = (k, label, packId) => {
    const pk = packId && s.packs.find(x => x.id === packId);
    const r = pk ? pk.remises[k] : s.remises[k];
    const maj = (patch) => pk
      ? setPack(packId, x => ({ remises: { ...x.remises, [k]: { ...x.remises[k], ...patch } } }))
      : set(p => ({ remises: { ...p.remises, [k]: { ...p.remises[k], ...patch } } }));
    return (
      <div>
        <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">{label}</p>
        <div className="flex items-center gap-2">
          <input type="number" inputMode="decimal" min="0" value={r.valeur} onChange={e => maj({ valeur: e.target.value })} className={inputCls + ' tabular w-28'} />
          <Segmented value={r.mode} options={[{ v: '%', label: '%' }, { v: '€', label: '€' }]} onChange={v => maj({ mode: v })} />
        </div>
      </div>
    );
  };

  return (
    <>
      <div id="app-main">
        {/* Récapitulatif permanent */}
        <div className="sticky top-0 z-40 border-b border-gray-200 bg-white/90 backdrop-blur" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
          <div className="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2.5 sm:px-6">
            <div className="flex w-full items-center gap-3 sm:w-auto" role="tablist">
              <div className="grid flex-1 grid-cols-2 rounded-xl bg-gray-100 p-1 sm:flex-none">
                {[['carte', 'À la carte'], ['formule', 'Formules']].map(([m, l]) => (
                  <button key={m} role="tab" aria-selected={s.mode === m} onClick={() => changerMode(m)}
                    className={'rounded-lg px-4 py-2 text-sm font-bold uppercase tracking-wide transition ' + (s.mode === m ? 'bg-white text-ink shadow-sm' : 'text-gray-500 hover:text-ink')}>{l}</button>
                ))}
              </div>
              <p className="truncate text-xs text-gray-500 sm:hidden">{c.mode === 'formule' ? (c.pack ? c.pack.nom : 'Aucune formule') : `${c.sel.length} presta.`}</p>
            </div>
            <div className="grid min-w-0 flex-1 grid-cols-3 gap-2 sm:gap-6">
              {[[c.mode === 'formule' && c.pack ? c.pack.nom.replace(/^Pack\s+/i, '') + ' · initial' : 'Initial', eur(c.htP), (FRANCHISE ? '' : eur(c.ttcP) + ' TTC')],
                ['Par mois', eur(c.htM), (FRANCHISE ? '' : eur(c.ttcM) + ' TTC')],
                [c.mois ? `Total ${c.mois} mois` : 'Total 1er mois', eur(c.totalHT), (FRANCHISE ? '' : eur(c.totalTTC) + ' TTC')]].map(([l, v, sub]) => (
                <div key={l} className="min-w-0">
                  <p className="truncate text-[10.5px] font-medium uppercase tracking-wide text-gray-500 sm:text-[11px]">{l}</p>
                  <p className="tabular truncate text-[15px] font-semibold sm:text-lg">{v}<span className="ml-1 text-[10px] font-normal text-gray-400">{uHT()}</span></p>
                  <p className="tabular hidden truncate text-[11px] text-gray-500 sm:block">{sub}</p>
                </div>
              ))}
            </div>
            <button onClick={generate} className="hidden rounded-xl bg-accent px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:brightness-110 sm:block">Générer la proposition commerciale</button>
          </div>
        </div>

        <main className="mx-auto max-w-5xl space-y-4 px-4 pb-32 pt-6 sm:px-6">
          <div className="flex flex-wrap items-end justify-between gap-3 pb-2">
            <div>
              {dossierId && <a href={'#/c/' + dossierId} className="mb-1 inline-block text-sm font-medium text-gray-500 hover:text-ink">← Fiche client</a>}
              <h1 className="font-display text-2xl font-semibold sm:text-3xl">{dossierId ? (s.client.entreprise || 'Nouveau client') : 'Proposition commerciale'}</h1>
              <p className="text-sm text-gray-500">{dossierId ? `Dossier client · devis N° ${numero} · enregistrement automatique` : 'Enregistrement automatique sur cet appareil.'}</p>
            </div>
          </div>
          {dossierId && <BandeauDossier s={s} set={set} toast={toast} numero={numero} />}

          {/* 1. Fiche client */}
          <Section n="1" title="Fiche client" hint={clientHint} open={!!open.client} onToggle={() => toggle('client')}>
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Nom de l'entreprise"><input className={inputCls} value={s.client.entreprise} onChange={e => setClient('entreprise', e.target.value)} placeholder="Boulangerie du Port" /></Field>
              <Field label="Responsable"><input className={inputCls} value={s.client.responsable} onChange={e => setClient('responsable', e.target.value)} placeholder="Prénom Nom" autoComplete="off" /></Field>
              <Field label="Téléphone"><input className={inputCls} type="tel" inputMode="tel" value={s.client.telephone} onChange={e => setClient('telephone', e.target.value)} placeholder="06 12 34 56 78" autoComplete="off" /></Field>
              <Field label="Email"><input className={inputCls} type="email" inputMode="email" value={s.client.email} onChange={e => setClient('email', e.target.value)} placeholder="contact@commerce.fr" autoComplete="off" /></Field>
              <Field label="Adresse" className="sm:col-span-2"><input className={inputCls} value={s.client.adresse} onChange={e => setClient('adresse', e.target.value)} placeholder="Rue, code postal, ville" autoComplete="off" /></Field>
              <Field label="Secteur d'activité" className="sm:col-span-2">
                <input className={inputCls} list="secteurs" value={s.client.secteur} onChange={e => setClient('secteur', e.target.value)} placeholder="Boulangerie, restaurant, coiffure…" />
                <datalist id="secteurs">{['Boulangerie-pâtisserie', 'Restaurant', 'Café / bar', 'Salon de coiffure', 'Institut de beauté', 'Boutique de vêtements', 'Fleuriste', 'Épicerie fine', 'Boucherie', 'Artisan'].map(x => <option key={x} value={x} />)}</datalist>
              </Field>
            </div>
          </Section>

          {/* 2. Découverte */}
          <Section n="2" title="Découverte commerciale" hint={answered.length ? `${answered.length} / ${QUESTIONS.length} questions renseignées` : 'Questions à poser pendant le rendez-vous'}
            open={!!open.decouverte} onToggle={() => toggle('decouverte')}>

              const deja = (p.envois || {})[n], su = p.suivi;
              const suivi = su && !deja ? { ...su, etape: rangEtape(su.etape) < rangEtape('proposition') ? 'proposition' : su.etape,
                ...(su.etape !== 'signe' ? { prochaine: { date: plusJours(3), action: 'Relancer pour la signature du devis' } } : {}),
                historique: [...(su.historique || []), { date: new Date().toISOString(), type: 'auto', texte: `Lien de signature du devis ${n} créé` }] } : su;
              return { envois: { ...(p.envois || {}), [n]: { empreinte: e, date: new Date().toISOString() } }, ...(suivi ? { suivi } : {}) };
            })} />
        : (setTimeout(() => setShowDevis(false)), null); })()}
      <Toast msg={msg} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Racine />);
</script>
</body>
</html>
