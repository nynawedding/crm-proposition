/* ============================ Formules ============================

// Formules affichées dans le devis « à la carte » : elles regroupent les packs choisis, avec une remise.

// Prestations suggérées selon les réponses
const suggestions = (rep) => {
  const s = new Set();
  const has = (q, o) => (rep[q] || []).includes(o);

  if (has('demande', 'Réseaux sociaux')) s.add('social');

/* ============================ Utilitaires ============================ */
const STORE = 'crm-proposition-v1';
// Franchise en base de TVA : plus de HT / TTC, un seul montant net à payer.
let FRANCHISE = false;
const xHT = () => (FRANCHISE ? '' : ' HT');    // après un montant
const xTTC = () => (FRANCHISE ? '' : ' TTC');
const uHT = (m = '') => (FRANCHISE ? m.trim() : 'HT' + m); // libellé seul : « HT / mois » → « / mois »
const MENTION_TVA = 'TVA non applicable, art. 293 B du CGI';
const eur = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: n % 1 ? 2 : 0 }).format(n || 0);
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const today = () => new Date();
const fmtDate = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const load = (brut) => {
  try {
    const s = brut !== undefined ? JSON.parse(JSON.stringify(brut)) : JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!s) return DEFAULTS;
    // passage en franchise de TVA (une seule fois) : chaque prix HT × (1 + TVA) pour garder les mêmes totaux,
    // qui deviennent des montants nets à payer.
    if (!s.franchise) {
      const k = 1 + num(s.tva ?? 20) / 100;
      const x = (v) => (v === '' || v === undefined || v === null ? v : Math.round(num(v) * k * 100) / 100);
      const euros = (r) => r && Object.fromEntries(Object.entries(r).map(([t, o]) => [t, o && o.mode !== '%' ? { ...o, valeur: x(o.valeur) } : o]));
      s.prestations = (s.prestations || []).map(p => (p.prix !== undefined ? { ...p, prix: x(p.prix) } : p));
      s.packs = (s.packs || []).map(pk => ({ ...pk, remises: euros(pk.remises),
        items: Object.fromEntries(Object.entries(pk.items || {}).map(([id, o]) => [id, o && o.prix !== undefined && o.prix !== '' ? { ...o, prix: x(o.prix) } : o])) }));
      s.remises = euros(s.remises);
      s.tva = 0; s.franchise = true;
    }
    // fusion prudente avec les valeurs par défaut (nouvelles prestations, nouveaux champs)
    const valide = (o) => OFFRE_IDS.includes(o);
    const blocsV4 = (s.offres || []).some(o => o.v === 4);
    const stocke = (id) => (s.prestations || []).find(x => x.id === id) || {};
    const prestations = CATALOGUE.map(p => {
      const st = stocke(p.id);
      // prestation redéfinie (v différente) : on reprend la nouvelle version, en gardant la sélection
      // nouvelle version : textes du catalogue repris ; prix gardés si la prestation est seulement renommée (garde)
      const base = p.v && st.v !== p.v ? { selected: !!st.selected, offre: st.offre,
        ...(p.garde && st.prix !== undefined ? { prix: st.prix, qte: st.qte, unite: st.unite } : {}) } : st;
      // l'ancienne « fiche Google » (gbp) est fusionnée dans « Mise en place du référencement Google »
      if (p.id === 'seo' && stocke('gbp').selected) base.selected = true;
      // « Base clients » (formulaire) fusionnée dans le programme de fidélité : prix additionnés, coché si l'un des deux l'était
      if (p.id === 'fidelite' && st.v !== p.v && stocke('formulaire').id) {
        const f = stocke('formulaire');
        base.selected = !!(st.selected || f.selected);
        base.prix = num(st.prix ?? 348) + num(f.prix ?? 228);
      }
      // blocs réorganisés (v4) : chaque prestation du catalogue reprend son bloc par défaut une fois
      const offre = blocsV4 ? remapOffre(base.offre) : p.offre;
      return { ...p, ...base, offre: valide(offre) ? offre : p.offre };
    });
    // seules les prestations créées à la main sont gardées en plus du catalogue
    const anciennes = { video: 'base' }; // prestations des versions précédentes, gardées avec vos prix
    const extras = (s.prestations || [])
      // prestations retirées à la demande (shooting photo professionnel)
      .filter(x => x.id !== 'perso-shooting' && x.nom !== 'Shooting photo professionnel')
      .filter(x => String(x.id).startsWith('perso-') || anciennes[x.id])
      .map(x => anciennes[x.id] ? { ...x, id: 'perso-' + x.id } : x)
      .filter((x, i, arr) => arr.findIndex(y => y.id === x.id) === i)
      .map(x => ({ ...x, offre: valide(remapOffre(x.offre)) ? remapOffre(x.offre) : 'base' }));
    // formules : réglages enregistrés gardés s'ils datent de la version actuelle du pack
    let packs = PACKS.map(d => {
      const st = (s.packs || []).find(x => x.id === d.id && x.v === d.v);
      return st ? { ...d, ...st, herite: !!st.herite, remises: { ...d.remises, ...st.remises } } : d;
    });
    // anciennes formules (listes complètes) : on ne garde que les ajouts, le reste vient des formules parentes
    const defauts = { packs: PACKS };
    packs = packs.map(pk => {
      if (pk.herite) return pk;
      const parentDef = itemsHerites(defauts, PACKS.find(x => x.id === pk.id));
      const vide = (o) => !o || !Object.keys(o).length;
      const items = {};
      // une ligne « au prix du catalogue » reste au prix du catalogue, même si un pack parent a un prix modifié
      const modifieAilleurs = (id) => packs.some(x => x.id !== pk.id && !vide((x.items || {})[id]) && !(x.items[id] || {}).retire);
      Object.entries(pk.items || {}).forEach(([id, o]) => {
        if (!(parentDef[id] && vide(o))) items[id] = o;
        else if (modifieAilleurs(id)) items[id] = { prix: '', qte: '', type: '' };
      });
      Object.keys(parentDef).forEach(id => { if (!(id in (pk.items || {}))) items[id] = { retire: true }; });
      return { ...pk, items, herite: true };
    });
    // noms d'offres personnalisés gardés seulement s'ils datent de la version actuelle des offres
    const offres = OFFRES.map(o => ({ ...o, ...((s.offres || []).find(x => x.id === o.id && x.v === o.v) || {}) }));
    // une seule fois : si la fiche enregistrée est vide, on y met le client préenregistré
    const vide = !Object.values(s.client || {}).some(v => String(v).trim());
    const client = !s.prefillApplied && vide ? PREFILL.client : { ...blankClient, ...s.client };
    const demo = !s.prefillApplied && !(s.visuels || {}).demoUrl ? { demoUrl: PREFILL.demoUrl } : {};
    const res = { ...DEFAULTS, ...s, prefillApplied: true, client, vendeur: { ...DEFAULTS.vendeur, ...s.vendeur },
      visuels: { ...DEFAULTS.visuels, ...s.visuels, ...demo }, remises: { ...DEFAULTS.remises, ...s.remises }, acompte: { ...DEFAULTS.acompte, ...s.acompte },
      prestations: [...prestations, ...extras], offres, packs,
      mode: s.mode === 'formule' ? 'formule' : 'carte', pack: packs.some(x => x.id === s.pack) ? s.pack : '' };
    return s.arrondi ? res : arrondir(res);
  } catch { return DEFAULTS; }
};

// Une seule fois : prix arrondis à l'euro supérieur (fini les 23,88 €), sans changer les totaux nets
// du devis en cours : l'écart d'arrondi est repris dans la remise (en euros, exacte au centime).
function arrondir(s0) {
  const up = (v) => (v === '' || v === undefined || v === null ? v : Math.ceil(num(v) - 0.001));
  const avant = compute(s0), avantPk = compute({ ...s0, mode: 'formule' });
  const s = { ...s0, arrondi: true,
    prestations: s0.prestations.map(p => ({ ...p, prix: up(p.prix) })),
    packs: s0.packs.map(pk => ({ ...pk, items: Object.fromEntries(Object.entries(pk.items || {}).map(([id, o]) =>
      [id, o && o.prix !== undefined && o.prix !== '' ? { ...o, prix: up(o.prix) } : o])) })) };
  const garde = (rem, brutAvant, brutApres, netAvant, type) => {
    if (Math.abs(brutApres - brutAvant) < 0.005) return rem[type];
    return { mode: '€', valeur: String(Math.round((brutApres - netAvant) * 100) / 100) };
  };
  const lignes = (sel, type) => sel.filter(p => p.type === type).reduce((a, p) => a + num(p.prix) * Math.max(1, num(p.qte) || 1), 0);
  // devis à la carte
  const carte = s.prestations.filter(p => p.selected && !(!verrouille(p) && (s.exclus || {})[p.id]));
  const selAvant = s0.prestations.filter(p => p.selected && !(!verrouille(p) && (s0.exclus || {})[p.id]));
  s.remises = { ponctuel: garde(s0.remises, lignes(selAvant, 'ponctuel'), lignes(carte, 'ponctuel'), avant.mode === 'carte' ? avant.htP : compute({ ...s0, mode: 'carte' }).htP, 'ponctuel'),
    mensuel: garde(s0.remises, lignes(selAvant, 'mensuel'), lignes(carte, 'mensuel'), compute({ ...s0, mode: 'carte' }).htM, 'mensuel') };
  // formule en cours (onglet FORMULES)
  const pk0 = s0.packs.find(x => x.id === s0.pack);
  if (pk0) {
    const la = packLines(s0, pk0), pk = s.packs.find(x => x.id === pk0.id), lb = packLines(s, pk);
    pk.remises = { ponctuel: garde(pk0.remises, lignes(la, 'ponctuel'), lignes(lb, 'ponctuel'), avantPk.htP, 'ponctuel'),
      mensuel: garde(pk0.remises, lignes(la, 'mensuel'), lignes(lb, 'mensuel'), avantPk.htM, 'mensuel') };
  }
  return s;
}

// Réduit une image (photo de téléphone) avant de la garder en mémoire locale
const compress = (file, max = 1400, q = 0.82) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onerror = reject;
  r.onload = () => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      const png = file.type === 'image/png' || file.type === 'image/svg+xml';
      if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL(png ? 'image/png' : 'image/jpeg', q));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

// Coordonnées du prestataire, mises en forme : « M. Abdel Hafid FEDAOUCHE », « 06 12 52 09 77 », email en minuscules
const fmtNom = (n) => { const m = (n || '').trim().split(/\s+/).filter(Boolean); if (!m.length) return '';
  const fin = m.pop(); return [...m.map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()), fin.toUpperCase()].join(' '); };
const fmtTel = (x) => { const d = (x || '').replace(/\D/g, ''); return d.length === 10 ? d.replace(/(\d{2})(?=\d)/g, '$1 ') : (x || ''); };
const vendeurInfo = (v = {}) => {
  const a = (v.societe || '').trim(), b = (v.nom || '').trim(), al = a.toLowerCase(), bl = b.toLowerCase();
  // société = nom de la personne (entrepreneur individuel) : on n'affiche le nom qu'une fois, le plus complet
  const meme = a && b ? (al.includes(bl) ? a : bl.includes(al) ? b : null) : (a || b);
  const civ = (v.civilite ?? 'M.').trim();
  const personne = fmtNom(meme || b);
  return { nom: personne ? (civ ? civ + ' ' : '') + personne : '', societe: meme ? '' : a, statut: (v.statut ?? 'Entrepreneur individuel (EI)').trim(),
    adresse: (v.adresse || '').trim(), tel: fmtTel(v.telephone), email: (v.email || '').trim().toLowerCase(),
    siret: (v.siret || '').replace(/\D/g, '').replace(/^(\d{3})(\d{3})(\d{3})(\d{5})$/, '$1 $2 $3 $4') };
};

const waNumber = (tel) => {
  let d = (tel || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (d.startsWith('0') && d.length === 10) return '33' + d.slice(1);
  return d;
};

// « 1 journée », « 2 journées », « 3 × lot de 20 »
const UNITES_MUETTES = ['', 'mois', 'forfait', 'site', 'boucle'];
const qteTexte = (p) => {
  const q = Math.max(1, num(p.qte) || 1), u = (p.unite || '').trim();
  if (q === 1 && UNITES_MUETTES.includes(u.toLowerCase())) return '';
  if (!u) return `${q}`;
  if (q === 1) return `1 ${u}`;
  return /^[a-zàâéèêîôûç-]+$/i.test(u) && !/s$/.test(u) ? `${q} ${u}s` : `${q} × ${u}`;
};

// pour les listes : « × 3 » quand il n'y a pas d'unité
const qteLabel = (p) => { const t = qteTexte(p); return /^\d+$/.test(t) ? '× ' + t : t; };

/* ============================ Calculs ============================ */
// Lignes d'une formule : le catalogue, avec les réglages propres au pack. catPrix = prix à la carte.
const PARENTS = { signature: ['photo', 'siteweb'], premium: ['signature'], serenite: ['premium'] };
const fusion = (base, propres) => {
  const res = { ...base };
  Object.entries(propres || {}).forEach(([id, o]) => { if (o && (o.retire || o.off)) delete res[id]; else res[id] = { ...(res[id] || {}), ...o }; });
  return res;
};
// prestations héritées des formules parentes
function itemsHerites(s, pk, vus = new Set()) {
  if (!pk || !pk.id || vus.has(pk.id)) return {};
  vus.add(pk.id);
  return (PARENTS[pk.id] || []).reduce((acc, pid) => {
    const par = (s.packs || []).find(x => x.id === pid);
    return par ? { ...acc, ...fusion(itemsHerites(s, par, vus), par.items) } : acc;
  }, {});
}
const itemsEffectifs = (s, pk) => (pk ? fusion(itemsHerites(s, pk), pk.items) : {});
// toutes les prestations proposées dans le pack, cochées ou non (pour les garder visibles)
function membresPack(s, pk, vus = new Set()) {
  const m = new Set();
  if (!pk || !pk.id || vus.has(pk.id)) return m;
  vus.add(pk.id);
  (PARENTS[pk.id] || []).forEach(pid => { const par = (s.packs || []).find(x => x.id === pid); if (par) membresPack(s, par, vus).forEach(i => m.add(i)); });
  Object.keys(pk.items || {}).forEach(i => m.add(i));
  return m;
}

const packLines = (s, pack) => !pack ? [] : (() => { const eff = itemsEffectifs(s, pack); return s.prestations
  .filter(p => eff[p.id])
  .map(p => {
    const o = eff[p.id];
    return { ...p, selected: true, catPrix: num(p.prix),
      prix: o.prix !== undefined && o.prix !== '' ? o.prix : p.prix,
      qte: o.qte !== undefined && o.qte !== '' ? o.qte : p.qte,
      type: o.type || p.type };
  }); })();

function compute(s) {
  const pack = (s.packs || []).find(x => x.id === s.pack);
  if (s.mode === 'formule') return { ...calc(s, packLines(s, pack), pack ? pack.remises : DEFAULTS.remises), mode: 'formule', pack };
  const exclu = (p) => !verrouille(p) && (s.exclus || {})[p.id];
  return { ...calc(s, s.prestations.filter(p => p.selected && !exclu(p)), s.remises), mode: 'carte', pack: null };
}

// Moteur unique, pour la carte comme pour les formules.
function calc(s, sel, remises) {
  const line = (p) => num(p.prix) * Math.max(1, num(p.qte) || 1);
  const lineCat = (p) => num(p.catPrix ?? p.prix) * Math.max(1, num(p.qte) || 1);
  const ponct = sel.filter(p => p.type === 'ponctuel');
  const mens = sel.filter(p => p.type === 'mensuel');
  const lignesP = ponct.reduce((a, p) => a + line(p), 0);
  const lignesM = mens.reduce((a, p) => a + line(p), 0);
  const rem = (brut, r) => Math.min(brut, Math.max(0, r.mode === '%' ? brut * num(r.valeur) / 100 : num(r.valeur)));
  const htP = lignesP - rem(lignesP, remises.ponctuel), htM = lignesM - rem(lignesM, remises.mensuel);
  // prix à la carte et remise réelle (prix à la carte − prix final, jamais négative)
  const catP = ponct.reduce((a, p) => a + lineCat(p), 0), catM = mens.reduce((a, p) => a + lineCat(p), 0);
  const brutP = Math.max(catP, htP), brutM = Math.max(catM, htM);
  const remP = brutP - htP, remM = brutM - htM;
  const t = num(s.tva) / 100;
  const ttcP = htP * (1 + t), ttcM = htM * (1 + t);
  const mois = s.engagement || 0;
  const moisCalc = mois || 1; // sans engagement : 1er mois
  const totalHT = htP + htM * moisCalc;
  const totalTTC = ttcP + ttcM * moisCalc;
  const acompte = s.acompte.actif ? ttcP * num(s.acompte.pct) / 100 : 0;
  // répartition par offre (remise répartie au prorata)
  const kP = lignesP ? htP / lignesP : 1, kM = lignesM ? htM / lignesM : 1;
  const offres = (s.offres || OFFRES).map(o => {
    const items = sel.filter(p => (p.offre || 'base') === o.id);
    const bP = items.filter(p => p.type === 'ponctuel').reduce((a, p) => a + line(p), 0);
    const bM = items.filter(p => p.type === 'mensuel').reduce((a, p) => a + line(p), 0);
    const oHtP = bP * kP, oHtM = bM * kM;
    const oTtcP = oHtP * (1 + t), oTtcM = oHtM * (1 + t);
    const oAcompte = s.acompte.actif ? oTtcP * num(s.acompte.pct) / 100 : 0;
    return { ...o, items, bP, bM, htP: oHtP, htM: oHtM, ttcP: oTtcP, ttcM: oTtcM, acompte: oAcompte,
      totalTTC: oTtcP + oTtcM * moisCalc, totalHT: oHtP + oHtM * moisCalc };
  }).filter(o => o.items.length);
  const economie = (remP + remM * moisCalc) * (1 + t); // TTC, sur la durée d'engagement
  return { sel, ponct, mens, line, lineCat, brutP, brutM, remP, remM, htP, htM, ttcP, ttcM, tvaP: ttcP - htP, tvaM: ttcM - htM,
    mois, moisCalc, totalHT, totalTTC, acompte, offres, economie };
}

// Formules du devis à la carte : somme des packs choisis (prix des lignes) moins la remise de la formule.
// Une formule identique à la précédente (pack vide) n'est pas affichée.
function combos(s, c) {
  const t = 1 + num(s.tva) / 100, vus = new Set();
  const somme = (arr) => arr.reduce((a, p) => a + c.line(p), 0);
  // facteurs de la remise globale (une fois / par mois)
  const kP = somme(c.ponct) ? c.htP / somme(c.ponct) : 1, kM = somme(c.mens) ? c.htM / somme(c.mens) : 1;
  const ordre = { essentiel: 0, recommande: 1, option: 2 };
  return (s.combos || COMBOS).map(k => {
    const blocs = c.offres.filter(o => k.blocs.includes(o.id));
    const cle = blocs.map(o => o.id).join('+');
    if (blocs.length < 2 || vus.has(cle)) return null;
    vus.add(cle);
    const r = Math.min(100, Math.max(0, num(k.remise))) / 100;
    const inclus = () => true;
    const items = blocs.flatMap(o => o.items);
    const unefois = items.filter(p => p.type !== 'mensuel');
    const mensTous = items.filter(p => p.type === 'mensuel').sort((a, b) => ordre[prio(a)] - ordre[prio(b)]);
    const mensuel = mensTous.filter(inclus);
    // prix après remise globale, puis remise de la formule
    const bP = somme(unefois) * kP, bM = somme(mensuel) * kM;
    const htP = bP * (1 - r), htM = bM * (1 - r);
    const prixMois = (p) => c.line(p); // prix HT du CRM, les remises sont affichées à part
    return { ...k, blocs, bP, bM, htP, htM, ttcP: htP * t, ttcM: htM * t, unefois, mensuel, mensTous, inclus, prixMois,
      brutP: somme(unefois), brutM: somme(mensuel),
      eco: ((bP - htP) + (bM - htM) * c.moisCalc) * t, totalTTC: (htP + htM * c.moisCalc) * t };
  }).filter(Boolean);
}

// Compare la sélection à la carte avec une formule (en gardant ou non les prestations hors pack).
function comparer(s, pack, garder) {
  const carteSel = s.prestations.filter(p => p.selected);
  const carte = calc(s, carteSel, s.remises);
  const lignes = packLines(s, pack);
  const enPlus = lignes.filter(p => !carteSel.some(x => x.id === p.id));
  const effP = itemsEffectifs(s, pack);
  const horsPack = carteSel.filter(p => !effP[p.id]);
  const pk = calc(s, [...lignes, ...(garder ? horsPack.map(p => ({ ...p, catPrix: num(p.prix) })) : [])], pack.remises);
  return { carte, pk, enPlus, horsPack };
}

  return <div className="no-print fixed inset-x-0 bottom-24 z-[70] mx-auto w-fit max-w-[92vw] rounded-xl bg-ink px-4 py-3 text-center text-sm text-white shadow-lg">{msg}</div>;
}

/* ============================ Carte prestation ============================ */

          {p.selected && <svg className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.5 7.5a1 1 0 01-1.4 0l-3.5-3.5a1 1 0 111.4-1.4l2.8 2.8 6.8-6.8a1 1 0 011.4 0z" clipRule="evenodd"/></svg>}

          <span className="block text-[11px] uppercase tracking-wide text-gray-500">Priorité</span>

/* ============================ Proposition ============================ */
// Une page A4 : la formule (ou la sélection), le prix à la commande, le prix par mois, la remise réelle, les conditions.
const prixCourt = (c) => [c.ttcP > 0 && `${eur(c.ttcP)}${xTTC()} à la commande`, c.ttcM > 0 && `${eur(c.ttcM)}${xTTC()} / mois${c.mois ? ` pendant ${c.mois} mois` : ''}`].filter(Boolean).join(' + ');
const signe = (n) => (n > 0.005 ? '+ ' : n < -0.005 ? '− ' : '') + eur(Math.abs(n));
const dureeTxt = (c) => (c.mois ? `pendant ${c.mois} mois` : 'sans engagement');

function buildText(s, c, numero) {
  const L = [], cl = s.client;
  const formule = c.mode === 'formule' && c.pack;
  L.push(`Bonjour${cl.responsable ? ' ' + cl.responsable.split(' ')[0] : ''},`, '');
  L.push(`Voici notre proposition pour ${cl.entreprise || 'votre commerce'} (devis ${numero}).`, '');
  const kombi = formule ? [] : combos(s, c);
  const prixTTC = (a, m) => [a > 0 && eur(a / (1 + num(s.tva) / 100)) + xHT(), m > 0 && (a > 0 ? 'puis ' : '') + eur(m / (1 + num(s.tva) / 100)) + xHT() + ' / mois'].filter(Boolean).join(', ');
  if (kombi.length) L.push('NOS PACKS (chacun peut être pris seul) :');
  else L.push(`${formule ? c.pack.nom.toUpperCase() : 'VOTRE SÉLECTION SUR MESURE'} : ${prixCourt(c)}`);
  if (formule && c.pack.promesse) L.push(c.pack.promesse);
  c.offres.forEach(o => {
    L.push('', kombi.length ? `${o.nom} : ${prixTTC(o.ttcP, o.ttcM)}` : o.nom);
    o.items.forEach(p => L.push(`   ✓ ${p.nom}${qteLabel(p) ? ' (' + qteLabel(p) + ')' : ''}${p.type === 'mensuel' ? ' · chaque mois' : ''}`));
  });
  if (kombi.length) {
    L.push('', 'NOS FORMULES (regroupez et économisez) :');
    kombi.forEach(k => L.push(`★ ${k.nom} (${k.blocs.map(o => o.nom.replace(/^(Pack|Option)\s+/, '')).join(' + ')}) : ${prixTTC(k.ttcP, k.ttcM)} (−${num(k.remise)} %)${k.recommande ? ' · recommandé' : ''}`));
  }
  L.push('');
  if (!kombi.length && c.economie > 0.5) L.push(`Remise incluse : ${eur(c.economie)}${xTTC()} d'économie${c.mois ? ` sur ${c.mois} mois` : ''}${formule ? ' par rapport aux mêmes prestations à la carte' : ''}.`);
  if (!kombi.length) L.push(`Total ${c.mois ? 'sur ' + c.mois + ' mois' : 'du 1er mois'} : ${eur(c.totalTTC)}${FRANCHISE ? ' net à payer' : ' TTC'}.`);
  L.push(`Offre valable jusqu'au ${fmtDate(addDays(today(), num(s.validite)))}.`);
  const v = s.vendeur;
  const vi = vendeurInfo(v);
  if (vi.nom || vi.tel) { L.push(''); L.push([vi.nom, vi.societe, vi.tel, vi.email].filter(Boolean).join(' · ')); }
  return L.join('\n');
}

function BlocVendeur({ v, className = '', fort }) {
  const vi = vendeurInfo(v);
  return (
    <div className={className}>
      {vi.societe && <p className={fort ? 'text-base font-semibold text-ink' : 'font-medium'}>{vi.societe}</p>}
      {vi.nom && <p className={!vi.societe && fort ? 'text-base font-semibold text-ink' : !vi.societe ? 'font-medium' : ''}>{vi.nom}</p>}
      {vi.statut && <p className="text-gray-600">{vi.statut}</p>}
      {vi.adresse && <p className="text-gray-600">{vi.adresse}</p>}
      {(vi.tel || vi.email) && <p className="text-gray-600">{[vi.tel, vi.email].filter(Boolean).join(' · ')}</p>}
      {vi.siret && <p className="text-gray-500">SIRET {vi.siret}</p>}
    </div>
  );
}

function Check({ className = '' }) {
  return <svg className={'mt-0.5 h-5 w-5 shrink-0 text-emerald-600 ' + className} viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0l4-4z" clipRule="evenodd"/></svg>;
}

// Tableau « prix à la carte → remise → prix final », partagé par l'éditeur de pack et la proposition.
function TableRemise({ r, tva, dense }) {
  const cols = [r.brutP > 0 && ['Une fois', r.brutP, r.remP, r.htP, r.ttcP], r.brutM > 0 && ['Par mois', r.brutM, r.remM, r.htM, r.ttcM]].filter(Boolean);
  if (!cols.length) return null;
  const td = dense ? 'px-3 py-1.5' : 'px-3 py-2';
  return (
    <>
    <table className="tabular w-full text-[13px]">
      <thead><tr className="text-left text-[11px] uppercase tracking-wide text-gray-500"><th className={td + ' font-semibold'} />{cols.map(c => <th key={c[0]} className={td + ' text-right font-semibold'}>{c[0]}</th>)}</tr></thead>
      <tbody className="divide-y divide-gray-100">
        <tr><td className={td + ' text-gray-600'}>{FRANCHISE ? 'Prix à la carte' : 'Prix à la carte HT'}</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[1])}</td>)}</tr>
        {cols.some(c => c[2] > 0.005) && <tr className="bg-emerald-50 text-[14px] font-bold text-emerald-800"><td className={td}>🎁 Votre remise</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{c[2] > 0.005 ? <>− {eur(c[2])}<span className="block text-[11px] font-semibold">soit − {Math.round(c[2] / c[1] * 100)} %</span></> : '—'}</td>)}</tr>}
        {!FRANCHISE && <tr className="font-semibold"><td className={td}>Prix final HT</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[3])}</td>)}</tr>}
        <tr className="font-semibold"><td className={td}>{FRANCHISE ? <>Net à payer <span className="font-normal text-gray-500">(TVA non applicable)</span></> : <>Prix final TTC <span className="font-normal text-gray-500">(TVA {tva} %)</span></>}</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[4])}</td>)}</tr>
      </tbody>
    </table>
    {r.economie > 0.5 && (
      <div className="m-2 rounded-xl bg-emerald-600 px-4 py-3 text-white">
        <p className="text-[11px] font-bold uppercase tracking-wider text-white/80">Vos économies</p>
        <p className="font-display text-2xl font-bold leading-tight">{eur(r.economie)}{xTTC()}{r.mois && r.remM > 0.005 ? <span className="font-sans text-sm font-semibold"> sur {r.mois} mois</span> : ''}</p>
        <p className="text-xs text-white/85">par rapport à nos tarifs habituels.</p>
      </div>
    )}
    </>
  );
}

// Carte d'un pack dans la proposition : bandeau de couleur, prix, prestations. Hauteur selon le contenu.
// Carte d'un pack : on coche ou décoche chaque prestation devant le client, le prix suit.
// o = le pack avec toutes ses prestations ; r = le même pack après décochage (prix).
function BlocCard({ o, r, c, large, cocher, exclus, onToggle, prixLigne, pris, onPrendre }) {
  const option = o.id === 'fidel';
  const coul = COULEURS[o.id] || '#1f3a5f';
  const ordre = { essentiel: 0, recommande: 1, option: 2 };
  const tri = (arr) => [...arr].sort((a, b) => ordre[prio(a)] - ordre[prio(b)]);
  const creations = tri(o.items.filter(p => p.type !== 'mensuel')), services = tri(o.items.filter(p => p.type === 'mensuel'));
  const on = (p) => verrouille(p) || !exclus[p.id];
  const ligne = (p) => <LigneMois key={p.id} p={p} on={on(p)} prix={prixLigne(p)} suffixe={p.type === 'mensuel' ? 'm' : ''} onToggle={onToggle && (() => onToggle(p.id))} />;
  return (
    <div className={'avoid-break overflow-hidden rounded-3xl bg-white shadow-sm ' + (option ? 'border-2 border-dashed' : 'border-2')} style={{ borderColor: coul }}>
      <div className="px-5 py-4 text-white" style={{ background: coul }}>
        <p className="text-[11px] font-bold uppercase tracking-[.14em] text-white/70">{option ? 'Option' : 'Pack ' + (OFFRE_IDS.indexOf(o.id) + 1)}</p>
        <p className="font-display text-xl font-bold leading-tight tracking-tight">{o.nom}</p>
        <p className="mt-0.5 text-[13px] leading-snug text-white/80">{o.tag}</p>
      </div>
      <div className={large ? 'sm:grid sm:grid-cols-2' : ''}>
        {creations.length > 0 && (
          <div className="p-3">
            <div className="flex items-end justify-between gap-3 px-1">
              <div>
                <p className="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-gray-900"><span className="h-2 w-2 rounded-full" style={{ background: coul }} />Création</p>
                <p className="text-[11px] text-gray-500">Payée une seule fois</p>
              </div>
              <p className="tabular text-right font-display text-lg font-bold leading-none">{eur(r.bP)} <span className="font-sans text-[11px] font-semibold text-gray-500">{uHT()}</span></p>
            </div>
            <ul className="mt-2 divide-y divide-gray-100 overflow-hidden rounded-2xl border border-gray-200">{creations.map(ligne)}</ul>
          </div>
        )}
        {services.length > 0 && (
          <div className="m-3 mt-1 rounded-2xl bg-sky-50 p-2 ring-1 ring-sky-100">
            <div className="flex items-end justify-between gap-3 px-2 pt-1">
              <div>
                <p className="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-sky-900"><span className="text-sm leading-none">↻</span>Abonnement · au choix</p>
                <p className="text-[11px] text-sky-900/70">Facultatif, sans obligation</p>
              </div>
              <p className="tabular text-right font-display text-lg font-bold leading-none text-sky-900">{eur(r.bM)} <span className="font-sans text-[11px] font-semibold text-sky-900/70">{uHT(' / mois')}</span></p>
            </div>
            {[['⚙ Frais techniques', services.filter(estTechnique)], ['↻ Nos services', services.filter(p => !estTechnique(p))]].filter(([, l]) => l.length).map(([titre, l]) => (
              <div key={titre} className="mt-2">
                {services.some(estTechnique) && services.some(p => !estTechnique(p)) && <p className="px-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-sky-900/70">{titre}</p>}
                <ul className="divide-y divide-sky-100 overflow-hidden rounded-xl bg-white">{l.map(ligne)}</ul>
              </div>
            ))}
          </div>
        )}
      </div>
      {cocher && (
        <button type="button" onClick={onPrendre} aria-pressed={!!pris}
          className={'flex w-full items-center justify-center gap-2 border-t px-5 py-3 text-sm font-semibold transition ' + (pris ? 'text-white' : 'border-gray-100 hover:bg-gray-50')} style={pris ? { background: coul, borderColor: coul } : {}}>
          <span className={'grid h-5 w-5 place-items-center rounded-md border-2 ' + (pris ? 'border-white bg-white' : 'border-gray-400')} style={pris ? { color: coul } : {}}>{pris && '✓'}</span>
          {pris ? 'Pack choisi' : 'Je choisis ce pack'}
        </button>
      )}
    </div>
  );
}

// Une ligne d'abonnement dans une formule : case à cocher, priorité, prix par mois.
const BADGE = {
  essentiel: ['Indispensable', 'bg-rose-100 text-rose-800'],
  recommande: ['Recommandé', 'bg-emerald-100 text-emerald-800'],
  option: ['Au choix', 'bg-slate-100 text-slate-600'],
};
function LigneMois({ p, on, fort, prix, onToggle, lecture, suffixe = '' }) {
  const pr = prio(p), fixe = lecture || !onToggle || verrouille(p);
  const badge = pr === 'essentiel' && p.type === 'mensuel' ? ['Très recommandé', 'bg-emerald-600 text-white'] : BADGE[pr];
  return (
    <li className={on ? '' : 'no-print'}>
      <button type="button" onClick={fixe ? undefined : onToggle} aria-pressed={on} disabled={fixe} title={RAISONS[p.id] || ''}
        className={'flex w-full items-center gap-3 px-3 py-2.5 text-left transition ' + (fixe ? 'cursor-default ' : (fort ? 'hover:bg-white/10 ' : 'hover:bg-gray-50 ')) + (on ? '' : 'opacity-45')}>
        <span className={'grid h-5 w-5 shrink-0 place-items-center rounded-md border-2 transition ' + (on ? (fort ? 'border-white bg-white text-accent' : 'border-accent bg-accent text-white') : (fort ? 'border-white/50' : 'border-gray-300 bg-white'))}>
          {on && (verrouille(p)
            ? <svg className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 2a4 4 0 00-4 4v2H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-1V6a4 4 0 00-4-4zm2 6V6a2 2 0 10-4 0v2h4z" clipRule="evenodd"/></svg>
            : <svg className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.5 7.5a1 1 0 01-1.4 0l-3.5-3.5a1 1 0 111.4-1.4l2.8 2.8 6.8-6.8a1 1 0 011.4 0z" clipRule="evenodd"/></svg>)}
        </span>
        <span className="min-w-0 flex-1">
          <span className="block text-[13px] font-semibold leading-tight">{lecture ? (p.court || p.nom) : p.nom}{!lecture && qteLabel(p) && <span className="font-normal opacity-60"> · {qteLabel(p)}</span>}</span>
          <span className={'mt-1 inline-block rounded px-1.5 py-px text-[9.5px] font-bold uppercase tracking-wider ' + badge[1]}>{badge[0]}</span>
        </span>
        <span className={'tabular shrink-0 text-right text-[13px] font-semibold ' + (on ? '' : 'line-through')}>{eur(prix)}{suffixe && <span className="block text-[10px] font-medium opacity-60">par mois</span>}</span>
      </button>
    </li>
  );
}

function Proposal({ s, c, cTous, numero, onClose, toast, onExclu, onChoix, onDevis, onOption }) {
  // la signature porte sur le devis : il faut une formule ou un pack choisi
  const signerEnLigne = () => {
    const ch = s.choisi || {};
    if (c.mode !== 'formule' && !ch.formule && !(ch.packs || []).length) return toast('Choisissez d\'abord une formule ou un pack (« Je choisis… »), puis cliquez sur « Faire signer ».');
    onDevis(true);
  };
  const cl = s.client, v = s.vendeur;
  const validite = fmtDate(addDays(today(), num(s.validite)));
  const formule = c.mode === 'formule' && c.pack;
  const kombi = formule ? [] : combos(s, c);
  const avecCombos = kombi.length > 0;
  // listes complètes (pour pouvoir recocher) ; prix calculés sur ce qui reste coché
  const tous = formule ? c.offres : cTous.offres;
  const principaux = tous.filter(o => o.id !== 'fidel'), option = tous.find(o => o.id === 'fidel');
  // en formule : lignes et sous-totaux au prix du CRM (à la carte), pour que la remise affichée soit réelle
  const prixBloc = (o) => {
    const r = c.offres.find(x => x.id === o.id) || { bP: 0, bM: 0, htP: 0, htM: 0, ttcP: 0, ttcM: 0 };
    if (!formule) return r;
    const cat = (type) => r.items ? r.items.filter(p => (p.type === 'mensuel') === (type === 'mensuel')).reduce((a, p) => a + c.lineCat(p), 0) : 0;
    return { ...r, bP: Math.max(cat('ponctuel'), r.htP), bM: Math.max(cat('mensuel'), r.htM) };
  };
  const sommeL = (arr) => arr.reduce((a, p) => a + c.line(p), 0);
  const kP = sommeL(c.ponct) ? c.htP / sommeL(c.ponct) : 1, kM = sommeL(c.mens) ? c.htM / sommeL(c.mens) : 1;
  const prixLigne = (p) => (formule ? c.lineCat(p) : c.line(p)); // prix HT du CRM (prix × quantité), la remise est affichée à part
  const carte = { exclus: formule ? {} : (s.exclus || {}), onToggle: formule ? null : onExclu, prixLigne, c };
  const ch = s.choisi || {};
  const choixPack = (id) => onChoix({ formule: null, packs: (ch.packs || []).includes(id) ? ch.packs.filter(x => x !== id) : [...(ch.packs || []), id] });
  const choixFormule = (id) => onChoix({ formule: ch.formule === id ? null : id, packs: [] });
  const dv = avecCombos ? devisCalc(s, c) : null;
  const cols = (n) => (n >= 3 ? 'sm:grid-cols-3' : n === 2 ? 'sm:grid-cols-2' : '');
  const text = buildText(s, c, numero);
  const subject = `Votre proposition ${cl.entreprise ? '– ' + cl.entreprise : ''} (${numero})`;

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); toast('Récapitulatif copié dans le presse-papiers.'); }
    catch { toast('Copie impossible : sélectionnez le texte manuellement.'); }
  };
  const whatsapp = () => {
    window.open(`https://wa.me/${waNumber(cl.telephone)}?text=${encodeURIComponent(text)}`, '_blank');
    toast('WhatsApp est ouvert avec le message prérempli. Vérifiez-le puis appuyez sur Envoyer.');
  };
  const email = () => {
    window.location.href = `mailto:${encodeURIComponent(cl.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
    toast('Votre messagerie est ouverte avec le message prérempli. Joignez le PDF puis envoyez.');
  };

  const tuiles = [
    c.ttcP > 0 && ['À la commande', c.htP, (FRANCHISE ? 'Une seule fois' : `${eur(c.ttcP)}{xTTC()} · une seule fois`)],
    c.ttcM > 0 && ['Chaque mois', c.htM, (FRANCHISE ? dureeTxt(c)[0].toUpperCase() + dureeTxt(c).slice(1) : `${eur(c.ttcM)}{xTTC()} · ${dureeTxt(c)}`)],
    c.ttcM > 0 && [c.mois ? `Total sur ${c.mois} mois` : 'Total du 1er mois', c.totalHT, (FRANCHISE ? 'Net à payer, tout compris' : `${eur(c.totalTTC)}{xTTC()}, tout compris`)],
  ].filter(Boolean);

  return (
    <>

/* ============================ Devis ============================ */
// Ce que le client a choisi (une formule, ou un ou plusieurs packs) → lignes, remises, TVA, acompte.
function devisCalc(s, c) {
  const ch = s.choisi || {};
  const formulePack = c.mode === 'formule' && c.pack; // onglet FORMULES : la formule affichée est le devis
  const k = !formulePack && ch.formule ? combos(s, c).find(x => x.id === ch.formule) : null;
  const ids = formulePack ? c.offres.map(o => o.id) : k ? k.blocs.map(o => o.id) : (ch.packs || []);
  const blocs = c.offres.filter(o => ids.includes(o.id));
  if (!blocs.length) return null;
  const t = num(s.tva) / 100;
  const somme = (arr) => arr.reduce((a, p) => a + c.line(p), 0);
  const kP = somme(c.ponct) ? c.htP / somme(c.ponct) : 1, kM = somme(c.mens) ? c.htM / somme(c.mens) : 1;
  const r = k ? Math.min(100, Math.max(0, num(k.remise))) / 100 : 0;
  const part = (type, kG) => {
    const groupes = blocs.map(o => ({ ...o, lignes: o.items.filter(p => (p.type === 'mensuel') === (type === 'mensuel')) })).filter(o => o.lignes.length);
    const brut = groupes.reduce((a, o) => a + somme(o.lignes), 0);
    const c2 = (x) => Math.round(x * 100) / 100; // montants au centime : ce que le client paie vraiment
    const remG = brut * (1 - kG), apres = brut - remG, remF = apres * r, ht = c2(apres - remF), ttc = c2(ht * (1 + t));
    return { groupes, brut, remG, remF, ht, tva: ttc - ht, ttc };
  };
  const P = part('ponctuel', kP), M = part('mensuel', kM);
  const acompte = s.acompte.actif ? Math.round(P.ttc * num(s.acompte.pct)) / 100 : 0;
  const titre = formulePack ? c.pack.nom : k ? k.nom : blocs.map(o => o.nom).join(' + ');
  return { k, blocs, r, P, M, acompte, titre, mois: c.mois, totalTTC: P.ttc + M.ttc * (c.mois || 1) };
}

function Devis({ s, d, numero, onBack, toast, dateFixe, barre, bandeau, signature, onSigne, onEnvoi, signerAuto }) {
  const cl = s.client, v = s.vendeur;
  const jour = dateFixe ? new Date(dateFixe) : today();
  const date = fmtDate(jour), validite = fmtDate(addDays(jour, num(s.validite)));
  const [envoi, setEnvoi] = useState(null); // { lien, empreinte } du lien de signature
  const faireSigner = async () => {
    if (envoi) return setEnvoi(null);
    const payload = LZString.compressToEncodedURIComponent(JSON.stringify(snapDevis(s, d, numero)));
    const empreinte = await empreinteDe(payload);
    const lien = `${location.origin}${location.pathname}#signer=${payload}`;
    setEnvoi({ lien, empreinte });
    onEnvoi && onEnvoi(numero, empreinte);
  };
  useEffect(() => { if (signerAuto && !signature) faireSigner(); }, []);
  const msgSigner = envoi && [`Bonjour${cl.responsable ? ' ' + cl.responsable.split(' ')[0] : ''},`, '',
    `Voici votre devis N° ${numero} (${d.titre}) à signer en ligne :`, envoi.lien, '',
    'Ouvrez le lien, vérifiez le devis, puis signez avec le doigt en bas de la page.', '',
    [vendeurInfo(v).nom, vendeurInfo(v).societe, vendeurInfo(v).tel].filter(Boolean).join(' · ')].join('\n');
  const texte = [
    `Bonjour${cl.responsable ? ' ' + cl.responsable.split(' ')[0] : ''},`, '',
    `Voici votre devis N° ${numero} : ${d.titre}.`,
    d.P.ttc > 0 ? `• Une seule fois : ${FRANCHISE ? eur(d.P.ttc) : `${eur(d.P.ttc)} TTC (${eur(d.P.ht)} HT)`}` : false,
    d.M.ttc > 0 ? `• Chaque mois : ${FRANCHISE ? eur(d.M.ttc) : `${eur(d.M.ttc)} TTC (${eur(d.M.ht)} HT)`}${d.mois ? `, engagement ${d.mois} mois` : ''}` : false,
    d.acompte > 0 ? `• Acompte à la signature : ${eur(d.acompte)}${xTTC()}` : false,
    `Devis valable jusqu'au ${validite}.`, '',
    [vendeurInfo(v).nom, vendeurInfo(v).societe, vendeurInfo(v).tel].filter(Boolean).join(' · '),
  ].filter(l => l !== false).join('\n');
  const whatsapp = () => { window.open(`https://wa.me/${waNumber(cl.telephone)}?text=${encodeURIComponent(texte)}`, '_blank'); toast('WhatsApp est ouvert avec le message prérempli. Joignez le PDF du devis puis envoyez.'); };
  const email = () => { window.location.href = `mailto:${encodeURIComponent(cl.email || '')}?subject=${encodeURIComponent(`Devis ${numero}${cl.entreprise ? ' – ' + cl.entreprise : ''}`)}&body=${encodeURIComponent(texte)}`; toast('Votre messagerie est ouverte. Joignez le PDF du devis puis envoyez.'); };

  const Tableau = ({ part, mensuel }) => (
    <table className="w-full text-[13px]">
      <thead>
        <tr className="border-b-2 border-ink text-left text-[11px] uppercase tracking-wide text-gray-600">
          <th className="py-2 pr-3 font-semibold">Désignation</th>
          <th className="w-14 py-2 text-right font-semibold">Qté</th>
          <th className="w-24 py-2 text-right font-semibold">{FRANCHISE ? 'PU' : 'PU HT'}</th>
          <th className="w-28 py-2 text-right font-semibold">{FRANCHISE ? 'Total' : 'Total HT'}{mensuel ? ' / mois' : ''}</th>
        </tr>
      </thead>
      <tbody className="tabular">
        {part.groupes.map(o => (
          <React.Fragment key={o.id}>
            <tr><td colSpan="4" className="pb-1 pt-3 text-[11px] font-bold uppercase tracking-wider" style={{ color: COULEURS[o.id] }}>{o.nom}</td></tr>
            {o.lignes.map(p => (
              <tr key={p.id} className="border-b border-gray-100 align-top">
                <td className="py-2 pr-3"><span className="font-medium">{p.nom}</span><span className="desc block text-[11px] leading-snug text-gray-500">{p.description}</span></td>
                <td className="py-2 text-right">{Math.max(1, num(p.qte) || 1)}{p.unite && !['mois', 'forfait', 'site'].includes(p.unite) ? <span className="block text-[10px] text-gray-500">{p.unite}</span> : null}</td>
                <td className="py-2 text-right">{eur(num(p.prix))}</td>
                <td className="py-2 text-right">{eur(num(p.prix) * Math.max(1, num(p.qte) || 1))}</td>

/* ============================ Signature électronique ============================ */
// Le lien contient tout le devis (compressé) : pas de serveur. Le retour contient le devis + la signature.
const partSnap = (x) => ({ ...x, groupes: x.groupes.map(o => ({ id: o.id, nom: o.nom,
  lignes: o.lignes.map(p => ({ id: p.id, nom: p.nom, court: p.court, description: p.description, qte: p.qte, unite: p.unite, prix: p.prix, type: p.type })) })) });
const snapDevis = (s, d, numero) => ({ v: 1, numero, dossier: DOSSIER_COURANT, date: new Date().toISOString(),
  s: { client: s.client, vendeur: s.vendeur, tva: s.tva, acompte: s.acompte, paiement: s.paiement, validite: s.validite },
  d: { titre: d.titre, mois: d.mois, acompte: d.acompte, totalTTC: d.totalTTC, r: d.r,
    k: d.k ? { nom: d.k.nom, remise: d.k.remise, blocs: d.k.blocs.map(o => ({ id: o.id, nom: o.nom })) } : null,
    P: partSnap(d.P), M: partSnap(d.M) } });
async function empreinteDe(txt) {
  try {
    const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(h)].slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase().match(/.{4}/g).join('-');
  } catch { return '—'; }
}
const lire = (payload) => { try { return JSON.parse(LZString.decompressFromEncodedURIComponent(payload)); } catch { return null; } };
const quandTxt = (iso) => { const x = new Date(iso); return `le ${fmtDate(x)} à ${x.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`; };
const traitsPath = (traits) => traits.map(t => 'M' + t.map(([x, y]) => x + ' ' + y).join(' L') + (t.length === 1 ? ' l0.1 0' : '')).join(' ');

function SignatureVue({ sig }) {
  return (
    <div className="mt-2 rounded-xl border border-emerald-300 bg-emerald-50/40 p-2">
      <svg viewBox="0 0 600 200" className="h-24 w-full"><path d={traitsPath(sig.traits)} fill="none" stroke="#0b1b33" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round" /></svg>
      <p className="text-[12px] font-semibold text-emerald-800">✓ Bon pour accord · signé électroniquement par {sig.nom}</p>
      <p className="text-[11px] text-gray-600">{quandTxt(sig.quand)}{sig.empreinte ? ` · empreinte du devis ${sig.empreinte}` : ''}</p>
    </div>
  );
}

function PaveSignature({ onSigne, nomDefaut }) {
  const ref = useRef(), traits = useRef([]), enCours = useRef(null);
  const [nom, setNom] = useState(nomDefaut || ''), [ok, setOk] = useState(false), [vide, setVide] = useState(true);
  const dessine = () => {
    const c = ref.current, ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1b33';
    ctx.stroke(new Path2D(traitsPath(traits.current)));
  };
  const pt = (e) => { const r = ref.current.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 600), Math.round((e.clientY - r.top) / r.height * 200)]; };
  const down = (e) => { e.preventDefault(); ref.current.setPointerCapture(e.pointerId); enCours.current = [pt(e)]; traits.current.push(enCours.current); setVide(false); dessine(); };
  const move = (e) => { if (!enCours.current) return; const p = pt(e), l = enCours.current[enCours.current.length - 1];
    if (Math.abs(p[0] - l[0]) + Math.abs(p[1] - l[1]) >= 3) { enCours.current.push(p); dessine(); } };
  const up = () => { enCours.current = null; };
  const effacer = () => { traits.current = []; setVide(true); dessine(); };
  const pret = nom.trim().length > 1 && !vide && ok;
  return (
    <div className="no-print-border mt-2 space-y-2">
      <input value={nom} onChange={e => setNom(e.target.value)} placeholder="Votre nom et prénom"
        className="w-full rounded-xl border border-gray-300 px-3 py-2 text-[15px] outline-none focus:border-ink" />
      <div className="relative">
        <canvas ref={ref} width="600" height="200" onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
          className="h-36 w-full touch-none rounded-xl border-2 border-dashed border-gray-300 bg-white" style={{ touchAction: 'none' }} />
        {vide && <p className="pointer-events-none absolute inset-0 grid place-items-center text-sm text-gray-400">Signez ici avec le doigt</p>}
        {!vide && <button type="button" onClick={effacer} className="absolute right-2 top-2 rounded-lg bg-gray-100 px-2 py-1 text-xs text-gray-600">Effacer</button>}
      </div>
      <label className="flex items-start gap-2 text-[13px]">
        <input type="checkbox" checked={ok} onChange={e => setOk(e.target.checked)} className="mt-0.5 h-5 w-5 shrink-0 accent-emerald-600" />
        <span>J'ai lu ce devis et je l'accepte : <b>« Bon pour accord »</b>.</span>
      </label>
      <button type="button" disabled={!pret} onClick={() => onSigne({ nom: nom.trim(), traits: traits.current, quand: new Date().toISOString() })}
        className={'w-full rounded-xl py-3 text-[15px] font-semibold text-white ' + (pret ? 'bg-emerald-600' : 'bg-gray-300')}>Signer le devis</button>
      <p className="text-[11px] text-gray-500">Signature électronique simple. La date, l'heure et l'empreinte du devis sont enregistrées avec votre signature.</p>
    </div>
  );
}

// Enregistre la signature dans le CRM, si ce navigateur est celui du CRM
// renvoie l'id du dossier, 'orphelin' (mise de côté, à rattacher), true (ancien CRM) ou false (appareil du client)
const enregistrerSignature = (snap, sig) => {
  try {
    if (!lireJSON(IDX) && lireJSON(STORE)) initCRM();
    const numero = snap.numero, id = trouverDossier(snap);
    if (id) {
      const st = lireJSON(DK(id)); if (!st) return false;
      const deja = (st.signes || {})[numero];
      if (deja && deja.quand !== sig.quand) return id; // déjà signé : la première signature fait foi
      st.signes = { ...(st.signes || {}), [numero]: sig };
      const su = st.suivi || {};
      if (!deja) st.suivi = { ...su, etape: 'signe', gagneLe: su.gagneLe || sig.quand, proba: undefined, prochaine: { date: '', action: '' },
        historique: [...(su.historique || []), { date: new Date().toISOString(), type: 'auto', texte: `Devis ${numero} signé par ${sig.nom}` }] };
      ecrireJSON(DK(id), st); majEntree(id, st);
      return id;
    }
    const idx = lireJSON(IDX);
    if (idx && idx.dossiers && idx.dossiers.length) {
      if (!(idx.orphelins || []).some(o => o.numero === numero && o.sig.quand === sig.quand))
        idx.orphelins = [...(idx.orphelins || []), { numero, client: ((snap.s || {}).client || {}).entreprise || '', sig, recu: new Date().toISOString() }];
      ecrireJSON(IDX, idx); return 'orphelin';
    }
    const st = lireJSON(STORE);
    if (!idx && st) { st.signes = { ...(st.signes || {}), [numero]: sig }; ecrireJSON(STORE, st); return true; }
    return false;
  } catch { return false; }
};

// Page ouverte par le client (#signer=…) ou par vous au retour (#signe=…)
function PageSignature({ hash }) {
  const retour = hash.startsWith('#signe=');

  const [payload, sigTxt] = brut.split('.');

  const [sig, setSig] = useState(() => (retour ? lire(sigTxt) : null));
  const [empreinte, setEmpreinte] = useState('');
  const [msg, setMsg] = useState('');
  const [dansCrm, setDansCrm] = useState(false);
  useEffect(() => { empreinteDe(payload).then(setEmpreinte); }, [payload]);
  const st = useMemo(() => { const id = snap && trouverDossier(snap); return id ? lireJSON(DK(id)) : lireJSON(STORE); }, []);
  const envoye = st && snap && (st.envois || {})[snap.numero];
  useEffect(() => { if (retour && sig && snap && empreinte) setDansCrm(enregistrerSignature(snap, { ...sig, empreinte, payload })); }, [empreinte]);
  if (!snap) return <div className="mx-auto max-w-md p-8 text-center"><p className="font-semibold">Ce lien de devis est incomplet.</p><p className="text-sm text-gray-600">Demandez à votre prestataire de vous le renvoyer.</p></div>;
  FRANCHISE = num(snap.s.tva) === 0;
  const v = snap.s.vendeur || {}, cl = snap.s.client || {};
  const toast = (m) => { setMsg(m); setTimeout(() => setMsg(''), 4500); };
  const signer = (x) => { const full = { ...x, empreinte }; setSig(full); setDansCrm(enregistrerSignature(snap, { ...full, payload })); window.scrollTo(0, 0); document.getElementById('proposal-overlay').scrollTo(0, 0); };
  const lienRetour = sig && `${location.origin}${location.pathname}#signe=${payload}.${LZString.compressToEncodedURIComponent(JSON.stringify({ nom: sig.nom, traits: sig.traits, quand: sig.quand }))}`;
  const texteRetour = sig && [`Bonjour${v.nom ? ' ' + v.nom.split(' ')[0] : ''},`, '', `Voici le devis N° ${snap.numero} signé par ${sig.nom}${cl.entreprise ? ' (' + cl.entreprise + ')' : ''} :`, lienRetour].join('\n');
  const btn = 'rounded-xl px-4 py-2 text-sm font-semibold';
  const barre = (
    <>
      <p className="text-sm font-semibold">{sig ? '✅ Devis signé' : '✍ Devis à signer'} · N° {snap.numero}</p>
      <div className="ml-auto flex flex-wrap gap-2">
        {dansCrm && <button onClick={() => { location.hash = typeof dansCrm === 'string' && dansCrm !== 'orphelin' ? '#/c/' + dansCrm : '#/'; }} className={btn + ' border border-gray-200'}>← Retour au CRM</button>}
        {!sig && <button onClick={() => document.getElementById('signature-client').scrollIntoView({ behavior: 'smooth' })} className={btn + ' bg-emerald-600 text-white'}>Signer ↓</button>}
        <button onClick={() => window.print()} className={btn + ' bg-ink text-white'}>PDF</button>
      </div>
    </>
  );
  const bandeau = sig && (
    <div className="no-print mx-auto max-w-[1040px] border-b border-emerald-200 bg-emerald-50 px-4 py-4 sm:px-6">
      {retour ? <>
        <p className="font-semibold text-emerald-900">Devis signé par {sig.nom} {quandTxt(sig.quand)}.</p>
        <p className="text-sm text-gray-700">{envoye ? (envoye.empreinte === empreinte ? '✓ Identique au devis que vous avez envoyé (même empreinte).' : '⚠ Ce devis ne correspond pas à l\'empreinte du devis envoyé : vérifiez-le.') : 'Empreinte du devis : ' + empreinte}
          {dansCrm === 'orphelin' ? ' Aucun dossier ne correspond : la signature est mise de côté dans « Mes clients », à rattacher.' : dansCrm ? ' Signature enregistrée dans le dossier du client.' : ''} Cliquez sur « PDF » pour l'archiver.</p>
      </> : <>
        <p className="font-semibold text-emerald-900">Merci {sig.nom.split(' ')[0]}, votre devis est signé.</p>
        {dansCrm ? <p className="text-sm text-gray-700">La signature est enregistrée dans le CRM. Vous pouvez rendre la tablette.</p> : <>
          <p className="text-sm text-gray-700">Dernière étape : renvoyez le devis signé {vendeurInfo(v).societe || vendeurInfo(v).nom ? 'à ' + (vendeurInfo(v).societe || vendeurInfo(v).nom) : 'à votre prestataire'}.</p>
          <div className="mt-3 flex flex-wrap gap-2">
            {v.telephone && <button onClick={() => window.open(`https://wa.me/${waNumber(v.telephone)}?text=${encodeURIComponent(texteRetour)}`, '_blank')} className={btn + ' bg-[#25D366] text-white'}>Renvoyer par WhatsApp</button>}
            {v.email && <button onClick={() => { window.location.href = `mailto:${encodeURIComponent(v.email)}?subject=${encodeURIComponent(`Devis ${snap.numero} signé`)}&body=${encodeURIComponent(texteRetour)}`; }} className={btn + ' border border-gray-200 bg-white'}>Renvoyer par email</button>}
            <button onClick={async () => { try { await navigator.clipboard.writeText(texteRetour); toast('Message copié : collez-le à votre prestataire.'); } catch { prompt('Copiez ce lien :', lienRetour); } }} className={btn + ' border border-gray-200 bg-white'}>Copier le lien</button>
          </div>
        </>}
      </>}
    </div>
  );
  return (
    <>
      <Devis s={snap.s} d={snap.d} numero={snap.numero} dateFixe={snap.date} toast={toast} barre={barre} bandeau={bandeau}
        signature={sig && { ...sig, empreinte: sig.empreinte || empreinte }} onSigne={signer} />
      <Toast msg={msg} />
    </>
  );
}

function Racine() {
  const [hash, setHash] = useState(location.hash);
  useEffect(() => { const f = () => setHash(location.hash); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  const [crm] = useState(() => (hash.startsWith('#signer=') || hash.startsWith('#signe=') ? null : initCRM()));
  if (hash.startsWith('#signer=') || hash.startsWith('#signe=')) return <PageSignature key={hash} hash={hash} />;
  if (!crm && !lireJSON(IDX)) return <App />; // reprise impossible : l'ancien CRM reste utilisable tel quel
  const m = hash.match(/^#\/c\/([\w-]+)(\/proposition)?/);
  if (m && lireJSON(DK(m[1]))) return m[2] ? <App key={m[1]} dossierId={m[1]} /> : <Fiche360 key={m[1] + hash} id={m[1]} />;
  if (hash.startsWith('#/clients')) return <Accueil />;
  if (hash.startsWith('#/pipeline')) return <Pipeline />;
  const mc = hash.match(/^#\/commande\/([\w-]+)/); if (mc) return <PageCommande key={mc[1]} id={mc[1]} />;
  const mf = hash.match(/^#\/facture\/([\w-]+)/); if (mf) return <PageFacture key={mf[1]} id={mf[1]} />;
  if (hash.startsWith('#/commandes')) return <PageCommandes />;
  if (hash.startsWith('#/factures')) return <PageFactures />;
  if (hash.startsWith('#/abonnements')) return <PageAbonnements />;
  if (hash.startsWith('#/depenses')) return <PageDepenses />;
  if (hash.startsWith('#/stats')) return <PageStats />;
  if (hash.startsWith('#/menu')) return <PageMenu />;
  return <Dashboard />;
}

// Mode à la carte : comparer la sélection avec une formule, sans rien ajouter sans validation.
function Comparaison({ s, onProposer }) {
  const sel = s.prestations.filter(p => p.selected);
  const [packId, setPackId] = useState('');
  const [garder, setGarder] = useState(true);
  if (!sel.length) return null;
  const eff = (pk) => itemsEffectifs(s, pk);
  const overlap = (pk) => sel.filter(p => eff(pk)[p.id]).length;
  const auto = s.packs.find(pk => sel.every(p => eff(pk)[p.id])) || [...s.packs].sort((a, b) => overlap(b) - overlap(a))[0];
  const pack = s.packs.find(x => x.id === packId) || auto;
  const { carte, pk, enPlus, horsPack } = comparer(s, pack, garder);
  const dP = pk.ttcP - carte.ttcP, dM = pk.ttcM - carte.ttcM, dT = pk.totalTTC - carte.totalTTC;
  const duree = carte.mois ? `sur ${carte.mois} mois` : 'le 1er mois';
  const bloc = (titre, r, accent) => (
    <div className={'rounded-2xl p-4 ' + (accent ? 'bg-accent text-white' : 'bg-white ring-1 ring-gray-200')}>
      <p className={'text-xs font-bold uppercase tracking-wide ' + (accent ? 'text-white/70' : 'text-gray-500')}>{titre}</p>
      <p className="tabular mt-1 font-display text-2xl font-semibold leading-tight">{eur(r.ttcP)}<span className={'ml-1 font-sans text-xs ' + (accent ? 'text-white/70' : 'text-gray-500')}>{FRANCHISE ? 'à la commande' : 'TTC à la commande'}</span></p>
      {r.ttcM > 0 && <p className="tabular font-semibold">+ {eur(r.ttcM)} <span className={'text-xs font-normal ' + (accent ? 'text-white/70' : 'text-gray-500')}>{FRANCHISE ? '/ mois' : 'TTC / mois'}</span></p>}
      <p className={'tabular mt-1 text-xs ' + (accent ? 'text-white/70' : 'text-gray-500')}>Total {duree} : {eur(r.totalTTC)}{xTTC()}</p>
    </div>
  );
  return (
    <div className="mt-8 rounded-3xl bg-gray-50 p-4 sm:p-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="font-display text-lg font-semibold">Comparer avec une formule</p>
          <p className="text-sm text-gray-500">La sélection à la carte face à un pack : ce qui est en plus, et la différence de prix.</p>
        </div>
        <Segmented value={pack.id} options={s.packs.map(x => ({ v: x.id, label: x.nom.replace(/^Pack\s+/i, '') }))} onChange={setPackId} />
      </div>
      <div className="mt-4 grid gap-3 sm:grid-cols-2">
        {bloc('Sélection à la carte', carte)}
        {bloc(pack.nom, pk, true)}
      </div>
      <div className="tabular mt-3 rounded-2xl bg-white px-4 py-3 text-sm ring-1 ring-gray-200">
        <span className="font-semibold">Différence avec le {pack.nom} : </span>
        {signe(dP)} à la commande · {signe(dM)} par mois · <strong>{signe(dT)} {duree}</strong>
        {pk.economie > 0.5 && <span className="block text-emerald-700">Le pack inclut {eur(pk.economie)}{xTTC()} de remise par rapport aux mêmes prestations à la carte.</span>}
      </div>
      <div className="mt-4 grid gap-4 sm:grid-cols-2">
        <div>
          <p className="text-sm font-semibold">En plus dans le pack {enPlus.length ? `(${enPlus.length})` : ''}</p>
          {enPlus.length ? (
            <ul className="mt-1.5 space-y-1 text-sm">{enPlus.map(p => (
              <li key={p.id} className="flex justify-between gap-3"><span>+ {p.nom}</span><span className="tabular shrink-0 text-gray-500">{eur(pk.lineCat(p))}{xHT()}{p.type === 'mensuel' ? '/mois' : ''}</span></li>
            ))}</ul>

            <label className="mt-2 flex items-center gap-2 text-sm">
              <input type="checkbox" checked={garder} onChange={e => setGarder(e.target.checked)} className="h-4 w-4 accent-[#1f3a5f]" />

            </label>

        )}
      </div>
      <button onClick={() => onProposer(pack, garder ? horsPack : [], enPlus)}
        className="mt-5 w-full rounded-xl bg-accent py-3 text-[15px] font-semibold text-white shadow-sm hover:brightness-110 sm:w-auto sm:px-6">
        Proposer le {pack.nom} à la place
      </button>
    </div>
  );
}

/* ============================ Application ============================ */
/* ============================ Dossiers clients (CRM de gestion) ============================ */
// Stockage : un index (liste, modèle de tarifs, coordonnées) + une clé par dossier.
// L'ancienne clé 'crm-proposition-v1' n'est jamais modifiée ni effacée : c'est la copie de secours de La Boulangerie.
let DOSSIER_COURANT = null;
const IDX = 'crm-v2-index';
const DK = (id) => 'crm-v2-d-' + id;
// Pipeline : Nouveau prospect → Rendez-vous → Proposition envoyée → Négociation → Gagné / Perdu (probabilité par défaut)
const ETAPES = [
  { id: 'a_contacter', label: 'Nouveau prospect', coul: '#64748b', proba: 10 },
  { id: 'rdv', label: 'Rendez-vous', coul: '#7c3aed', proba: 30 },
  { id: 'proposition', label: 'Proposition envoyée', coul: '#b45309', proba: 50 },
  { id: 'negociation', label: 'Négociation', coul: '#0369a1', proba: 70 },
  { id: 'signe', label: 'Gagné', coul: '#047857', proba: 100 },
  { id: 'perdu', label: 'Perdu', coul: '#9ca3af', proba: 0 },
];
const normEtape = (id) => (id === 'contacte' ? 'a_contacter' : ETAPES.some(e => e.id === id) ? id : 'a_contacter'); // ancienne étape « Contacté »
const etapeDe = (id) => ETAPES.find(e => e.id === normEtape(id)) || ETAPES[0];
const rangEtape = (id) => ETAPES.findIndex(e => e.id === normEtape(id));
const lireJSON = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const ecrireJSON = (k, v) => localStorage.setItem(k, JSON.stringify(v)); // peut lever une erreur (mémoire pleine)
const nouvelId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const isoJour = (d = new Date()) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const plusJours = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return isoJour(d); };
const jourCourt = (iso) => iso ? new Date(iso + (iso.length === 10 ? 'T12:00' : '')).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
const villeDe = (adr) => { const a = adr || ''; const m = a.match(/\d{5}\s+([^,]+)/); return (m ? m[1] : a.split(',').pop() || '').trim(); };
const TYPES_ECHANGE = { appel: '📞 Appel', visite: '🚪 Visite', message: '💬 Message', note: '📝 Note', auto: '⚙' };

// Montants du dossier : le devis choisi s'il existe, sinon la sélection en cours
const montantsDe = (st) => {
  try {
    const c = compute(st), d = devisCalc(st, c);
    return d ? { P: d.P.ttc, M: d.M.ttc, mois: d.mois || 0 } : { P: c.ttcP, M: c.ttcM, mois: c.mois || 0 };
  } catch { return { P: 0, M: 0, mois: 0 }; }
};
const entreeDe = (id, st, prev = {}) => {
  const cl = st.client || {}, su = st.suivi || {}, m = montantsDe(st), etape = normEtape(su.etape);
  // devis signés : montants de la version signée (figée), pas de l'état modifié depuis
  const signesListe = Object.entries(st.signes || {}).map(([numero, sg]) => { const sn = sg && sg.payload && lire(sg.payload);
    return { numero, quand: sg.quand, titre: sn ? sn.d.titre : '', P: sn ? sn.d.P.ttc : m.P, M: sn ? sn.d.M.ttc : m.M, mois: sn ? (sn.d.mois || 0) : m.mois }; })
    .sort((a, b) => (a.quand || '').localeCompare(b.quand || ''));
  const chiffre = rangEtape(etape) >= rangEtape('proposition') || !!((st.choisi || {}).formule || ((st.choisi || {}).packs || []).length || Object.keys(st.envois || {}).length);
  // montant estimé : saisi à la main, sinon le devis (seulement s'il a été chiffré pour ce client)
  const estime = su.estime !== undefined && su.estime !== '' ? num(su.estime) : chiffre ? m.P + m.M * Math.max(1, m.mois || 0) : 0;
  return { ...prev, id, entreprise: cl.entreprise || 'Sans nom', responsable: cl.responsable || '', secteur: cl.secteur || '',
    signesListe, estime, proba: su.proba !== undefined && su.proba !== '' ? num(su.proba) : etapeDe(etape).proba,
    gagneLe: su.gagneLe || (signesListe[0] || {}).quand || '', perduLe: su.perduLe || '', rdv: su.rdv || null,
    ville: villeDe(cl.adresse), telephone: cl.telephone || '', etape,
    prochaine: su.prochaine || { date: '', action: '' }, numero: su.numero || '', signe: Object.keys(st.signes || {}).length > 0,
    montantP: m.P, montantM: m.M, mois: m.mois, chiffre: rangEtape(su.etape || 'a_contacter') >= rangEtape('proposition') || !!((st.choisi || {}).formule || ((st.choisi || {}).packs || []).length || Object.keys(st.envois || {}).length), cree: prev.cree || new Date().toISOString(), maj: new Date().toISOString(), archive: !!prev.archive };
};
const majEntree = (id, st) => {
  const idx = lireJSON(IDX); if (!idx) return;
  const i = idx.dossiers.findIndex(x => x.id === id);
  const e = entreeDe(id, st, i >= 0 ? idx.dossiers[i] : {});
  if (i >= 0) idx.dossiers[i] = e; else idx.dossiers.push(e);
  ecrireJSON(IDX, idx);
};
// Enregistre un dossier ; les coordonnées du vendeur sont communes à tous les dossiers
const sauverDossier = (id, st) => {
  const disque = lireJSON(DK(id));
  if (disque) {
    const manquantes = Object.keys(disque.signes || {}).filter(k => !(st.signes || {})[k]);
    if (manquantes.length) st = { ...st, signes: { ...disque.signes, ...st.signes }, suivi: disque.suivi }; // signature reçue ailleurs : on la garde
    if (JSON.stringify(disque) === JSON.stringify(st)) return st; // rien n'a changé : on ne touche à rien
  }
  ecrireJSON(DK(id), st);
  const idx = lireJSON(IDX); if (!idx) return;
  idx.vendeur = st.vendeur;
  const i = idx.dossiers.findIndex(x => x.id === id);
  const e = entreeDe(id, st, i >= 0 ? idx.dossiers[i] : {});
  if (i >= 0) idx.dossiers[i] = e; else idx.dossiers.push(e);
  ecrireJSON(IDX, idx);
  return st;
};
const trouverDossier = (snap) => {
  const idx = lireJSON(IDX); if (!idx || !snap) return null;
  const e = (snap.dossier && idx.dossiers.find(x => x.id === snap.dossier && lireJSON(DK(x.id))))
    || idx.dossiers.find(x => x.numero === snap.numero);
  return e ? e.id : null;
};
// Modèle pour les nouveaux clients : tarifs, packs, formules, remises et conditions (pas la fiche client ni les photos)
// une remise en euros propre à un devis devient le pourcentage équivalent (arrondi) pour les nouveaux clients
const remisesModele = (st) => {
  let c = null; try { c = compute({ ...st, mode: 'carte' }); } catch {}
  const conv = (r, brut) => (r && r.mode !== '%' ? { mode: '%', valeur: String(brut > 0 ? Math.round(num(r.valeur) / brut * 100) : 0) } : r);
  return { ponctuel: conv(st.remises.ponctuel, c ? c.brutP : 0), mensuel: conv(st.remises.mensuel, c ? c.brutM : 0) };
};
const modeleDe = (st) => JSON.parse(JSON.stringify({
  prestations: st.prestations, offres: st.offres, packs: st.packs, combos: st.combos, remises: remisesModele(st),
  tva: st.tva, franchise: st.franchise, arrondi: st.arrondi, engagement: st.engagement, acompte: st.acompte,
  inclus: st.inclus, paiement: st.paiement, validite: st.validite, presentation: st.presentation || '' }));
const numeroSuivant = (idx) => `DEV-${new Date().getFullYear()}-${String(idx.compteur || 1).padStart(3, '0')}`;
const totauxDe = (st) => { const c = compute(st); return [c.htP, c.htM, c.totalTTC, c.acompte].map(x => x.toFixed(2)).join('|'); };

// Première ouverture : l'état actuel (La Boulangerie) devient le dossier n° 1, à l'identique.
function initCRM() {
  try {
    const deja = lireJSON(IDX);
    if (deja && deja.v === 2) return deja;
    const idx = { v: 2, dossiers: [], compteur: 1, sauvegarde: null, orphelins: [] };
    const ancien = lireJSON(STORE);
    if (ancien) {
      const s1 = load(); // exactement ce que l'ancien CRM affichait
      const d = today();
      const ancienNumero = `DEV-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${(s1.client.entreprise || 'X').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'X'}`;
      const signes = Object.keys(s1.signes || {}), envois = Object.keys(s1.envois || {});
      const numero = signes[signes.length - 1] || envois[envois.length - 1] || ancienNumero;
      s1.suivi = { etape: signes.length ? 'signe' : 'proposition', prochaine: { date: signes.length ? '' : isoJour(), action: signes.length ? '' : 'Relancer pour la signature du devis' },
        historique: [{ date: new Date().toISOString(), type: 'auto', texte: 'Dossier repris de la première version du CRM (données inchangées).' }], numero };
      const avant = totauxDe(s1);
      const id = 'boulangerie';
      ecrireJSON(DK(id), s1);
      if (totauxDe(load(lireJSON(DK(id)))) !== avant) { localStorage.removeItem(DK(id)); return null; } // contrôle au centime
      idx.dossiers.push(entreeDe(id, s1));
      idx.modele = modeleDe(s1); idx.modeleSource = s1.client.entreprise || 'La Boulangerie';
      idx.vendeur = s1.vendeur; idx.compteur = 2;
    } else {
      idx.modele = modeleDe(DEFAULTS); idx.modeleSource = 'tarifs par défaut'; idx.vendeur = DEFAULTS.vendeur;
    }
    ecrireJSON(IDX, idx);
    return idx;
  } catch { return null; }
}

function creerDossier(infos) {
  const idx = lireJSON(IDX);
  const id = nouvelId();
  const st = { ...DEFAULTS, ...JSON.parse(JSON.stringify(idx.modele || modeleDe(DEFAULTS))), prefillApplied: true,
    client: { ...blankClient, entreprise: infos.entreprise.trim(), secteur: infos.secteur || '', telephone: infos.telephone || '', adresse: infos.ville || '', responsable: infos.responsable || '' },
    reponses: {}, notes: {}, exclus: {}, choisi: {}, envois: {}, signes: {}, optionOuverte: false, mode: 'carte', pack: '',
    visuels: { logo: '', photos: [], demoUrl: '' }, vendeur: idx.vendeur || DEFAULTS.vendeur,
    suivi: { etape: infos.etape || 'a_contacter', prochaine: { date: (infos.etape || 'a_contacter') === 'a_contacter' ? isoJour() : plusJours(2), action: infos.etape === 'rdv' ? 'Préparer le rendez-vous' : 'Premier contact' },
      historique: [{ date: new Date().toISOString(), type: 'auto', texte: `Dossier créé avec les formules de « ${idx.modeleSource || 'votre modèle'} »` }], numero: numeroSuivant(idx) } };
  idx.compteur = (idx.compteur || 1) + 1;
  ecrireJSON(DK(id), st);
  idx.dossiers.push(entreeDe(id, st));
  ecrireJSON(IDX, idx);
  return id;
}

function dupliquerDossier(id) {
  const src = lireJSON(DK(id)), idx = lireJSON(IDX); if (!src || !idx) return null;
  const nid = nouvelId();
  const st = { ...JSON.parse(JSON.stringify(src)), client: { ...src.client, entreprise: (src.client.entreprise || 'Client') + ' (copie)' }, envois: {}, signes: {}, choisi: {},
    suivi: { etape: 'a_contacter', prochaine: { date: isoJour(), action: 'Premier contact' }, historique: [{ date: new Date().toISOString(), type: 'auto', texte: `Copie du dossier « ${src.client.entreprise || ''} »` }], numero: numeroSuivant(idx) } };
  idx.compteur = (idx.compteur || 1) + 1;
  ecrireJSON(DK(nid), st); idx.dossiers.push(entreeDe(nid, st)); ecrireJSON(IDX, idx);
  return nid;
}

const tailleStockage = () => { let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); n += (k.length + (localStorage.getItem(k) || '').length) * 2; } } catch {} return n; };

// Bandeau de suivi en tête du dossier : étape, prochaine action, historique, statut du devis
function BandeauDossier({ s, set, toast, numero }) {
  const su = s.suivi || { etape: 'a_contacter', prochaine: { date: '', action: '' }, historique: [] };
  const [histo, setHisto] = useState(false);
  const [type, setType] = useState('visite'), [texte, setTexte] = useState('');
  const maj = (patch, ligne) => set(p => { const x = p.suivi || su; return { suivi: { ...x, ...patch,
    historique: ligne ? [...(x.historique || []), { date: new Date().toISOString(), ...ligne }] : (x.historique || []) } }; });
  const changerEtape = (e) => {
    if (e === normEtape(su.etape)) return;
    let motif = '';
    if (e === 'perdu') { motif = prompt('Motif de la perte ? (prix, pas le moment, concurrent…)'); if (motif === null) return; }
    maj({ etape: e, proba: undefined, ...(e === 'perdu' ? { motif, perduLe: new Date().toISOString() } : {}), ...(e === 'signe' ? { gagneLe: su.gagneLe || new Date().toISOString() } : {}), ...(e === 'signe' || e === 'perdu' ? { prochaine: { date: '', action: '' } } : {}) },
      { type: 'auto', texte: `Étape : ${etapeDe(e).label}${motif ? ' · ' + motif : ''}` });
  };

  // fixer un rendez-vous fait passer un nouveau prospect en « Rendez-vous »
  const majRdv = (patch) => { const r = { ...(su.rdv || {}), ...patch }; const avance = r.date && normEtape(su.etape) === 'a_contacter';
    maj({ rdv: r, ...(avance ? { etape: 'rdv', proba: undefined } : {}), ...(r.date && !(su.prochaine || {}).date ? { prochaine: { date: r.date, action: 'Rendez-vous' } } : {}) },
      avance ? { type: 'auto', texte: `Rendez-vous fixé le ${jourCourt(r.date)}` } : null); };
  const noter = () => { if (!texte.trim()) return; maj({}, { type, texte: texte.trim() }); setTexte(''); setHisto(true); toast('Échange noté.'); };
  const sig = (s.signes || {})[numero], env = (s.envois || {})[numero];

  const fini = normEtape(su.etape) === 'signe' || su.etape === 'perdu';
  const avenant = () => {
    if (!confirm(`Le devis ${numero} est signé et reste tel quel.\n\nCréer un nouveau devis (nouveau numéro) pour proposer d'autres prestations à ce client ?`)) return;
    const idx = lireJSON(IDX); const n = numeroSuivant(idx); idx.compteur = (idx.compteur || 1) + 1; ecrireJSON(IDX, idx);
    set(p => ({ choisi: {}, suivi: { ...(p.suivi || su), numero: n, prochaine: { date: plusJours(3), action: 'Présenter le nouveau devis' },
      historique: [...((p.suivi || su).historique || []), { date: new Date().toISOString(), type: 'auto', texte: `Nouveau devis ${n} ouvert (le devis ${numero} reste signé)` }] } }));
    toast(`Nouveau devis ${n} : modifiez la sélection puis faites-le signer.`);
  };
  const modele = () => {
    if (!confirm(`Utiliser les tarifs, packs et formules de « ${s.client.entreprise || 'ce dossier'} » pour les PROCHAINS nouveaux clients ?\n\nLes dossiers existants ne changent pas.`)) return;
    const idx = lireJSON(IDX); idx.modele = modeleDe(s); idx.modeleSource = s.client.entreprise || 'un dossier'; ecrireJSON(IDX, idx);
    toast('Modèle mis à jour pour les prochains clients.');
  };
  return (
    <div className="rounded-2xl border border-gray-200 bg-white p-4 shadow-sm">
      <div className="-mx-1 flex gap-1.5 overflow-x-auto px-1 pb-1">
        {ETAPES.map(e => {
          const on = e.id === normEtape(su.etape);
          return <button key={e.id} onClick={() => changerEtape(e.id)} className={'shrink-0 rounded-full px-3 py-1.5 text-[13px] font-semibold transition ' + (on ? 'text-white shadow-sm' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}
            style={on ? { background: e.coul } : {}}>{e.label}</button>;
        })}
      </div>
      {su.etape === 'perdu' && su.motif && <p className="mt-1 text-xs text-gray-500">Motif : {su.motif}</p>}
      {!fini && (
        <div className="mt-3 flex flex-wrap items-center gap-2">
          <span className={'text-xs font-bold uppercase tracking-wider ' + (retard ? 'text-red-600' : 'text-gray-500')}>{retard ? '⚠ En retard' : 'Prochaine action'}</span>
          <input value={prochaine.action} onChange={e => setProchaine({ action: e.target.value })} placeholder="Rappeler, envoyer le devis…" className="min-w-[160px] flex-1 rounded-lg border border-gray-200 px-3 py-1.5 text-sm outline-none focus:border-ink" />

          <button onClick={() => setProchaine({ date: plusJours(1) })} className="rounded-lg bg-gray-100 px-2.5 py-1.5 text-xs font-medium">Demain</button>
          <button onClick={() => setProchaine({ date: plusJours(7) })} className="rounded-lg bg-gray-100 px-2.5 py-1.5 text-xs font-medium">+1 sem.</button>

      </div>
      <div className="mt-3 flex flex-wrap items-center gap-2 text-[13px]">

        {sig ? <span className="rounded-full bg-emerald-50 px-3 py-1 font-semibold text-emerald-800">✓ Devis {numero} signé par {sig.nom} le {jourCourt(sig.quand)}</span>
          : env ? <span className="rounded-full bg-amber-50 px-3 py-1 font-semibold text-amber-800">✍ Lien de signature créé le {jourCourt(env.date)}, en attente</span>
          : <span className="rounded-full bg-gray-100 px-3 py-1 text-gray-600">Devis N° {numero} · pas encore envoyé</span>}
        <button onClick={() => setHisto(!histo)} className="ml-auto rounded-lg px-2 py-1 text-sm font-medium text-gray-600 hover:bg-gray-100">Historique ({(su.historique || []).length}) {histo ? '▴' : '▾'}</button>
      </div>
