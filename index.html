/* ============================ Formules ============================
   Les formules s'emboîtent : Premium = Photo-Vidéo + Site Web + ses ajouts ; Croissance = Premium + … ; Sérénité = Croissance + …
   Chaque pack ne stocke que ses ajouts (et { retire: true } pour enlever une prestation héritée).

   La remise affichée = prix à la carte − prix final : elle est toujours réelle. */
// Les ids internes (signature, premium, serenite) sont gardés pour les sauvegardes ; les noms suivent les packs vendus.
const IDS_VISUEL_WEB = ['tournage', 'montage', 'seo', 'site', 'suiviseo', 'hebergement', 'domaine', 'miseenligne'];
const IDS_CROISSANCE = [...IDS_VISUEL_WEB, 'planmkt', 'blog', 'contenus', 'social', 'reels'];
const IDS_SERENITE = [...IDS_CROISSANCE, 'sms', 'fidelite', 'qravis', 'saison', 'reporting'];

  { id: 'premium', blocs: ['base', 'web', 'social'], v: 2, nom: 'Pack Croissance', sous: '+ communication', recommande: true,

  { id: 'serenite', blocs: ['base', 'web', 'social', 'fidel'], v: 2, nom: 'Pack Sérénité', sous: '+ fidélisation',

    items: toItems(['sms', 'fidelite', 'qravis', 'saison', 'reporting']), herite: true, remises: remiseDe(20) },
];

// Formules affichées dans le devis « à la carte » : elles regroupent les packs choisis, avec une remise.
const COMBOS = [

const QUESTIONS = [

  { id: 'reseaux', q: 'Qui gère actuellement vos réseaux sociaux ?',

  { id: 'nouveaux', q: 'Souhaitez-vous attirer de nouveaux clients ?',
    options: ['Oui, c\'est la priorité', 'Oui', 'Plutôt fidéliser'] },
  { id: 'produits', q: 'Quels produits ou services souhaitez-vous mettre en avant ?', multi: true,
    options: ['Produits phares', 'Nouveautés', 'Offres et promotions', 'Sur-mesure / commandes', 'Événements'] },
  { id: 'deleguer', q: 'Souhaitez-vous déléguer entièrement votre communication ?',
    options: ['Oui, entièrement', 'En partie', 'Non, être accompagné'] },
  { id: 'budget', q: 'Avez-vous un budget mensuel prévu ?',
    options: ['Moins de 200 €', '200 à 500 €', '500 à 1 000 €', 'Plus de 1 000 €', 'Pas encore défini'] },
  { id: 'demarrage', q: 'Quand souhaitez-vous démarrer ?',
    options: ['Immédiatement', 'Dans le mois', 'Dans 3 mois', 'À définir'] },

// Prestations suggérées selon les réponses
const suggestions = (rep) => {
  const s = new Set();
  const has = (q, o) => (rep[q] || []).includes(o);
  if (has('demande', 'Shooting photo')) ['tournage'].forEach(x => s.add(x));
  if (has('demande', 'Vidéos')) ['tournage', 'montage'].forEach(x => s.add(x));
  if (has('demande', 'Contenus pour mes écrans en boutique')) ['tournage', 'montage'].forEach(x => s.add(x));
  if (has('demande', 'Site internet')) s.add('site');
  if (has('demande', 'Réseaux sociaux')) s.add('social');
  if (has('site', 'Non') || has('site', 'Oui, à refaire')) ['site', 'miseenligne', 'hebergement', 'maintenance'].forEach(x => s.add(x));
  if (has('objectif', 'Être visible sur Google') || has('objectif', 'Attirer plus de clients en boutique')) ['seo', 'suiviseo'].forEach(x => s.add(x));
  if (has('objectif', 'Développer les réseaux sociaux') || has('reseaux', 'Personne') || has('reseaux', 'Moi-même')) ['social', 'contenus'].forEach(x => s.add(x));
  if (has('objectif', 'Image plus premium')) ['tournage'].forEach(x => s.add(x));
  if (has('deleguer', 'Oui, entièrement')) ['social', 'contenus', 'majsite', 'reporting'].forEach(x => s.add(x));
  if (has('nouveaux', 'Oui, c\'est la priorité')) ['seo', 'montage'].forEach(x => s.add(x));

};

  { v: 0, label: 'Sans engagement' }, { v: 3, label: '3 mois' }, { v: 6, label: '6 mois' }, { v: 12, label: '12 mois' },

  paiement: "Acompte à la signature, solde à la mise en ligne.\nAbonnements mensuels payables par prélèvement ou virement en début de mois.",

/* ============================ Utilitaires ============================ */
const STORE = 'crm-proposition-v1';
// Franchise en base de TVA : plus de HT / TTC, un seul montant net à payer.
let FRANCHISE = false;
const xHT = () => (FRANCHISE ? '' : ' HT');    // après un montant
const xTTC = () => (FRANCHISE ? '' : ' TTC');
const uHT = (m = '') => (FRANCHISE ? m.trim() : 'HT' + m); // libellé seul : « HT / mois » → « / mois »
const MENTION_TVA = 'TVA non applicable, art. 293 B du CGI';
const eur = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: n % 1 ? 2 : 0 }).format(n || 0);
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const today = () => new Date();
const fmtDate = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const load = () => {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!s) return DEFAULTS;
    // passage en franchise de TVA (une seule fois) : chaque prix HT × (1 + TVA) pour garder les mêmes totaux,
    // qui deviennent des montants nets à payer.
    if (!s.franchise) {
      const k = 1 + num(s.tva ?? 20) / 100;
      const x = (v) => (v === '' || v === undefined || v === null ? v : Math.round(num(v) * k * 100) / 100);
      const euros = (r) => r && Object.fromEntries(Object.entries(r).map(([t, o]) => [t, o && o.mode !== '%' ? { ...o, valeur: x(o.valeur) } : o]));
      s.prestations = (s.prestations || []).map(p => (p.prix !== undefined ? { ...p, prix: x(p.prix) } : p));
      s.packs = (s.packs || []).map(pk => ({ ...pk, remises: euros(pk.remises),
        items: Object.fromEntries(Object.entries(pk.items || {}).map(([id, o]) => [id, o && o.prix !== undefined && o.prix !== '' ? { ...o, prix: x(o.prix) } : o])) }));
      s.remises = euros(s.remises);
      s.tva = 0; s.franchise = true;
    }
    // fusion prudente avec les valeurs par défaut (nouvelles prestations, nouveaux champs)
    const valide = (o) => OFFRE_IDS.includes(o);
    const blocsV4 = (s.offres || []).some(o => o.v === 4);
    const stocke = (id) => (s.prestations || []).find(x => x.id === id) || {};
    const prestations = CATALOGUE.map(p => {
      const st = stocke(p.id);
      // prestation redéfinie (v différente) : on reprend la nouvelle version, en gardant la sélection
      // nouvelle version : textes du catalogue repris ; prix gardés si la prestation est seulement renommée (garde)
      const base = p.v && st.v !== p.v ? { selected: !!st.selected, offre: st.offre,
        ...(p.garde && st.prix !== undefined ? { prix: st.prix, qte: st.qte, unite: st.unite } : {}) } : st;
      // l'ancienne « fiche Google » (gbp) est fusionnée dans « Mise en place du référencement Google »
      if (p.id === 'seo' && stocke('gbp').selected) base.selected = true;
      // « Base clients » (formulaire) fusionnée dans le programme de fidélité : prix additionnés, coché si l'un des deux l'était
      if (p.id === 'fidelite' && st.v !== p.v && stocke('formulaire').id) {
        const f = stocke('formulaire');
        base.selected = !!(st.selected || f.selected);
        base.prix = num(st.prix ?? 348) + num(f.prix ?? 228);
      }
      // blocs réorganisés (v4) : chaque prestation du catalogue reprend son bloc par défaut une fois
      const offre = blocsV4 ? remapOffre(base.offre) : p.offre;
      return { ...p, ...base, offre: valide(offre) ? offre : p.offre };
    });
    // seules les prestations créées à la main sont gardées en plus du catalogue
    const anciennes = { video: 'base' }; // prestations des versions précédentes, gardées avec vos prix
    const extras = (s.prestations || [])
      // prestations retirées à la demande (shooting photo professionnel)
      .filter(x => x.id !== 'perso-shooting' && x.nom !== 'Shooting photo professionnel')
      .filter(x => String(x.id).startsWith('perso-') || anciennes[x.id])
      .map(x => anciennes[x.id] ? { ...x, id: 'perso-' + x.id } : x)
      .filter((x, i, arr) => arr.findIndex(y => y.id === x.id) === i)
      .map(x => ({ ...x, offre: valide(remapOffre(x.offre)) ? remapOffre(x.offre) : 'base' }));
    // formules : réglages enregistrés gardés s'ils datent de la version actuelle du pack
    let packs = PACKS.map(d => {
      const st = (s.packs || []).find(x => x.id === d.id && x.v === d.v);
      return st ? { ...d, ...st, herite: !!st.herite, remises: { ...d.remises, ...st.remises } } : d;
    });
    // anciennes formules (listes complètes) : on ne garde que les ajouts, le reste vient des formules parentes
    const defauts = { packs: PACKS };
    packs = packs.map(pk => {
      if (pk.herite) return pk;
      const parentDef = itemsHerites(defauts, PACKS.find(x => x.id === pk.id));
      const vide = (o) => !o || !Object.keys(o).length;
      const items = {};
      // une ligne « au prix du catalogue » reste au prix du catalogue, même si un pack parent a un prix modifié
      const modifieAilleurs = (id) => packs.some(x => x.id !== pk.id && !vide((x.items || {})[id]) && !(x.items[id] || {}).retire);
      Object.entries(pk.items || {}).forEach(([id, o]) => {
        if (!(parentDef[id] && vide(o))) items[id] = o;
        else if (modifieAilleurs(id)) items[id] = { prix: '', qte: '', type: '' };
      });
      Object.keys(parentDef).forEach(id => { if (!(id in (pk.items || {}))) items[id] = { retire: true }; });
      return { ...pk, items, herite: true };
    });
    // noms d'offres personnalisés gardés seulement s'ils datent de la version actuelle des offres
    const offres = OFFRES.map(o => ({ ...o, ...((s.offres || []).find(x => x.id === o.id && x.v === o.v) || {}) }));
    // une seule fois : si la fiche enregistrée est vide, on y met le client préenregistré
    const vide = !Object.values(s.client || {}).some(v => String(v).trim());
    const client = !s.prefillApplied && vide ? PREFILL.client : { ...blankClient, ...s.client };
    const demo = !s.prefillApplied && !(s.visuels || {}).demoUrl ? { demoUrl: PREFILL.demoUrl } : {};
    const res = { ...DEFAULTS, ...s, prefillApplied: true, client, vendeur: { ...DEFAULTS.vendeur, ...s.vendeur },
      visuels: { ...DEFAULTS.visuels, ...s.visuels, ...demo }, remises: { ...DEFAULTS.remises, ...s.remises }, acompte: { ...DEFAULTS.acompte, ...s.acompte },
      prestations: [...prestations, ...extras], offres, packs,
      mode: s.mode === 'formule' ? 'formule' : 'carte', pack: packs.some(x => x.id === s.pack) ? s.pack : '' };
    return s.arrondi ? res : arrondir(res);
  } catch { return DEFAULTS; }
};

// Une seule fois : prix arrondis à l'euro supérieur (fini les 23,88 €), sans changer les totaux nets
// du devis en cours : l'écart d'arrondi est repris dans la remise (en euros, exacte au centime).
function arrondir(s0) {
  const up = (v) => (v === '' || v === undefined || v === null ? v : Math.ceil(num(v) - 0.001));
  const avant = compute(s0), avantPk = compute({ ...s0, mode: 'formule' });
  const s = { ...s0, arrondi: true,
    prestations: s0.prestations.map(p => ({ ...p, prix: up(p.prix) })),
    packs: s0.packs.map(pk => ({ ...pk, items: Object.fromEntries(Object.entries(pk.items || {}).map(([id, o]) =>
      [id, o && o.prix !== undefined && o.prix !== '' ? { ...o, prix: up(o.prix) } : o])) })) };
  const garde = (rem, brutAvant, brutApres, netAvant, type) => {
    if (Math.abs(brutApres - brutAvant) < 0.005) return rem[type];
    return { mode: '€', valeur: String(Math.round((brutApres - netAvant) * 100) / 100) };
  };
  const lignes = (sel, type) => sel.filter(p => p.type === type).reduce((a, p) => a + num(p.prix) * Math.max(1, num(p.qte) || 1), 0);
  // devis à la carte
  const carte = s.prestations.filter(p => p.selected && !(!verrouille(p) && (s.exclus || {})[p.id]));
  const selAvant = s0.prestations.filter(p => p.selected && !(!verrouille(p) && (s0.exclus || {})[p.id]));
  s.remises = { ponctuel: garde(s0.remises, lignes(selAvant, 'ponctuel'), lignes(carte, 'ponctuel'), avant.mode === 'carte' ? avant.htP : compute({ ...s0, mode: 'carte' }).htP, 'ponctuel'),
    mensuel: garde(s0.remises, lignes(selAvant, 'mensuel'), lignes(carte, 'mensuel'), compute({ ...s0, mode: 'carte' }).htM, 'mensuel') };
  // formule en cours (onglet FORMULES)
  const pk0 = s0.packs.find(x => x.id === s0.pack);
  if (pk0) {
    const la = packLines(s0, pk0), pk = s.packs.find(x => x.id === pk0.id), lb = packLines(s, pk);
    pk.remises = { ponctuel: garde(pk0.remises, lignes(la, 'ponctuel'), lignes(lb, 'ponctuel'), avantPk.htP, 'ponctuel'),
      mensuel: garde(pk0.remises, lignes(la, 'mensuel'), lignes(lb, 'mensuel'), avantPk.htM, 'mensuel') };
  }
  return s;
}

// Réduit une image (photo de téléphone) avant de la garder en mémoire locale
const compress = (file, max = 1400, q = 0.82) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onerror = reject;
  r.onload = () => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      const png = file.type === 'image/png' || file.type === 'image/svg+xml';
      if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL(png ? 'image/png' : 'image/jpeg', q));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

const waNumber = (tel) => {
  let d = (tel || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (d.startsWith('0') && d.length === 10) return '33' + d.slice(1);
  return d;
};

// « 1 journée », « 2 journées », « 3 × lot de 20 »
const UNITES_MUETTES = ['', 'mois', 'forfait', 'site', 'boucle'];
const qteTexte = (p) => {
  const q = Math.max(1, num(p.qte) || 1), u = (p.unite || '').trim();
  if (q === 1 && UNITES_MUETTES.includes(u.toLowerCase())) return '';
  if (!u) return `${q}`;
  if (q === 1) return `1 ${u}`;
  return /^[a-zàâéèêîôûç-]+$/i.test(u) && !/s$/.test(u) ? `${q} ${u}s` : `${q} × ${u}`;
};

// pour les listes : « × 3 » quand il n'y a pas d'unité
const qteLabel = (p) => { const t = qteTexte(p); return /^\d+$/.test(t) ? '× ' + t : t; };

/* ============================ Calculs ============================ */
// Lignes d'une formule : le catalogue, avec les réglages propres au pack. catPrix = prix à la carte.
const PARENTS = { signature: ['photo', 'siteweb'], premium: ['signature'], serenite: ['premium'] };
const fusion = (base, propres) => {
  const res = { ...base };
  Object.entries(propres || {}).forEach(([id, o]) => { if (o && (o.retire || o.off)) delete res[id]; else res[id] = { ...(res[id] || {}), ...o }; });
  return res;
};
// prestations héritées des formules parentes
function itemsHerites(s, pk, vus = new Set()) {
  if (!pk || !pk.id || vus.has(pk.id)) return {};
  vus.add(pk.id);
  return (PARENTS[pk.id] || []).reduce((acc, pid) => {
    const par = (s.packs || []).find(x => x.id === pid);
    return par ? { ...acc, ...fusion(itemsHerites(s, par, vus), par.items) } : acc;
  }, {});
}
const itemsEffectifs = (s, pk) => (pk ? fusion(itemsHerites(s, pk), pk.items) : {});
// toutes les prestations proposées dans le pack, cochées ou non (pour les garder visibles)
function membresPack(s, pk, vus = new Set()) {
  const m = new Set();
  if (!pk || !pk.id || vus.has(pk.id)) return m;
  vus.add(pk.id);
  (PARENTS[pk.id] || []).forEach(pid => { const par = (s.packs || []).find(x => x.id === pid); if (par) membresPack(s, par, vus).forEach(i => m.add(i)); });
  Object.keys(pk.items || {}).forEach(i => m.add(i));
  return m;
}

const packLines = (s, pack) => !pack ? [] : (() => { const eff = itemsEffectifs(s, pack); return s.prestations
  .filter(p => eff[p.id])
  .map(p => {
    const o = eff[p.id];
    return { ...p, selected: true, catPrix: num(p.prix),
      prix: o.prix !== undefined && o.prix !== '' ? o.prix : p.prix,
      qte: o.qte !== undefined && o.qte !== '' ? o.qte : p.qte,
      type: o.type || p.type };
  }); })();

function compute(s) {
  const pack = (s.packs || []).find(x => x.id === s.pack);
  if (s.mode === 'formule') return { ...calc(s, packLines(s, pack), pack ? pack.remises : DEFAULTS.remises), mode: 'formule', pack };
  const exclu = (p) => !verrouille(p) && (s.exclus || {})[p.id];
  return { ...calc(s, s.prestations.filter(p => p.selected && !exclu(p)), s.remises), mode: 'carte', pack: null };
}

// Moteur unique, pour la carte comme pour les formules.
function calc(s, sel, remises) {
  const line = (p) => num(p.prix) * Math.max(1, num(p.qte) || 1);
  const lineCat = (p) => num(p.catPrix ?? p.prix) * Math.max(1, num(p.qte) || 1);
  const ponct = sel.filter(p => p.type === 'ponctuel');
  const mens = sel.filter(p => p.type === 'mensuel');
  const lignesP = ponct.reduce((a, p) => a + line(p), 0);
  const lignesM = mens.reduce((a, p) => a + line(p), 0);
  const rem = (brut, r) => Math.min(brut, Math.max(0, r.mode === '%' ? brut * num(r.valeur) / 100 : num(r.valeur)));
  const htP = lignesP - rem(lignesP, remises.ponctuel), htM = lignesM - rem(lignesM, remises.mensuel);
  // prix à la carte et remise réelle (prix à la carte − prix final, jamais négative)
  const catP = ponct.reduce((a, p) => a + lineCat(p), 0), catM = mens.reduce((a, p) => a + lineCat(p), 0);
  const brutP = Math.max(catP, htP), brutM = Math.max(catM, htM);
  const remP = brutP - htP, remM = brutM - htM;
  const t = num(s.tva) / 100;
  const ttcP = htP * (1 + t), ttcM = htM * (1 + t);
  const mois = s.engagement || 0;
  const moisCalc = mois || 1; // sans engagement : 1er mois
  const totalHT = htP + htM * moisCalc;
  const totalTTC = ttcP + ttcM * moisCalc;
  const acompte = s.acompte.actif ? ttcP * num(s.acompte.pct) / 100 : 0;
  // répartition par offre (remise répartie au prorata)
  const kP = lignesP ? htP / lignesP : 1, kM = lignesM ? htM / lignesM : 1;
  const offres = (s.offres || OFFRES).map(o => {
    const items = sel.filter(p => (p.offre || 'base') === o.id);
    const bP = items.filter(p => p.type === 'ponctuel').reduce((a, p) => a + line(p), 0);
    const bM = items.filter(p => p.type === 'mensuel').reduce((a, p) => a + line(p), 0);
    const oHtP = bP * kP, oHtM = bM * kM;
    const oTtcP = oHtP * (1 + t), oTtcM = oHtM * (1 + t);
    const oAcompte = s.acompte.actif ? oTtcP * num(s.acompte.pct) / 100 : 0;
    return { ...o, items, bP, bM, htP: oHtP, htM: oHtM, ttcP: oTtcP, ttcM: oTtcM, acompte: oAcompte,
      totalTTC: oTtcP + oTtcM * moisCalc, totalHT: oHtP + oHtM * moisCalc };
  }).filter(o => o.items.length);
  const economie = (remP + remM * moisCalc) * (1 + t); // TTC, sur la durée d'engagement
  return { sel, ponct, mens, line, lineCat, brutP, brutM, remP, remM, htP, htM, ttcP, ttcM, tvaP: ttcP - htP, tvaM: ttcM - htM,
    mois, moisCalc, totalHT, totalTTC, acompte, offres, economie };
}

// Formules du devis à la carte : somme des packs choisis (prix des lignes) moins la remise de la formule.
// Une formule identique à la précédente (pack vide) n'est pas affichée.
function combos(s, c) {
  const t = 1 + num(s.tva) / 100, vus = new Set();
  const somme = (arr) => arr.reduce((a, p) => a + c.line(p), 0);
  // facteurs de la remise globale (une fois / par mois)
  const kP = somme(c.ponct) ? c.htP / somme(c.ponct) : 1, kM = somme(c.mens) ? c.htM / somme(c.mens) : 1;
  const ordre = { essentiel: 0, recommande: 1, option: 2 };
  return (s.combos || COMBOS).map(k => {
    const blocs = c.offres.filter(o => k.blocs.includes(o.id));
    const cle = blocs.map(o => o.id).join('+');
    if (blocs.length < 2 || vus.has(cle)) return null;
    vus.add(cle);
    const r = Math.min(100, Math.max(0, num(k.remise))) / 100;
    const inclus = () => true;
    const items = blocs.flatMap(o => o.items);
    const unefois = items.filter(p => p.type !== 'mensuel');
    const mensTous = items.filter(p => p.type === 'mensuel').sort((a, b) => ordre[prio(a)] - ordre[prio(b)]);
    const mensuel = mensTous.filter(inclus);
    // prix après remise globale, puis remise de la formule
    const bP = somme(unefois) * kP, bM = somme(mensuel) * kM;
    const htP = bP * (1 - r), htM = bM * (1 - r);
    const prixMois = (p) => c.line(p); // prix HT du CRM, les remises sont affichées à part
    return { ...k, blocs, bP, bM, htP, htM, ttcP: htP * t, ttcM: htM * t, unefois, mensuel, mensTous, inclus, prixMois,
      brutP: somme(unefois), brutM: somme(mensuel),
      eco: ((bP - htP) + (bM - htM) * c.moisCalc) * t, totalTTC: (htP + htM * c.moisCalc) * t };
  }).filter(Boolean);
}

// Compare la sélection à la carte avec une formule (en gardant ou non les prestations hors pack).
function comparer(s, pack, garder) {
  const carteSel = s.prestations.filter(p => p.selected);
  const carte = calc(s, carteSel, s.remises);
  const lignes = packLines(s, pack);
  const enPlus = lignes.filter(p => !carteSel.some(x => x.id === p.id));
  const effP = itemsEffectifs(s, pack);
  const horsPack = carteSel.filter(p => !effP[p.id]);
  const pk = calc(s, [...lignes, ...(garder ? horsPack.map(p => ({ ...p, catPrix: num(p.prix) })) : [])], pack.remises);
  return { carte, pk, enPlus, horsPack };
}

        <label className="w-28">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">{FRANCHISE ? 'Prix' : 'Prix HT'}</span>
          <div className="relative">
            <input type="number" inputMode="decimal" min="0" step="1" value={p.prix} onChange={e => onChange({ prix: e.target.value })}
              className={inputCls + ' tabular py-2 pr-7'} />
            <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">€</span>
          </div>
        </label>
        <label className="w-20">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">Qté</span>
          <input type="number" inputMode="numeric" min="1" step="1" value={p.qte} onChange={e => onChange({ qte: e.target.value })}
            className={inputCls + ' tabular py-2'} />

        <label className="w-32">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">Unité</span>
          <input value={p.unite || ''} onChange={e => onChange({ unite: e.target.value })} placeholder="journée…"
            className={inputCls + ' py-2 text-sm'} />

        <div>
          <span className="block text-[11px] uppercase tracking-wide text-gray-500">Priorité</span>
          <ChoixPriorite value={prio(p)} onChange={v => onChange({ priorite: v })} />
        </div>
        <label className="min-w-[150px]">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">Dans l'offre</span>
          <select value={p.offre || 'base'} onChange={e => onChange({ offre: e.target.value })}
            className={inputCls + ' py-2 text-sm'}>
            {offres.map(o => <option key={o.id} value={o.id}>{o.nom}</option>)}
          </select>

          <div className="tabular text-base font-semibold">{eur(total)}</div>

        </div>
        {onRemove && <button type="button" onClick={onRemove} className="pb-2 text-xs text-gray-400 hover:text-red-600">Supprimer</button>}
      </div>
    </div>
  );
}

/* ============================ Proposition ============================ */
// Une page A4 : la formule (ou la sélection), le prix à la commande, le prix par mois, la remise réelle, les conditions.
const prixCourt = (c) => [c.ttcP > 0 && `${eur(c.ttcP)}${xTTC()} à la commande`, c.ttcM > 0 && `${eur(c.ttcM)}${xTTC()} / mois${c.mois ? ` pendant ${c.mois} mois` : ''}`].filter(Boolean).join(' + ');
const signe = (n) => (n > 0.005 ? '+ ' : n < -0.005 ? '− ' : '') + eur(Math.abs(n));
const dureeTxt = (c) => (c.mois ? `pendant ${c.mois} mois` : 'sans engagement');

function buildText(s, c, numero) {
  const L = [], cl = s.client;
  const formule = c.mode === 'formule' && c.pack;
  L.push(`Bonjour${cl.responsable ? ' ' + cl.responsable.split(' ')[0] : ''},`, '');
  L.push(`Voici notre proposition pour ${cl.entreprise || 'votre commerce'} (devis ${numero}).`, '');
  const kombi = formule ? [] : combos(s, c);
  const prixTTC = (a, m) => [a > 0 && eur(a / (1 + num(s.tva) / 100)) + xHT(), m > 0 && (a > 0 ? 'puis ' : '') + eur(m / (1 + num(s.tva) / 100)) + xHT() + ' / mois'].filter(Boolean).join(', ');
  if (kombi.length) L.push('NOS PACKS (chacun peut être pris seul) :');
  else L.push(`${formule ? c.pack.nom.toUpperCase() : 'VOTRE SÉLECTION SUR MESURE'} : ${prixCourt(c)}`);
  if (formule && c.pack.promesse) L.push(c.pack.promesse);
  c.offres.forEach(o => {
    L.push('', kombi.length ? `${o.nom} : ${prixTTC(o.ttcP, o.ttcM)}` : o.nom);
    o.items.forEach(p => L.push(`   ✓ ${p.nom}${qteLabel(p) ? ' (' + qteLabel(p) + ')' : ''}${p.type === 'mensuel' ? ' · chaque mois' : ''}`));
  });
  if (kombi.length) {
    L.push('', 'NOS FORMULES (regroupez et économisez) :');
    kombi.forEach(k => L.push(`★ ${k.nom} (${k.blocs.map(o => o.nom.replace(/^(Pack|Option)\s+/, '')).join(' + ')}) : ${prixTTC(k.ttcP, k.ttcM)} (−${num(k.remise)} %)${k.recommande ? ' · recommandé' : ''}`));
  }
  L.push('');
  if (!kombi.length && c.economie > 0.5) L.push(`Remise incluse : ${eur(c.economie)}${xTTC()} d'économie${c.mois ? ` sur ${c.mois} mois` : ''}${formule ? ' par rapport aux mêmes prestations à la carte' : ''}.`);
  if (!kombi.length) L.push(`Total ${c.mois ? 'sur ' + c.mois + ' mois' : 'du 1er mois'} : ${eur(c.totalTTC)}${FRANCHISE ? ' net à payer' : ' TTC'}.`);
  L.push(`Offre valable jusqu'au ${fmtDate(addDays(today(), num(s.validite)))}.`);
  if (s.visuels.demoUrl) L.push('Démonstration : ' + s.visuels.demoUrl);
  const v = s.vendeur;
  if (v.nom || v.telephone) { L.push(''); L.push([v.nom, v.societe, v.telephone, v.email].filter(Boolean).join(' · ')); }
  return L.join('\n');
}

function Check({ className = '' }) {
  return <svg className={'mt-0.5 h-5 w-5 shrink-0 text-emerald-600 ' + className} viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0l4-4z" clipRule="evenodd"/></svg>;
}

// Tableau « prix à la carte → remise → prix final », partagé par l'éditeur de pack et la proposition.
function TableRemise({ r, tva, dense }) {
  const cols = [r.brutP > 0 && ['Une fois', r.brutP, r.remP, r.htP, r.ttcP], r.brutM > 0 && ['Par mois', r.brutM, r.remM, r.htM, r.ttcM]].filter(Boolean);
  if (!cols.length) return null;
  const td = dense ? 'px-3 py-1.5' : 'px-3 py-2';
  return (
    <>
    <table className="tabular w-full text-[13px]">
      <thead><tr className="text-left text-[11px] uppercase tracking-wide text-gray-500"><th className={td + ' font-semibold'} />{cols.map(c => <th key={c[0]} className={td + ' text-right font-semibold'}>{c[0]}</th>)}</tr></thead>
      <tbody className="divide-y divide-gray-100">
        <tr><td className={td + ' text-gray-600'}>{FRANCHISE ? 'Prix à la carte' : 'Prix à la carte HT'}</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[1])}</td>)}</tr>
        {cols.some(c => c[2] > 0.005) && <tr className="bg-emerald-50 text-[14px] font-bold text-emerald-800"><td className={td}>🎁 Votre remise</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{c[2] > 0.005 ? <>− {eur(c[2])}<span className="block text-[11px] font-semibold">soit − {Math.round(c[2] / c[1] * 100)} %</span></> : '—'}</td>)}</tr>}
        {!FRANCHISE && <tr className="font-semibold"><td className={td}>Prix final HT</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[3])}</td>)}</tr>}
        <tr className="font-semibold"><td className={td}>{FRANCHISE ? <>Net à payer <span className="font-normal text-gray-500">(TVA non applicable)</span></> : <>Prix final TTC <span className="font-normal text-gray-500">(TVA {tva} %)</span></>}</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[4])}</td>)}</tr>
      </tbody>
    </table>
    {r.economie > 0.5 && (
      <div className="m-2 rounded-xl bg-emerald-600 px-4 py-3 text-white">
        <p className="text-[11px] font-bold uppercase tracking-wider text-white/80">Vos économies</p>
        <p className="font-display text-2xl font-bold leading-tight">{eur(r.economie)}{xTTC()}{r.mois && r.remM > 0.005 ? <span className="font-sans text-sm font-semibold"> sur {r.mois} mois</span> : ''}</p>
        <p className="text-xs text-white/85">par rapport à nos tarifs habituels.</p>
      </div>
    )}
    </>
  );
}

// Carte d'un pack dans la proposition : bandeau de couleur, prix, prestations. Hauteur selon le contenu.
// Carte d'un pack : on coche ou décoche chaque prestation devant le client, le prix suit.
// o = le pack avec toutes ses prestations ; r = le même pack après décochage (prix).
function BlocCard({ o, r, c, large, cocher, exclus, onToggle, prixLigne, pris, onPrendre }) {
  const option = o.id === 'fidel';
  const coul = COULEURS[o.id] || '#1f3a5f';
  const ordre = { essentiel: 0, recommande: 1, option: 2 };
  const tri = (arr) => [...arr].sort((a, b) => ordre[prio(a)] - ordre[prio(b)]);
  const creations = tri(o.items.filter(p => p.type !== 'mensuel')), services = tri(o.items.filter(p => p.type === 'mensuel'));
  const on = (p) => verrouille(p) || !exclus[p.id];
  const ligne = (p) => <LigneMois key={p.id} p={p} on={on(p)} prix={prixLigne(p)} suffixe={p.type === 'mensuel' ? 'm' : ''} onToggle={onToggle && (() => onToggle(p.id))} />;
  return (
    <div className={'avoid-break overflow-hidden rounded-3xl bg-white shadow-sm ' + (option ? 'border-2 border-dashed' : 'border-2')} style={{ borderColor: coul }}>
      <div className="px-5 py-4 text-white" style={{ background: coul }}>
        <p className="text-[11px] font-bold uppercase tracking-[.14em] text-white/70">{option ? 'Option' : 'Pack ' + (OFFRE_IDS.indexOf(o.id) + 1)}</p>
        <p className="font-display text-xl font-bold leading-tight tracking-tight">{o.nom}</p>
        <p className="mt-0.5 text-[13px] leading-snug text-white/80">{o.tag}</p>
      </div>
      <div className={large ? 'sm:grid sm:grid-cols-2' : ''}>
        {creations.length > 0 && (
          <div className="p-3">
            <div className="flex items-end justify-between gap-3 px-1">
              <div>
                <p className="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-gray-900"><span className="h-2 w-2 rounded-full" style={{ background: coul }} />Création</p>
                <p className="text-[11px] text-gray-500">Payée une seule fois</p>
              </div>
              <p className="tabular text-right font-display text-lg font-bold leading-none">{eur(r.bP)} <span className="font-sans text-[11px] font-semibold text-gray-500">{uHT()}</span></p>
            </div>
            <ul className="mt-2 divide-y divide-gray-100 overflow-hidden rounded-2xl border border-gray-200">{creations.map(ligne)}</ul>
          </div>
        )}
        {services.length > 0 && (
          <div className="m-3 mt-1 rounded-2xl bg-sky-50 p-2 ring-1 ring-sky-100">
            <div className="flex items-end justify-between gap-3 px-2 pt-1">
              <div>
                <p className="flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-sky-900"><span className="text-sm leading-none">↻</span>Abonnement · au choix</p>
                <p className="text-[11px] text-sky-900/70">Facultatif, sans obligation</p>
              </div>
              <p className="tabular text-right font-display text-lg font-bold leading-none text-sky-900">{eur(r.bM)} <span className="font-sans text-[11px] font-semibold text-sky-900/70">{uHT(' / mois')}</span></p>
            </div>
            {[['⚙ Frais techniques', services.filter(estTechnique)], ['↻ Nos services', services.filter(p => !estTechnique(p))]].filter(([, l]) => l.length).map(([titre, l]) => (
              <div key={titre} className="mt-2">
                {services.some(estTechnique) && services.some(p => !estTechnique(p)) && <p className="px-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-sky-900/70">{titre}</p>}
                <ul className="divide-y divide-sky-100 overflow-hidden rounded-xl bg-white">{l.map(ligne)}</ul>
              </div>
            ))}
          </div>
        )}
      </div>
      {cocher && (
        <button type="button" onClick={onPrendre} aria-pressed={!!pris}
          className={'flex w-full items-center justify-center gap-2 border-t px-5 py-3 text-sm font-semibold transition ' + (pris ? 'text-white' : 'border-gray-100 hover:bg-gray-50')} style={pris ? { background: coul, borderColor: coul } : {}}>
          <span className={'grid h-5 w-5 place-items-center rounded-md border-2 ' + (pris ? 'border-white bg-white' : 'border-gray-400')} style={pris ? { color: coul } : {}}>{pris && '✓'}</span>
          {pris ? 'Pack choisi' : 'Je choisis ce pack'}
        </button>
      )}
    </div>
  );
}

// Une ligne d'abonnement dans une formule : case à cocher, priorité, prix par mois.
const BADGE = {
  essentiel: ['Indispensable', 'bg-rose-100 text-rose-800'],
  recommande: ['Recommandé', 'bg-emerald-100 text-emerald-800'],
  option: ['Au choix', 'bg-slate-100 text-slate-600'],
};
function LigneMois({ p, on, fort, prix, onToggle, lecture, suffixe = '' }) {
  const pr = prio(p), fixe = lecture || !onToggle || verrouille(p);
  const badge = pr === 'essentiel' && p.type === 'mensuel' ? ['Très recommandé', 'bg-emerald-600 text-white'] : BADGE[pr];
  return (
    <li className={on ? '' : 'no-print'}>
      <button type="button" onClick={fixe ? undefined : onToggle} aria-pressed={on} disabled={fixe} title={RAISONS[p.id] || ''}
        className={'flex w-full items-center gap-3 px-3 py-2.5 text-left transition ' + (fixe ? 'cursor-default ' : (fort ? 'hover:bg-white/10 ' : 'hover:bg-gray-50 ')) + (on ? '' : 'opacity-45')}>
        <span className={'grid h-5 w-5 shrink-0 place-items-center rounded-md border-2 transition ' + (on ? (fort ? 'border-white bg-white text-accent' : 'border-accent bg-accent text-white') : (fort ? 'border-white/50' : 'border-gray-300 bg-white'))}>
          {on && (verrouille(p)
            ? <svg className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 2a4 4 0 00-4 4v2H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-1V6a4 4 0 00-4-4zm2 6V6a2 2 0 10-4 0v2h4z" clipRule="evenodd"/></svg>
            : <svg className="h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.5 7.5a1 1 0 01-1.4 0l-3.5-3.5a1 1 0 111.4-1.4l2.8 2.8 6.8-6.8a1 1 0 011.4 0z" clipRule="evenodd"/></svg>)}
        </span>
        <span className="min-w-0 flex-1">
          <span className="block text-[13px] font-semibold leading-tight">{lecture ? (p.court || p.nom) : p.nom}{!lecture && qteLabel(p) && <span className="font-normal opacity-60"> · {qteLabel(p)}</span>}</span>
          <span className={'mt-1 inline-block rounded px-1.5 py-px text-[9.5px] font-bold uppercase tracking-wider ' + badge[1]}>{badge[0]}</span>
        </span>
        <span className={'tabular shrink-0 text-right text-[13px] font-semibold ' + (on ? '' : 'line-through')}>{eur(prix)}{suffixe && <span className="block text-[10px] font-medium opacity-60">par mois</span>}</span>
      </button>
    </li>
  );
}

function Proposal({ s, c, cTous, numero, onClose, toast, onExclu, onChoix, onDevis, onOption }) {
  const cl = s.client, v = s.vendeur;
  const validite = fmtDate(addDays(today(), num(s.validite)));
  const formule = c.mode === 'formule' && c.pack;
  const kombi = formule ? [] : combos(s, c);
  const avecCombos = kombi.length > 0;
  // listes complètes (pour pouvoir recocher) ; prix calculés sur ce qui reste coché
  const tous = formule ? c.offres : cTous.offres;
  const principaux = tous.filter(o => o.id !== 'fidel'), option = tous.find(o => o.id === 'fidel');
  // en formule : lignes et sous-totaux au prix du CRM (à la carte), pour que la remise affichée soit réelle
  const prixBloc = (o) => {
    const r = c.offres.find(x => x.id === o.id) || { bP: 0, bM: 0, htP: 0, htM: 0, ttcP: 0, ttcM: 0 };
    if (!formule) return r;
    const cat = (type) => r.items ? r.items.filter(p => (p.type === 'mensuel') === (type === 'mensuel')).reduce((a, p) => a + c.lineCat(p), 0) : 0;
    return { ...r, bP: Math.max(cat('ponctuel'), r.htP), bM: Math.max(cat('mensuel'), r.htM) };
  };
  const sommeL = (arr) => arr.reduce((a, p) => a + c.line(p), 0);
  const kP = sommeL(c.ponct) ? c.htP / sommeL(c.ponct) : 1, kM = sommeL(c.mens) ? c.htM / sommeL(c.mens) : 1;
  const prixLigne = (p) => (formule ? c.lineCat(p) : c.line(p)); // prix HT du CRM (prix × quantité), la remise est affichée à part
  const carte = { exclus: formule ? {} : (s.exclus || {}), onToggle: formule ? null : onExclu, prixLigne, c };
  const ch = s.choisi || {};
  const choixPack = (id) => onChoix({ formule: null, packs: (ch.packs || []).includes(id) ? ch.packs.filter(x => x !== id) : [...(ch.packs || []), id] });
  const choixFormule = (id) => onChoix({ formule: ch.formule === id ? null : id, packs: [] });
  const dv = avecCombos ? devisCalc(s, c) : null;
  const cols = (n) => (n >= 3 ? 'sm:grid-cols-3' : n === 2 ? 'sm:grid-cols-2' : '');
  const text = buildText(s, c, numero);
  const subject = `Votre proposition ${cl.entreprise ? '– ' + cl.entreprise : ''} (${numero})`;

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); toast('Récapitulatif copié dans le presse-papiers.'); }
    catch { toast('Copie impossible : sélectionnez le texte manuellement.'); }
  };
  const whatsapp = () => {
    window.open(`https://wa.me/${waNumber(cl.telephone)}?text=${encodeURIComponent(text)}`, '_blank');
    toast('WhatsApp est ouvert avec le message prérempli. Vérifiez-le puis appuyez sur Envoyer.');
  };
  const email = () => {
    window.location.href = `mailto:${encodeURIComponent(cl.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
    toast('Votre messagerie est ouverte avec le message prérempli. Joignez le PDF puis envoyez.');
  };

  const tuiles = [
    c.ttcP > 0 && ['À la commande', c.htP, (FRANCHISE ? 'Une seule fois' : `${eur(c.ttcP)}{xTTC()} · une seule fois`)],
    c.ttcM > 0 && ['Chaque mois', c.htM, (FRANCHISE ? dureeTxt(c)[0].toUpperCase() + dureeTxt(c).slice(1) : `${eur(c.ttcM)}{xTTC()} · ${dureeTxt(c)}`)],
    c.ttcM > 0 && [c.mois ? `Total sur ${c.mois} mois` : 'Total du 1er mois', c.totalHT, (FRANCHISE ? 'Net à payer, tout compris' : `${eur(c.totalTTC)}{xTTC()}, tout compris`)],
  ].filter(Boolean);

  return (
    <>
    <div id="proposal-overlay" className="fixed inset-0 z-50 overflow-y-auto bg-gray-900/40 backdrop-blur-sm sm:p-6">
      <div className="no-print sticky top-0 z-10 mx-auto flex max-w-[1040px] flex-wrap items-center gap-2 bg-white/95 px-4 py-3 shadow-sm backdrop-blur sm:rounded-t-2xl">
        <button onClick={onClose} className="rounded-xl px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">← Modifier</button>
        <div className="ml-auto flex flex-wrap gap-2">
          <button onClick={() => window.print()} className="rounded-xl bg-ink px-4 py-2 text-sm font-semibold text-white">PDF</button>
          <button onClick={copy} className="rounded-xl border border-gray-200 px-4 py-2 text-sm font-medium">Copier</button>
          <button onClick={whatsapp} className="rounded-xl bg-[#25D366] px-4 py-2 text-sm font-semibold text-white">WhatsApp</button>
          <button onClick={email} className="rounded-xl border border-gray-200 px-4 py-2 text-sm font-medium">Email</button>
        </div>
      </div>

      <article id="proposal" className="mx-auto max-w-[1040px] bg-white px-5 py-8 text-[14px] leading-relaxed shadow-xl sm:rounded-b-2xl sm:px-10 sm:py-9">
        {/* Client */}
        <header className="avoid-break flex items-start justify-between gap-6 border-b border-gray-200 pb-5">
          <div className="min-w-0">
            <p className="text-[11px] font-semibold uppercase tracking-[.18em] text-gray-500">Proposition commerciale · N° {numero}</p>
            <h1 className="mt-1.5 font-display text-[26px] font-semibold leading-tight sm:text-[32px]">{cl.entreprise || 'Votre commerce'}</h1>
            <p className="mt-1 text-gray-600">{[cl.responsable, cl.adresse, cl.telephone].filter(Boolean).join(' · ')}</p>
          </div>
          <div className="shrink-0 text-right">
            {s.visuels.logo && <img src={s.visuels.logo} alt="" className="mb-2 ml-auto h-14 w-20 rounded-lg object-cover" />}
            <p className="text-xs text-gray-500">{fmtDate(today())}<br />valable jusqu'au {validite}</p>
          </div>
        </header>

        {/* Formule et prix */}
        {avecCombos ? (
          <section className="avoid-break mt-6 rounded-3xl bg-accent px-5 py-5 text-white sm:px-7">
            <p className="text-xs font-bold uppercase tracking-wider text-white/70">Votre proposition</p>
            <h2 className="font-display text-[26px] font-semibold leading-tight">Choisissez un pack, ou une formule qui les regroupe</h2>
            <p className="mt-1 max-w-2xl text-white/85">Chaque pack peut être pris seul. Les formules en bas de page regroupent plusieurs packs à prix réduit.</p>
          </section>
        ) : (
        <section className="avoid-break mt-6 overflow-hidden rounded-3xl border-2 border-accent">
          <div className="bg-accent px-5 py-5 text-white sm:px-7">
            <p className="text-xs font-bold uppercase tracking-wider text-white/70">{formule ? (c.pack.sous || 'Formule') : 'À la carte'}</p>
            <h2 className="font-display text-[28px] font-semibold leading-tight">{formule ? c.pack.nom : 'Votre sélection sur mesure'}</h2>

/* ============================ Devis ============================ */
// Ce que le client a choisi (une formule, ou un ou plusieurs packs) → lignes, remises, TVA, acompte.
function devisCalc(s, c) {
  const ch = s.choisi || {};
  const k = ch.formule ? combos(s, c).find(x => x.id === ch.formule) : null;
  const ids = k ? k.blocs.map(o => o.id) : (ch.packs || []);
  const blocs = c.offres.filter(o => ids.includes(o.id));
  if (!blocs.length) return null;
  const t = num(s.tva) / 100;
  const somme = (arr) => arr.reduce((a, p) => a + c.line(p), 0);
  const kP = somme(c.ponct) ? c.htP / somme(c.ponct) : 1, kM = somme(c.mens) ? c.htM / somme(c.mens) : 1;
  const r = k ? Math.min(100, Math.max(0, num(k.remise))) / 100 : 0;
  const part = (type, kG) => {
    const groupes = blocs.map(o => ({ ...o, lignes: o.items.filter(p => (p.type === 'mensuel') === (type === 'mensuel')) })).filter(o => o.lignes.length);
    const brut = groupes.reduce((a, o) => a + somme(o.lignes), 0);
    const c2 = (x) => Math.round(x * 100) / 100; // montants au centime : ce que le client paie vraiment
    const remG = brut * (1 - kG), apres = brut - remG, remF = apres * r, ht = c2(apres - remF), ttc = c2(ht * (1 + t));
    return { groupes, brut, remG, remF, ht, tva: ttc - ht, ttc };
  };
  const P = part('ponctuel', kP), M = part('mensuel', kM);
  const acompte = s.acompte.actif ? Math.round(P.ttc * num(s.acompte.pct)) / 100 : 0;
  const titre = k ? k.nom : blocs.map(o => o.nom).join(' + ');
  return { k, blocs, r, P, M, acompte, titre, mois: c.mois, totalTTC: P.ttc + M.ttc * (c.mois || 1) };
}

            <Totaux part={d.P} />
            {d.acompte > 0 && (
              <div className="tabular ml-auto mt-2 w-full max-w-[320px] space-y-0.5 text-[13px] text-gray-700">
                <div className="flex justify-between gap-6"><span>Acompte à la signature ({s.acompte.pct} %)</span><span>{eur(d.acompte)}</span></div>
                <div className="flex justify-between gap-6"><span>Solde à la livraison</span><span>{eur(d.P.ttc - d.acompte)}</span></div>
              </div>
            )}
          </section>
        )}

        {d.M.groupes.length > 0 && (
          <section className="mt-8">
            <h2 className="font-display text-xl font-semibold">Services mensuels · choisis par le client</h2>
            <Tableau part={d.M} mensuel />
            <Totaux part={d.M} mensuel />
            <p className="ml-auto mt-2 max-w-[320px] text-right text-[12px] text-gray-500">{d.mois ? `Engagement de ${d.mois} mois, soit ${eur(d.M.ttc * d.mois)}${xTTC()} sur la durée.` : 'Sans engagement.'}</p>
          </section>
        )}

        {/* Récapitulatif : ce que le client paie réellement, remises comprises */}
        {(() => {
          const n = d.mois || 1;
          // prix net de chaque abonnement (remises comprises), le dernier centime d'arrondi va sur la dernière ligne
          const abos = d.M.groupes.flatMap(o => o.lignes.map(p => ({ p, o })));
          const kNet = d.M.brut ? d.M.ttc / d.M.brut : 1;
          let reste = Math.round(d.M.ttc * 100) / 100;
          const nets = abos.map(({ p, o }, i) => {
            const v = i === abos.length - 1 ? reste : Math.round(num(p.prix) * Math.max(1, num(p.qte) || 1) * kNet * 100) / 100;
            reste = Math.round((reste - v) * 100) / 100;
            return { p, o, v };
          });
          const tech = nets.filter(x => estTechnique(x.p)), serv = nets.filter(x => !estTechnique(x.p));
          const eco = d.P.remG + d.P.remF + (d.M.remG + d.M.remF) * n;
          const bloc = (titre, l, cls) => l.length > 0 && (
            <div className={'rounded-xl px-3 py-2 ' + cls}>
              <p className="text-[11px] font-bold uppercase tracking-wider">{titre}</p>
              <ul className="mt-1 space-y-0.5">{l.map(({ p, o, v }) => (
                <li key={p.id} className="flex justify-between gap-3 text-[13px]">
                  <span><span className="mr-1.5 inline-block h-2 w-2 rounded-full align-middle" style={{ background: COULEURS[o.id] }} />{p.court || p.nom}</span>
                  <span className="tabular shrink-0 font-medium">{eur(v)} / mois</span>
                </li>))}</ul>
            </div>
          );
          return (
            <section className="avoid-break mt-8 rounded-2xl border-2 border-ink p-5">
              <h2 className="font-display text-xl font-semibold">Récapitulatif · ce que vous payez réellement</h2>
              <p className="text-[12.5px] text-gray-500">{d.titre}, remises comprises{FRANCHISE ? '. ' + MENTION_TVA : ', TVA comprise'}.</p>
              <div className="mt-4 grid gap-3 sm:grid-cols-3">
                {d.P.ttc > 0 && (
                  <div className="rounded-xl bg-gray-50 px-4 py-3">
                    <p className="text-[11px] font-bold uppercase tracking-wider text-gray-500">Création · une seule fois</p>
                    <p className="tabular font-display text-2xl font-bold">{eur(d.P.ttc)}</p>
                    {d.acompte > 0 && <p className="tabular text-[12px] text-gray-600">{eur(d.acompte)} à la signature + {eur(d.P.ttc - d.acompte)} à la livraison</p>}
                  </div>
                )}
                {d.M.ttc > 0 && (
                  <div className="rounded-xl bg-sky-50 px-4 py-3 text-sky-950">
                    <p className="text-[11px] font-bold uppercase tracking-wider text-sky-900/70">Abonnements · chaque mois</p>
                    <p className="tabular font-display text-2xl font-bold">{eur(d.M.ttc)}</p>
                    <p className="text-[12px] text-sky-900/80">{abos.length} abonnement{abos.length > 1 ? 's' : ''} souscrit{abos.length > 1 ? 's' : ''}, {d.mois ? `pendant ${d.mois} mois` : 'sans engagement'}</p>
                  </div>
                )}
                <div className="rounded-xl bg-ink px-4 py-3 text-white">
                  <p className="text-[11px] font-bold uppercase tracking-wider text-white/70">{d.mois ? `Total sur ${d.mois} mois` : 'Total avec le 1er mois'}</p>
                  <p className="tabular font-display text-2xl font-bold">{eur(d.P.ttc + Math.round(d.M.ttc * 100) / 100 * n)}</p>
                  <p className="tabular text-[12px] text-white/75">{[d.P.ttc > 0 && eur(d.P.ttc) + ' de création', d.M.ttc > 0 && `${n} × ${eur(d.M.ttc)}`].filter(Boolean).join(' + ')}</p>
                </div>
              </div>
              {abos.length > 0 && (
                <div className="mt-4">
                  <p className="text-sm font-semibold">Vos abonnements souscrits, prix net par mois</p>
                  <div className="mt-2 grid gap-2 sm:grid-cols-2">
                    {bloc('⚙ Frais techniques', tech, 'bg-slate-100 text-slate-800')}
                    {bloc('↻ Services', serv, 'bg-sky-50 text-sky-900')}
                  </div>
                </div>
              )}
              {eco > 0.5 && <p className="mt-3 rounded-xl bg-emerald-50 px-3 py-2 text-[13px] font-semibold text-emerald-800">🎁 Vous économisez {eur(eco)}{d.mois && d.M.ttc > 0 ? ` sur ${d.mois} mois` : ''} grâce aux remises.</p>}
            </section>
          );
        })()}

        <section className="avoid-break mt-8 border-t border-gray-200 pt-5 text-[12.5px] text-gray-700">
          <p className="font-semibold text-ink">Conditions</p>
          <ul className="mt-1 space-y-0.5">
            {s.paiement.split('\n').filter(Boolean).map(l => <li key={l}>• {l}</li>)}
            <li>• Devis valable jusqu'au {validite}. Prix en euros{FRANCHISE ? `, nets. ${MENTION_TVA}` : ''}.</li>
          </ul>
        </section>

        <section className="avoid-break mt-6 grid gap-6 sm:grid-cols-2">
          <div>
            <p className="text-sm font-semibold">Bon pour accord · le client</p>
            <p className="text-xs text-gray-500">Date, signature et mention « Bon pour accord »</p>
            <div className="mt-2 h-24 rounded-xl border border-dashed border-gray-300" />
          </div>
          <div>
            <p className="text-sm font-semibold">{v.societe || v.nom || 'Le prestataire'}</p>
            <p className="text-xs text-gray-500">Date et signature</p>
            <div className="mt-2 h-24 rounded-xl border border-dashed border-gray-300" />
          </div>
        </section>
      </article>
      <div className="no-print h-10" />
    </div>
  );
}

          ));

        {!Object.keys(eff).length && <p className="text-sm text-gray-500">Aucune prestation : ajoutez-en ci-dessous.</p>}
      </div>

      {/* Ajouter une prestation : d'abord celles du même domaine, le reste du catalogue sur demande */}
      {(() => {
        const domaines = pk.blocs || [...new Set(s.prestations.filter(p => eff[p.id]).map(p => p.offre || 'base'))];
        const membresP = membresPack(s, pk);

                  <div className="flex gap-3 text-sm">
                    <button onClick={() => setTout(!tout)} className="font-medium text-accent hover:underline">{tout ? 'Ce domaine seulement' : 'Voir tout le catalogue'}</button>
                    <button onClick={() => { setAjout(false); setTout(false); }} className="text-gray-500 hover:text-ink">Fermer</button>
