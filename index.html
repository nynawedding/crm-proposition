const STORE = 'crm-proposition-v1';
const eur = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: n % 1 ? 2 : 0 }).format(n || 0);
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const today = () => new Date();
const fmtDate = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const load = () => {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!s) return DEFAULTS;
    // fusion prudente avec les valeurs par défaut (nouvelles prestations, nouveaux champs)
    const valide = (o) => OFFRE_IDS.includes(o);
    const blocsV4 = (s.offres || []).some(o => o.v === 4);
    const stocke = (id) => (s.prestations || []).find(x => x.id === id) || {};
    const prestations = CATALOGUE.map(p => {
      const st = stocke(p.id);
      // prestation redéfinie (v différente) : on reprend la nouvelle version, en gardant la sélection
      // nouvelle version : textes du catalogue repris ; prix gardés si la prestation est seulement renommée (garde)
      const base = p.v && st.v !== p.v ? { selected: !!st.selected, offre: st.offre,
        ...(p.garde && st.prix !== undefined ? { prix: st.prix, qte: st.qte, unite: st.unite } : {}) } : st;
      // l'ancienne « fiche Google » (gbp) est fusionnée dans « Mise en place du référencement Google »
      if (p.id === 'seo' && stocke('gbp').selected) base.selected = true;
      // blocs réorganisés (v4) : chaque prestation du catalogue reprend son bloc par défaut une fois
      const offre = blocsV4 ? remapOffre(base.offre) : p.offre;
      return { ...p, ...base, offre: valide(offre) ? offre : p.offre };
    });
    // seules les prestations créées à la main sont gardées en plus du catalogue
    const anciennes = { shooting: 'base', video: 'base' }; // prestations des versions précédentes, gardées avec vos prix
    const extras = (s.prestations || [])
      .filter(x => String(x.id).startsWith('perso-') || anciennes[x.id])
      .map(x => anciennes[x.id] ? { ...x, id: 'perso-' + x.id } : x)
      .filter((x, i, arr) => arr.findIndex(y => y.id === x.id) === i)
      .map(x => ({ ...x, offre: valide(remapOffre(x.offre)) ? remapOffre(x.offre) : 'base' }));
    // formules : réglages enregistrés gardés s'ils datent de la version actuelle du pack
    const packs = PACKS.map(d => {
      const st = (s.packs || []).find(x => x.id === d.id && x.v === d.v);
      return st ? { ...d, ...st, remises: { ...d.remises, ...st.remises } } : d;
    });
    // noms d'offres personnalisés gardés seulement s'ils datent de la version actuelle des offres
    const offres = OFFRES.map(o => ({ ...o, ...((s.offres || []).find(x => x.id === o.id && x.v === o.v) || {}) }));
    // une seule fois : si la fiche enregistrée est vide, on y met le client préenregistré
    const vide = !Object.values(s.client || {}).some(v => String(v).trim());
    const client = !s.prefillApplied && vide ? PREFILL.client : { ...blankClient, ...s.client };
    const demo = !s.prefillApplied && !(s.visuels || {}).demoUrl ? { demoUrl: PREFILL.demoUrl } : {};
    return { ...DEFAULTS, ...s, prefillApplied: true, client, vendeur: { ...DEFAULTS.vendeur, ...s.vendeur },
      visuels: { ...DEFAULTS.visuels, ...s.visuels, ...demo }, remises: { ...DEFAULTS.remises, ...s.remises }, acompte: { ...DEFAULTS.acompte, ...s.acompte },
      prestations: [...prestations, ...extras], offres, packs,
      mode: s.mode === 'formule' ? 'formule' : 'carte', pack: packs.some(x => x.id === s.pack) ? s.pack : '' };
  } catch { return DEFAULTS; }
};

// Réduit une image (photo de téléphone) avant de la garder en mémoire locale
const compress = (file, max = 1400, q = 0.82) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onerror = reject;
  r.onload = () => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      const png = file.type === 'image/png' || file.type === 'image/svg+xml';
      if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL(png ? 'image/png' : 'image/jpeg', q));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

const waNumber = (tel) => {
  let d = (tel || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (d.startsWith('0') && d.length === 10) return '33' + d.slice(1);
  return d;
};

const qteTexte = (p) => {
  const q = Math.max(1, num(p.qte) || 1), u = (p.unite || '').trim();
  if (q === 1 && UNITES_MUETTES.includes(u.toLowerCase())) return '';
  if (!u) return `${q}`;
  if (q === 1) return `1 ${u}`;
  return /^[a-zàâéèêîôûç-]+$/i.test(u) && !/s$/.test(u) ? `${q} ${u}s` : `${q} × ${u}`;
};

// pour les listes : « × 3 » quand il n'y a pas d'unité
const qteLabel = (p) => { const t = qteTexte(p); return /^\d+$/.test(t) ? '× ' + t : t; };

/* ============================ Calculs ============================ */
// Lignes d'une formule : le catalogue, avec les réglages propres au pack. catPrix = prix à la carte.
const packLines = (s, pack) => !pack ? [] : s.prestations
  .filter(p => pack.items[p.id])
  .map(p => {
    const o = pack.items[p.id];
    return { ...p, selected: true, catPrix: num(p.prix),
      prix: o.prix !== undefined && o.prix !== '' ? o.prix : p.prix,
      qte: o.qte !== undefined && o.qte !== '' ? o.qte : p.qte,
      type: o.type || p.type };
  });

function compute(s) {
  const pack = (s.packs || []).find(x => x.id === s.pack);
  if (s.mode === 'formule') return { ...calc(s, packLines(s, pack), pack ? pack.remises : DEFAULTS.remises), mode: 'formule', pack };
  return { ...calc(s, s.prestations.filter(p => p.selected), s.remises), mode: 'carte', pack: null };
}

// Moteur unique, pour la carte comme pour les formules.
function calc(s, sel, remises) {
  const line = (p) => num(p.prix) * Math.max(1, num(p.qte) || 1);
  const lineCat = (p) => num(p.catPrix ?? p.prix) * Math.max(1, num(p.qte) || 1);
  const ponct = sel.filter(p => p.type === 'ponctuel');
  const mens = sel.filter(p => p.type === 'mensuel');
  const lignesP = ponct.reduce((a, p) => a + line(p), 0);
  const lignesM = mens.reduce((a, p) => a + line(p), 0);
  const rem = (brut, r) => Math.min(brut, Math.max(0, r.mode === '%' ? brut * num(r.valeur) / 100 : num(r.valeur)));
  const htP = lignesP - rem(lignesP, remises.ponctuel), htM = lignesM - rem(lignesM, remises.mensuel);
  // prix à la carte et remise réelle (prix à la carte − prix final, jamais négative)
  const catP = ponct.reduce((a, p) => a + lineCat(p), 0), catM = mens.reduce((a, p) => a + lineCat(p), 0);
  const brutP = Math.max(catP, htP), brutM = Math.max(catM, htM);
  const remP = brutP - htP, remM = brutM - htM;
  const t = num(s.tva) / 100;
  const ttcP = htP * (1 + t), ttcM = htM * (1 + t);
  const mois = s.engagement || 0;
  const moisCalc = mois || 1; // sans engagement : 1er mois
  const totalHT = htP + htM * moisCalc;
  const totalTTC = ttcP + ttcM * moisCalc;
  const acompte = s.acompte.actif ? ttcP * num(s.acompte.pct) / 100 : 0;
  // répartition par offre (remise répartie au prorata)
  const kP = lignesP ? htP / lignesP : 1, kM = lignesM ? htM / lignesM : 1;
  const offres = (s.offres || OFFRES).map(o => {
    const items = sel.filter(p => (p.offre || 'base') === o.id);
    const bP = items.filter(p => p.type === 'ponctuel').reduce((a, p) => a + line(p), 0);
    const bM = items.filter(p => p.type === 'mensuel').reduce((a, p) => a + line(p), 0);
    const oHtP = bP * kP, oHtM = bM * kM;
    const oTtcP = oHtP * (1 + t), oTtcM = oHtM * (1 + t);
    const oAcompte = s.acompte.actif ? oTtcP * num(s.acompte.pct) / 100 : 0;
    return { ...o, items, bP, bM, htP: oHtP, htM: oHtM, ttcP: oTtcP, ttcM: oTtcM, acompte: oAcompte,
      totalTTC: oTtcP + oTtcM * moisCalc, totalHT: oHtP + oHtM * moisCalc };
  }).filter(o => o.items.length);
  const economie = (remP + remM * moisCalc) * (1 + t); // TTC, sur la durée d'engagement
  return { sel, ponct, mens, line, lineCat, brutP, brutM, remP, remM, htP, htM, ttcP, ttcM, tvaP: ttcP - htP, tvaM: ttcM - htM,
    mois, moisCalc, totalHT, totalTTC, acompte, offres, economie };
}

// Compare la sélection à la carte avec une formule (en gardant ou non les prestations hors pack).
function comparer(s, pack, garder) {
  const carteSel = s.prestations.filter(p => p.selected);
  const carte = calc(s, carteSel, s.remises);
  const lignes = packLines(s, pack);
  const enPlus = lignes.filter(p => !carteSel.some(x => x.id === p.id));
  const horsPack = carteSel.filter(p => !pack.items[p.id]);
  const pk = calc(s, [...lignes, ...(garder ? horsPack.map(p => ({ ...p, catPrix: num(p.prix) })) : [])], pack.remises);
  return { carte, pk, enPlus, horsPack };
}

/* ============================ Proposition ============================ */
// Une page A4 : la formule (ou la sélection), le prix à la commande, le prix par mois, la remise réelle, les conditions.
const prixCourt = (c) => [c.ttcP > 0 && `${eur(c.ttcP)} TTC à la commande`, c.ttcM > 0 && `${eur(c.ttcM)} TTC / mois${c.mois ? ` pendant ${c.mois} mois` : ''}`].filter(Boolean).join(' + ');
const signe = (n) => (n > 0.005 ? '+ ' : n < -0.005 ? '− ' : '') + eur(Math.abs(n));
const dureeTxt = (c) => (c.mois ? `pendant ${c.mois} mois` : 'sans engagement');

function buildText(s, c, numero) {
  const L = [], cl = s.client;
  const formule = c.mode === 'formule' && c.pack;
  L.push(`Bonjour${cl.responsable ? ' ' + cl.responsable.split(' ')[0] : ''},`, '');
  L.push(`Voici notre proposition pour ${cl.entreprise || 'votre commerce'} (devis ${numero}).`, '');
  L.push(`${formule ? c.pack.nom.toUpperCase() : 'VOTRE SÉLECTION SUR MESURE'} : ${prixCourt(c)}`);
  if (formule && c.pack.promesse) L.push(c.pack.promesse);
  c.offres.forEach(o => {
    L.push('', o.nom);
    o.items.forEach(p => L.push(`   ✓ ${p.nom}${qteLabel(p) ? ' (' + qteLabel(p) + ')' : ''}${p.type === 'mensuel' ? ' · chaque mois' : ''}`));
  });
  L.push('');
  if (c.economie > 0.5) L.push(`Remise incluse : ${eur(c.economie)} TTC d'économie${c.mois ? ` sur ${c.mois} mois` : ''}${formule ? ' par rapport aux mêmes prestations à la carte' : ''}.`);
  L.push(`Total ${c.mois ? 'sur ' + c.mois + ' mois' : 'du 1er mois'} : ${eur(c.totalTTC)} TTC.`);
  L.push(`Offre valable jusqu'au ${fmtDate(addDays(today(), num(s.validite)))}.`);
  if (s.visuels.demoUrl) L.push('Démonstration : ' + s.visuels.demoUrl);
  const v = s.vendeur;
  if (v.nom || v.telephone) { L.push(''); L.push([v.nom, v.societe, v.telephone, v.email].filter(Boolean).join(' · ')); }
  return L.join('\n');
}

function Check({ className = '' }) {
  return <svg className={'mt-0.5 h-5 w-5 shrink-0 text-emerald-600 ' + className} viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0l4-4z" clipRule="evenodd"/></svg>;
}

// Tableau « prix à la carte → remise → prix final », partagé par l'éditeur de pack et la proposition.
function TableRemise({ r, tva, dense }) {
  const cols = [r.brutP > 0 && ['Une fois', r.brutP, r.remP, r.htP, r.ttcP], r.brutM > 0 && ['Par mois', r.brutM, r.remM, r.htM, r.ttcM]].filter(Boolean);
  if (!cols.length) return null;
  const td = dense ? 'px-3 py-1.5' : 'px-3 py-2';
  return (
    <table className="tabular w-full text-[13px]">
      <thead><tr className="text-left text-[11px] uppercase tracking-wide text-gray-500"><th className={td + ' font-semibold'} />{cols.map(c => <th key={c[0]} className={td + ' text-right font-semibold'}>{c[0]}</th>)}</tr></thead>
      <tbody className="divide-y divide-gray-100">
        <tr><td className={td + ' text-gray-600'}>Prix à la carte HT</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[1])}</td>)}</tr>
        {cols.some(c => c[2] > 0.005) && <tr className="text-emerald-700"><td className={td}>Remise commerciale</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{c[2] > 0.005 ? '− ' + eur(c[2]) : '—'}</td>)}</tr>}
        <tr className="font-semibold"><td className={td}>Prix final HT</td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[3])}</td>)}</tr>
        <tr className="font-semibold"><td className={td}>Prix final TTC <span className="font-normal text-gray-500">(TVA {tva} %)</span></td>{cols.map(c => <td key={c[0]} className={td + ' text-right'}>{eur(c[4])}</td>)}</tr>
      </tbody>
    </table>
  );
}

function Proposal({ s, c, numero, onClose, toast }) {
  const cl = s.client, v = s.vendeur;
  const validite = fmtDate(addDays(today(), num(s.validite)));
  const formule = c.mode === 'formule' && c.pack;
  const text = buildText(s, c, numero);
  const subject = `Votre proposition ${cl.entreprise ? '– ' + cl.entreprise : ''} (${numero})`;

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); toast('Récapitulatif copié dans le presse-papiers.'); }
    catch { toast('Copie impossible : sélectionnez le texte manuellement.'); }

  const whatsapp = () => {
    window.open(`https://wa.me/${waNumber(cl.telephone)}?text=${encodeURIComponent(text)}`, '_blank');

// Mode à la carte : comparer la sélection avec une formule, sans rien ajouter sans validation.
function Comparaison({ s, onProposer }) {
  const sel = s.prestations.filter(p => p.selected);
  const [packId, setPackId] = useState('');
  const [garder, setGarder] = useState(true);
  if (!sel.length) return null;
  const overlap = (pk) => sel.filter(p => pk.items[p.id]).length;
  const auto = s.packs.find(pk => sel.every(p => pk.items[p.id])) || [...s.packs].sort((a, b) => overlap(b) - overlap(a))[0];
  const pack = s.packs.find(x => x.id === packId) || auto;
  const { carte, pk, enPlus, horsPack } = comparer(s, pack, garder);
  const dP = pk.ttcP - carte.ttcP, dM = pk.ttcM - carte.ttcM, dT = pk.totalTTC - carte.totalTTC;
  const duree = carte.mois ? `sur ${carte.mois} mois` : 'le 1er mois';
  const bloc = (titre, r, accent) => (
    <div className={'rounded-2xl p-4 ' + (accent ? 'bg-accent text-white' : 'bg-white ring-1 ring-gray-200')}>
      <p className={'text-xs font-bold uppercase tracking-wide ' + (accent ? 'text-white/70' : 'text-gray-500')}>{titre}</p>
      <p className="tabular mt-1 font-display text-2xl font-semibold leading-tight">{eur(r.ttcP)}<span className={'ml-1 font-sans text-xs ' + (accent ? 'text-white/70' : 'text-gray-500')}>TTC à la commande</span></p>
      {r.ttcM > 0 && <p className="tabular font-semibold">+ {eur(r.ttcM)} <span className={'text-xs font-normal ' + (accent ? 'text-white/70' : 'text-gray-500')}>TTC / mois</span></p>}
      <p className={'tabular mt-1 text-xs ' + (accent ? 'text-white/70' : 'text-gray-500')}>Total {duree} : {eur(r.totalTTC)} TTC</p>
    </div>
  );
  return (
    <div className="mt-8 rounded-3xl bg-gray-50 p-4 sm:p-6">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="font-display text-lg font-semibold">Comparer avec une formule</p>
          <p className="text-sm text-gray-500">La sélection à la carte face à un pack : ce qui est en plus, et la différence de prix.</p>
        </div>
        <Segmented value={pack.id} options={s.packs.map(x => ({ v: x.id, label: x.nom.replace(/^Pack\s+/i, '') }))} onChange={setPackId} />
      </div>
      <div className="mt-4 grid gap-3 sm:grid-cols-2">
        {bloc('Sélection à la carte', carte)}
        {bloc(pack.nom, pk, true)}
      </div>
      <div className="tabular mt-3 rounded-2xl bg-white px-4 py-3 text-sm ring-1 ring-gray-200">
        <span className="font-semibold">Différence avec le {pack.nom} : </span>
        {signe(dP)} à la commande · {signe(dM)} par mois · <strong>{signe(dT)} {duree}</strong>
        {pk.economie > 0.5 && <span className="block text-emerald-700">Le pack inclut {eur(pk.economie)} TTC de remise par rapport aux mêmes prestations à la carte.</span>}
      </div>
      <div className="mt-4 grid gap-4 sm:grid-cols-2">
        <div>
          <p className="text-sm font-semibold">En plus dans le pack {enPlus.length ? `(${enPlus.length})` : ''}</p>
          {enPlus.length ? (
            <ul className="mt-1.5 space-y-1 text-sm">{enPlus.map(p => (
              <li key={p.id} className="flex justify-between gap-3"><span>+ {p.nom}</span><span className="tabular shrink-0 text-gray-500">{eur(pk.lineCat(p))} HT{p.type === 'mensuel' ? '/mois' : ''}</span></li>
            ))}</ul>
          ) : <p className="mt-1 text-sm text-gray-500">Rien : le pack contient exactement la sélection.</p>}
        </div>
        {horsPack.length > 0 && (
          <div>
            <p className="text-sm font-semibold">Choisies à la carte mais pas dans le pack</p>
            <ul className="mt-1.5 space-y-1 text-sm text-gray-700">{horsPack.map(p => <li key={p.id}>• {p.nom}</li>)}</ul>
            <label className="mt-2 flex items-center gap-2 text-sm">
              <input type="checkbox" checked={garder} onChange={e => setGarder(e.target.checked)} className="h-4 w-4 accent-[#1f3a5f]" />
              Les garder dans la formule (au prix à la carte)
            </label>
          </div>
        )}
      </div>
      <button onClick={() => onProposer(pack, garder ? horsPack : [], enPlus)}
        className="mt-5 w-full rounded-xl bg-accent py-3 text-[15px] font-semibold text-white shadow-sm hover:brightness-110 sm:w-auto sm:px-6">
        Proposer le {pack.nom} à la place
      </button>
    </div>
  );
}

/* ============================ Application ============================ */
function App() {
  const [s, setS] = useState(load);
  const [open, setOpen] = useState({ client: true });
  const [showProposal, setShowProposal] = useState(false);
  const [preview, setPreview] = useState(null);
  const [msg, setMsg] = useState('');
  const timer = useRef();

  useEffect(() => {
    try { localStorage.setItem(STORE, JSON.stringify(s)); }
    catch { toast('Mémoire locale pleine : retirez quelques photos.'); }
  }, [s]);

  const toast = (m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(''), 4500); };
  const set = (patch) => setS(prev => ({ ...prev, ...(typeof patch === 'function' ? patch(prev) : patch) }));
  const setClient = (k, v) => set(p => ({ client: { ...p.client, [k]: v } }));
  const setVendeur = (k, v) => set(p => ({ vendeur: { ...p.vendeur, [k]: v } }));
  const setPrest = (id, patch) => set(p => ({ prestations: p.prestations.map(x => x.id === id ? { ...x, ...patch } : x) }));
  const toggle = (k) => setOpen(o => ({ ...o, [k]: !o[k] }));
  const [perso, setPerso] = useState(''); // formule en cours de personnalisation
  const setPack = (id, patch) => set(p => ({ packs: p.packs.map(x => x.id === id ? { ...x, ...(typeof patch === 'function' ? patch(x) : patch) } : x) }));
  const setPackItem = (id, prestId, val) => setPack(id, x => {
    const items = { ...x.items };
    if (val === null) delete items[prestId]; else items[prestId] = val;
    return { items };
  });
  const allerOffre = () => { setOpen(o => ({ ...o, offre: true })); setTimeout(() => document.getElementById('offre')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30); };
  const changerMode = (m) => { set({ mode: m }); allerOffre(); };
  const choisir = (id) => { set({ mode: 'formule', pack: id }); toast((s.packs.find(x => x.id === id) || {}).nom + ' choisi. Le récapitulatif en haut est à jour.'); };
  const proposer = (pack, garder, enPlus) => {
    const ajout = [...enPlus.map(p => p.nom), ...garder.map(p => p.nom + ' (gardée)')];
    if (ajout.length && !confirm(`Passer au ${pack.nom} ?\n\nPrestations ajoutées par rapport à la sélection :\n• ${ajout.join('\n• ')}\n\nValidez seulement si le client est d'accord.`)) return;
    set(p => ({ mode: 'formule', pack: pack.id,
      packs: p.packs.map(x => x.id === pack.id ? { ...x, items: { ...x.items, ...Object.fromEntries(garder.map(g => [g.id, {}])) } } : x) }));
    toast(`${pack.nom} proposé. Votre sélection à la carte reste enregistrée dans l'onglet À la carte.`);
    allerOffre();
  };

  const c = useMemo(() => compute(s), [s]);
  const packsCalc = useMemo(() => Object.fromEntries(s.packs.map(pk => [pk.id, calc(s, packLines(s, pk), pk.remises)])), [s]);
  const sugg = useMemo(() => suggestions(s.reponses), [s.reponses]);
  const numero = useMemo(() => {
    const d = today();
    return `DEV-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${(s.client.entreprise || 'X').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'X'}`;
  }, [s.client.entreprise]);

  const answer = (q, o) => set(p => {
    const cur = p.reponses[q.id] || [];
    const next = q.multi ? (cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o]) : (cur.includes(o) ? [] : [o]);
    return { reponses: { ...p.reponses, [q.id]: next } };
  });

  const addPhotos = async (files) => {
    const out = [];
    for (const f of files) { try { out.push(await compress(f, 1400, 0.8)); } catch {} }
    set(p => ({ visuels: { ...p.visuels, photos: [...p.visuels.photos, ...out].slice(0, 12) } }));
  };
  const addLogo = async (f) => { if (!f) return; try { const d = await compress(f, 600, 0.9); set(p => ({ visuels: { ...p.visuels, logo: d } })); } catch { toast('Image illisible.'); } };

  const nouveauClient = () => {
    if (!confirm('Commencer un nouveau client ? La fiche, les réponses, la sélection et les visuels seront effacés. Vos tarifs et vos coordonnées sont conservés.')) return;
    set(p => ({ ...DEFAULTS, client: blankClient, visuels: { logo: '', photos: [], demoUrl: '' }, prestations: p.prestations.map(x => ({ ...x, selected: false })), vendeur: p.vendeur,
      inclus: p.inclus, paiement: p.paiement, validite: p.validite, tva: p.tva, offres: p.offres, packs: p.packs, mode: 'carte', pack: '' }));
    setPerso('');
    setOpen({ client: true });
  };

  const addCustom = (type, offre = 'base') => set(p => ({ prestations: [...p.prestations, { id: 'perso-' + Date.now(), type, nom: 'Nouvelle prestation', description: 'Description de la prestation', prix: 0, qte: 1, unite: '', selected: true, offre }] }));

  const answered = QUESTIONS.filter(q => (s.reponses[q.id] || []).length || (s.notes[q.id] || '').trim());
  const clientHint = [s.client.entreprise, s.client.responsable].filter(Boolean).join(' · ') || 'Coordonnées du commerçant';

  const generate = () => {
    if (c.mode === 'formule' && !c.pack) { toast('Choisissez une formule avant de générer la proposition.'); allerOffre(); return; }
    if (!c.sel.length) { toast(c.mode === 'formule' ? 'Cette formule ne contient aucune prestation.' : 'Cochez au moins une prestation avant de générer la proposition.'); allerOffre(); return; }
    setShowProposal(true);
    window.scrollTo(0, 0);
  };

  // appelée comme une fonction (et non <RemiseInput/>) pour que le champ garde le focus pendant la saisie
  // packId : remise d'une formule ; sinon remise de la vente à la carte
  const remiseInput = (k, label, packId) => {
    const pk = packId && s.packs.find(x => x.id === packId);
    const r = pk ? pk.remises[k] : s.remises[k];
    const maj = (patch) => pk
      ? setPack(packId, x => ({ remises: { ...x.remises, [k]: { ...x.remises[k], ...patch } } }))
      : set(p => ({ remises: { ...p.remises, [k]: { ...p.remises[k], ...patch } } }));
    return (
      <div>
        <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">{label}</p>
        <div className="flex items-center gap-2">
          <input type="number" inputMode="decimal" min="0" value={r.valeur} onChange={e => maj({ valeur: e.target.value })} className={inputCls + ' tabular w-28'} />
          <Segmented value={r.mode} options={[{ v: '%', label: '%' }, { v: '€', label: '€' }]} onChange={v => maj({ mode: v })} />
        </div>
      </div>
    );
  };

  return (
    <>
      <div id="app-main">
        {/* Récapitulatif permanent */}
        <div className="sticky top-0 z-40 border-b border-gray-200 bg-white/90 backdrop-blur" style={{ paddingTop: 'env(safe-area-inset-top)' }}>

              <div className="grid flex-1 grid-cols-2 rounded-xl bg-gray-100 p-1 sm:flex-none">

                  <button key={m} role="tab" aria-selected={s.mode === m} onClick={() => changerMode(m)}

              <p className="truncate text-xs text-gray-500 sm:hidden">{c.mode === 'formule' ? (c.pack ? c.pack.nom : 'Aucune formule') : `${c.sel.length} presta.`}</p>

            <div className="grid min-w-0 flex-1 grid-cols-3 gap-2 sm:gap-6">

                ['Par mois', eur(c.htM), eur(c.ttcM) + ' TTC'],
                [c.mois ? `Total ${c.mois} mois` : 'Total 1er mois', eur(c.totalHT), eur(c.totalTTC) + ' TTC']].map(([l, v, sub]) => (
                <div key={l} className="min-w-0">
                  <p className="truncate text-[10.5px] font-medium uppercase tracking-wide text-gray-500 sm:text-[11px]">{l}</p>
                  <p className="tabular truncate text-[15px] font-semibold sm:text-lg">{v}<span className="ml-1 text-[10px] font-normal text-gray-400">HT</span></p>
                  <p className="tabular hidden truncate text-[11px] text-gray-500 sm:block">{sub}</p>
                </div>
              ))}
            </div>
            <button onClick={generate} className="hidden rounded-xl bg-accent px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:brightness-110 sm:block">Générer la proposition commerciale</button>
          </div>
        </div>

        <main className="mx-auto max-w-5xl space-y-4 px-4 pb-32 pt-6 sm:px-6">
          <div className="flex flex-wrap items-end justify-between gap-3 pb-2">
            <div>
              <h1 className="font-display text-2xl font-semibold sm:text-3xl">Proposition commerciale</h1>
              <p className="text-sm text-gray-500">Enregistrement automatique sur cet appareil.</p>
            </div>
            <button onClick={nouveauClient} className="rounded-xl border border-gray-200 bg-white px-3.5 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50">Nouveau client</button>
          </div>

          {/* 1. Fiche client */}
          <Section n="1" title="Fiche client" hint={clientHint} open={!!open.client} onToggle={() => toggle('client')}>

              <Field label="Responsable"><input className={inputCls} value={s.client.responsable} onChange={e => setClient('responsable', e.target.value)} placeholder="Prénom Nom" autoComplete="off" /></Field>
              <Field label="Téléphone"><input className={inputCls} type="tel" inputMode="tel" value={s.client.telephone} onChange={e => setClient('telephone', e.target.value)} placeholder="06 12 34 56 78" autoComplete="off" /></Field>
              <Field label="Email"><input className={inputCls} type="email" inputMode="email" value={s.client.email} onChange={e => setClient('email', e.target.value)} placeholder="contact@commerce.fr" autoComplete="off" /></Field>
              <Field label="Adresse" className="sm:col-span-2"><input className={inputCls} value={s.client.adresse} onChange={e => setClient('adresse', e.target.value)} placeholder="Rue, code postal, ville" autoComplete="off" /></Field>
              <Field label="Secteur d'activité" className="sm:col-span-2">
                <input className={inputCls} list="secteurs" value={s.client.secteur} onChange={e => setClient('secteur', e.target.value)} placeholder="Boulangerie, restaurant, coiffure…" />
                <datalist id="secteurs">{['Boulangerie-pâtisserie', 'Restaurant', 'Café / bar', 'Salon de coiffure', 'Institut de beauté', 'Boutique de vêtements', 'Fleuriste', 'Épicerie fine', 'Boucherie', 'Artisan'].map(x => <option key={x} value={x} />)}</datalist>
              </Field>
            </div>
          </Section>

          {/* 2. Découverte */}
          <Section n="2" title="Découverte commerciale" hint={answered.length ? `${answered.length} / ${QUESTIONS.length} questions renseignées` : 'Questions à poser pendant le rendez-vous'}

              {answered.length > 0 && (

                {perso && (() => {
                  const pk = s.packs.find(x => x.id === perso);

                    onPack={patch => setPack(pk.id, patch)} onItem={(id, val) => setPackItem(pk.id, id, val)}
                    onSave={() => { setPerso(''); toast(`${pk.nom} enregistré sur cet appareil.`); }}
                    onChoisir={() => choisir(pk.id)}
                    onReset={() => { if (confirm(`Remettre le ${pk.nom} dans sa composition d'origine (prestations, prix, remises, textes) ?`)) setPack(pk.id, { ...PACKS.find(x => x.id === pk.id) }); }} />;
                })()}
                <p className="mt-5 text-sm text-gray-500">Les formules utilisent les prix du catalogue (onglet À la carte). Une prestation n'apparaît qu'une fois par formule.</p>
              </div>

            {s.mode === 'carte' && <>
            {(s.offres || OFFRES).map((o, i) => {
              const items = s.prestations.filter(p => (OFFRE_IDS.includes(p.offre) ? p.offre : 'base') === o.id);
              const r = c.offres.find(x => x.id === o.id);
              return (
                <div key={o.id} className="mb-8 last:mb-0">
                  <div className="mb-3 flex flex-wrap items-baseline justify-between gap-2 border-b border-gray-100 pb-2">

                    <span className="tabular text-sm text-gray-500">{r ? [r.htP > 0 && eur(r.htP) + ' HT', r.htM > 0 && eur(r.htM) + ' HT / mois'].filter(Boolean).join(' + ') : 'rien de coché'}</span>
                  </div>
                  <div className="grid gap-3 lg:grid-cols-2">
                    {items.map(p => (
                      <PrestationCard key={p.id} p={p} offres={s.offres || OFFRES} suggested={sugg.has(p.id)} onChange={patch => setPrest(p.id, patch)}
                        onRemove={p.id.startsWith('perso-') ? () => set(prev => ({ prestations: prev.prestations.filter(x => x.id !== p.id) })) : null} />
                    ))}
                  </div>
                  <div className="mt-3 flex flex-wrap gap-4 text-sm font-medium text-accent">
                    <button onClick={() => addCustom('ponctuel', o.id)} className="hover:underline">+ Prestation (une fois)</button>
                    <button onClick={() => addCustom('mensuel', o.id)} className="hover:underline">+ Abonnement (par mois)</button>
                  </div>
                </div>
              );
            })}
            <div className="mt-6 rounded-2xl bg-gray-50 p-4 sm:p-5">
              <p className="font-display text-lg font-semibold">Les catégories</p>
              <p className="mb-4 text-sm text-gray-500">Leurs noms regroupent les prestations dans la proposition, à la carte comme en formule.</p>
              <div className="space-y-3">
                {(s.offres || OFFRES).map((o, i) => {
                  const r = c.offres.find(x => x.id === o.id);
                  return (
                    <div key={o.id} className="grid gap-2 border-b border-gray-200 pb-3 last:border-0 sm:grid-cols-[1fr_1.4fr_auto] sm:items-center">
                      <input className={inputCls + ' font-semibold'} value={o.nom} aria-label={'Nom de l\'offre ' + (i + 1)}
                        onChange={e => set(p => ({ offres: (p.offres || OFFRES).map(x => x.id === o.id ? { ...x, nom: e.target.value } : x) }))} />
                      <input className={inputCls + ' text-sm'} value={o.tag} aria-label="Phrase d'accroche"
                        onChange={e => set(p => ({ offres: (p.offres || OFFRES).map(x => x.id === o.id ? { ...x, tag: e.target.value } : x) }))} />
                      <span className="tabular text-sm text-gray-600 sm:text-right">{r ? `${r.items.length} presta. · ${eur(r.ttcP)} + ${eur(r.ttcM)}/mois TTC` : 'vide'}</span>
                      <textarea rows={2} className={inputCls + ' text-sm sm:col-span-3'} value={o.explication || ''} aria-label="Explication simple"
                        placeholder="En une phrase simple : c'est quoi ?"
                        onChange={e => set(p => ({ offres: (p.offres || OFFRES).map(x => x.id === o.id ? { ...x, explication: e.target.value } : x) }))} />
                    </div>
                  );
                })}
              </div>
            </div>
            <Comparaison s={s} onProposer={proposer} />
            </>}
          </Section>
          </div>

          {/* 4. Tarifs et remises */}
          <Section n="4" title="Tarifs et remises" hint={`TVA ${s.tva} % · ${c.mois ? 'engagement ' + c.mois + ' mois' : 'sans engagement'}${c.remP + c.remM > 0.005 ? ' · remise appliquée' : ''}`}
            open={!!open.tarifs} onToggle={() => toggle('tarifs')}>
            <div className="grid gap-6 lg:grid-cols-[1fr_340px]">
              <div className="space-y-6">
                <div className="grid gap-5 sm:grid-cols-2">
                  {remiseInput('ponctuel', c.mode === 'formule' && c.pack ? `Remise ${c.pack.nom} · à la commande` : 'Remise sur la création', c.mode === 'formule' && c.pack ? c.pack.id : undefined)}
                  {remiseInput('mensuel', c.mode === 'formule' && c.pack ? `Remise ${c.pack.nom} · par mois` : 'Remise sur les mensualités', c.mode === 'formule' && c.pack ? c.pack.id : undefined)}
                </div>
                <div>
                  <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">Durée d'engagement</p>
                  <div className="flex flex-wrap gap-2">{ENGAGEMENTS.map(e => <Chip key={e.v} active={s.engagement === e.v} onClick={() => set({ engagement: e.v })}>{e.label}</Chip>)}</div>
                </div>
                <div className="grid gap-5 sm:grid-cols-3">
                  <Field label="TVA (%)"><input type="number" inputMode="decimal" min="0" className={inputCls + ' tabular'} value={s.tva} onChange={e => set({ tva: e.target.value })} /></Field>
                  <Field label="Validité du devis (jours)"><input type="number" inputMode="numeric" min="1" className={inputCls + ' tabular'} value={s.validite} onChange={e => set({ validite: e.target.value })} /></Field>
                  <div>
                    <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">Acompte</p>
                    <div className="flex items-center gap-2">
                      <input type="checkbox" checked={s.acompte.actif} onChange={e => set(p => ({ acompte: { ...p.acompte, actif: e.target.checked } }))} className="h-5 w-5 accent-[#1f3a5f]" aria-label="Activer l'acompte" />
                      <input type="number" inputMode="decimal" min="0" max="100" disabled={!s.acompte.actif} className={inputCls + ' tabular w-24 disabled:bg-gray-50 disabled:text-gray-400'} value={s.acompte.pct}
                        onChange={e => set(p => ({ acompte: { ...p.acompte, pct: e.target.value } }))} />
                      <span className="text-sm text-gray-500">%</span>
                    </div>
                  </div>
                </div>
              </div>
              <div className="rounded-2xl bg-gray-50 p-5 text-sm">
                {[['Création HT', eur(c.brutP)], c.remP > 0.005 ? ['Remise création', '−' + eur(c.remP)] : null, ['Création TTC', eur(c.ttcP)],
                  ['Mensualité HT', eur(c.brutM)], c.remM > 0.005 ? ['Remise mensuelle', '−' + eur(c.remM)] : null, ['Mensualité TTC', eur(c.ttcM)]]
                  .filter(Boolean).map(([l, v]) => <div key={l} className="flex justify-between py-1"><span className="text-gray-600">{l}</span><span className="tabular font-medium">{v}</span></div>)}
                <div className="mt-2 border-t border-gray-200 pt-2">
                  <div className="flex justify-between py-1 font-semibold"><span>{c.mois ? `Total ${c.mois} mois TTC` : 'Total 1er mois TTC'}</span><span className="tabular">{eur(c.totalTTC)}</span></div>
                  {c.acompte > 0 && <div className="flex justify-between py-1 text-gray-600"><span>Acompte ({s.acompte.pct} %)</span><span className="tabular">{eur(c.acompte)}</span></div>}
                </div>
              </div>
            </div>
          </Section>

          <Section n="5" title="Visuels et démonstration" hint={[s.visuels.logo && 'logo', s.visuels.photos.length && `${s.visuels.photos.length} photo(s)`, s.visuels.demoUrl && 'site de démo'].filter(Boolean).join(' · ') || 'Logo, photos du commerce, site de démonstration'}
            open={!!open.visuels} onToggle={() => toggle('visuels')}>
            <div className="grid gap-6 sm:grid-cols-[200px_1fr]">
              <div>

                <div className="grid gap-4 sm:grid-cols-2">
                  {[['nom', 'Votre nom'], ['societe', 'Votre société'], ['telephone', 'Téléphone'], ['email', 'Email'], ['siret', 'SIRET']].map(([k, l]) => (
                    <Field key={k} label={l}><input className={inputCls} value={s.vendeur[k]} onChange={e => setVendeur(k, e.target.value)} /></Field>

        {/* Bouton principal mobile */}
        <div className="fixed inset-x-0 bottom-0 z-40 border-t border-gray-200 bg-white/95 p-3 backdrop-blur sm:hidden" style={{ paddingBottom: 'calc(.75rem + env(safe-area-inset-bottom))' }}>
          <button onClick={generate} className="w-full rounded-xl bg-accent py-3.5 text-base font-semibold text-white shadow-sm active:brightness-110">Générer la proposition commerciale</button>
        </div>

        {preview !== null && (
          <div className="fixed inset-0 z-[60] grid place-items-center bg-black/90 p-4" onClick={() => setPreview(null)}>
            <img src={s.visuels.photos[preview]} alt="" className="max-h-[85vh] max-w-full rounded-lg object-contain" />
            <p className="absolute bottom-6 text-sm text-white/70">Touchez pour fermer</p>
          </div>
        )}
      </div>

      {showProposal && <Proposal s={s} c={c} numero={numero} onClose={() => setShowProposal(false)} toast={toast} />}
      <Toast msg={msg} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
