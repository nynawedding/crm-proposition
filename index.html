  if (has('demande', 'Site internet')) s.add('site');
  if (has('demande', 'Réseaux sociaux')) s.add('social');

/* ============================ Utilitaires ============================ */
const STORE = 'crm-proposition-v1';
const eur = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: n % 1 ? 2 : 0 }).format(n || 0);
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const today = () => new Date();
const fmtDate = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

const load = () => {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (!s) return DEFAULTS;
    // fusion prudente avec les valeurs par défaut (nouvelles prestations, nouveaux champs)
    const valide = (o) => OFFRE_IDS.includes(o);
    const stocke = (id) => (s.prestations || []).find(x => x.id === id) || {};
    const prestations = CATALOGUE.map(p => {
      const st = stocke(p.id);
      // prestation redéfinie (v différente) : on reprend la nouvelle version, en gardant la sélection
      const base = p.v && st.v !== p.v ? { selected: !!st.selected, offre: st.offre } : st;
      // l'ancienne « fiche Google » (gbp) est fusionnée dans « Mise en place du référencement Google »
      if (p.id === 'seo' && stocke('gbp').selected) base.selected = true;
      return { ...p, ...base, offre: valide(base.offre) ? base.offre : p.offre };
    });
    // seules les prestations créées à la main sont gardées en plus du catalogue
    const anciennes = { shooting: 'base', video: 'base' }; // prestations des versions précédentes, gardées avec vos prix
    const extras = (s.prestations || [])
      .filter(x => String(x.id).startsWith('perso-') || anciennes[x.id])
      .map(x => anciennes[x.id] ? { ...x, id: 'perso-' + x.id } : x)
      .filter((x, i, arr) => arr.findIndex(y => y.id === x.id) === i)
      .map(x => ({ ...x, offre: valide(x.offre) ? x.offre : 'base' }));
    // noms d'offres personnalisés gardés seulement s'ils datent de la version actuelle des offres
    const offres = OFFRES.map(o => ({ ...o, ...((s.offres || []).find(x => x.id === o.id && x.v === o.v) || {}) }));
    // une seule fois : si la fiche enregistrée est vide, on y met le client préenregistré
    const vide = !Object.values(s.client || {}).some(v => String(v).trim());
    const client = !s.prefillApplied && vide ? PREFILL.client : { ...blankClient, ...s.client };
    const demo = !s.prefillApplied && !(s.visuels || {}).demoUrl ? { demoUrl: PREFILL.demoUrl } : {};
    return { ...DEFAULTS, ...s, prefillApplied: true, client, vendeur: { ...DEFAULTS.vendeur, ...s.vendeur },
      visuels: { ...DEFAULTS.visuels, ...s.visuels, ...demo }, remises: { ...DEFAULTS.remises, ...s.remises }, acompte: { ...DEFAULTS.acompte, ...s.acompte },
      prestations: [...prestations, ...extras], offres };
  } catch { return DEFAULTS; }
};

// Réduit une image (photo de téléphone) avant de la garder en mémoire locale
const compress = (file, max = 1400, q = 0.82) => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onerror = reject;
  r.onload = () => {
    const img = new Image();
    img.onerror = reject;
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      const png = file.type === 'image/png' || file.type === 'image/svg+xml';
      if (!png) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL(png ? 'image/png' : 'image/jpeg', q));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
});

const waNumber = (tel) => {
  let d = (tel || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) return d.slice(1);
  if (d.startsWith('00')) return d.slice(2);
  if (d.startsWith('0') && d.length === 10) return '33' + d.slice(1);
  return d;
};

// « 1 journée », « 2 journées », « 3 × lot de 20 »
const UNITES_MUETTES = ['', 'mois', 'forfait', 'site', 'boucle'];
const qteTexte = (p) => {
  const q = Math.max(1, num(p.qte) || 1), u = (p.unite || '').trim();
  if (q === 1 && UNITES_MUETTES.includes(u.toLowerCase())) return '';
  if (!u) return `${q}`;
  if (q === 1) return `1 ${u}`;
  return /^[a-zàâéèêîôûç-]+$/i.test(u) && !/s$/.test(u) ? `${q} ${u}s` : `${q} × ${u}`;
};

// pour les listes : « × 3 » quand il n'y a pas d'unité
const qteLabel = (p) => { const t = qteTexte(p); return /^\d+$/.test(t) ? '× ' + t : t; };

/* ============================ Calculs ============================ */
function compute(s) {
  const sel = s.prestations.filter(p => p.selected);
  const line = (p) => num(p.prix) * Math.max(1, num(p.qte) || 1);
  const ponct = sel.filter(p => p.type === 'ponctuel');
  const mens = sel.filter(p => p.type === 'mensuel');
  const brutP = ponct.reduce((a, p) => a + line(p), 0);
  const brutM = mens.reduce((a, p) => a + line(p), 0);
  const rem = (brut, r) => Math.min(brut, Math.max(0, r.mode === '%' ? brut * num(r.valeur) / 100 : num(r.valeur)));
  const remP = rem(brutP, s.remises.ponctuel);
  const remM = rem(brutM, s.remises.mensuel);
  const htP = brutP - remP, htM = brutM - remM;
  const t = num(s.tva) / 100;
  const ttcP = htP * (1 + t), ttcM = htM * (1 + t);
  const mois = s.engagement || 0;
  const moisCalc = mois || 1; // sans engagement : 1er mois
  const totalHT = htP + htM * moisCalc;
  const totalTTC = ttcP + ttcM * moisCalc;
  const acompte = s.acompte.actif ? ttcP * num(s.acompte.pct) / 100 : 0;
  // répartition par offre (remise répartie au prorata)
  const kP = brutP ? htP / brutP : 1, kM = brutM ? htM / brutM : 1;
  const offres = (s.offres || OFFRES).map(o => {
    const items = sel.filter(p => (p.offre || 'base') === o.id);
    const bP = items.filter(p => p.type === 'ponctuel').reduce((a, p) => a + line(p), 0);
    const bM = items.filter(p => p.type === 'mensuel').reduce((a, p) => a + line(p), 0);
    const oHtP = bP * kP, oHtM = bM * kM;
    const oTtcP = oHtP * (1 + t), oTtcM = oHtM * (1 + t);
    const oAcompte = s.acompte.actif ? oTtcP * num(s.acompte.pct) / 100 : 0;
    return { ...o, items, bP, bM, htP: oHtP, htM: oHtM, ttcP: oTtcP, ttcM: oTtcM, acompte: oAcompte,
      totalTTC: oTtcP + oTtcM * moisCalc, totalHT: oHtP + oHtM * moisCalc };
  }).filter(o => o.items.length);
  return { sel, ponct, mens, line, brutP, brutM, remP, remM, htP, htM, ttcP, ttcM, tvaP: ttcP - htP, tvaM: ttcM - htM,
    mois, moisCalc, totalHT, totalTTC, acompte, offres };
}

}

  return (

        <button key={o.v} type="button" onClick={() => onChange(o.v)}

function Toast({ msg }) {
  if (!msg) return null;
  return <div className="no-print fixed inset-x-0 bottom-24 z-[70] mx-auto w-fit max-w-[92vw] rounded-xl bg-ink px-4 py-3 text-center text-sm text-white shadow-lg">{msg}</div>;

/* ============================ Carte prestation ============================ */
function PrestationCard({ p, suggested, onChange, onRemove, offres }) {

  return (
    <div className={'rounded-2xl border p-4 transition ' + (p.selected ? 'border-accent bg-accent-soft/40 ring-1 ring-accent/20' : 'border-gray-200 bg-white')}>
      <div className="flex items-start gap-3">
        <button type="button" onClick={() => onChange({ selected: !p.selected })} aria-pressed={p.selected}
          className={'mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-md border transition ' + (p.selected ? 'border-accent bg-accent text-white' : 'border-gray-300 bg-white')}>
          {p.selected && <svg className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.5 7.5a1 1 0 01-1.4 0l-3.5-3.5a1 1 0 111.4-1.4l2.8 2.8 6.8-6.8a1 1 0 011.4 0z" clipRule="evenodd"/></svg>}
        </button>
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-2">
            <input value={p.nom} onChange={e => onChange({ nom: e.target.value })}
              className="min-w-0 flex-1 bg-transparent text-[15px] font-semibold outline-none" aria-label="Nom de la prestation" />
            {suggested && !p.selected && <span className="rounded-full bg-amber-100 px-2 py-0.5 text-[11px] font-medium text-amber-800">Suggéré</span>}
          </div>
          <textarea value={p.description} onChange={e => onChange({ description: e.target.value })} rows={2}
            className="mt-1 w-full resize-none bg-transparent text-sm leading-snug text-gray-600 outline-none" aria-label="Description" />
        </div>
      </div>
      <div className="mt-3 flex flex-wrap items-end gap-3 pl-9">
        <label className="w-28">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">Prix HT</span>
          <div className="relative">
            <input type="number" inputMode="decimal" min="0" step="1" value={p.prix} onChange={e => onChange({ prix: e.target.value })}
              className={inputCls + ' tabular py-2 pr-7'} />
            <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400">€</span>
          </div>
        </label>
        <label className="w-20">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">Qté</span>
          <input type="number" inputMode="numeric" min="1" step="1" value={p.qte} onChange={e => onChange({ qte: e.target.value })}
            className={inputCls + ' tabular py-2'} />
        </label>
        <label className="w-32">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">Unité</span>
          <input value={p.unite || ''} onChange={e => onChange({ unite: e.target.value })} placeholder="journée…"
            className={inputCls + ' py-2 text-sm'} />
        </label>
        <label className="min-w-[150px]">
          <span className="mb-1 block text-[11px] uppercase tracking-wide text-gray-500">Dans l'offre</span>
          <select value={p.offre || 'base'} onChange={e => onChange({ offre: e.target.value })}
            className={inputCls + ' py-2 text-sm'}>
            {offres.map(o => <option key={o.id} value={o.id}>{o.nom}</option>)}
          </select>
        </label>
        <div className="ml-auto pb-2 text-right">
          <div className="tabular text-base font-semibold">{eur(total)}</div>
          <div className="text-[11px] text-gray-500">{p.type === 'mensuel' ? 'HT / mois' : 'HT'}</div>
        </div>
        {onRemove && <button type="button" onClick={onRemove} className="pb-2 text-xs text-gray-400 hover:text-red-600">Supprimer</button>}
      </div>
    </div>
  );
}

/* ============================ Proposition ============================ */
// Le client doit comprendre en 10 secondes : ce qu'il a demandé, combien, et ce qu'il peut ajouter.
const prixOffre = (o, c) => {
  const parts = [];
  if (o.ttcP > 0) parts.push(`${eur(o.ttcP)} une fois`);
  if (o.ttcM > 0) parts.push(`${eur(o.ttcM)} / mois${c.mois ? ` pendant ${c.mois} mois` : ''}`);
  return parts.join(' + ');
};

function buildText(s, c, numero) {
  const L = [];
  const cl = s.client, t = 1 + num(s.tva) / 100;
  L.push(`Bonjour${cl.responsable ? ' ' + cl.responsable.split(' ')[0] : ''},`);
  L.push('');
  L.push(`Voici notre proposition pour ${cl.entreprise || 'votre commerce'} (devis ${numero}). Prix TTC.`);
  c.offres.forEach((o, i) => {
    L.push('');
    L.push(`${i === 0 && o.id === 'base' ? '★' : '+'} ${o.nom.toUpperCase()} : ${prixOffre(o, c)}`);
    o.items.forEach(p => L.push(`   ✓ ${p.nom}${qteLabel(p) ? ' (' + qteLabel(p) + ')' : ''}`));
  });
  if (c.offres.length > 1) {
    L.push('');
    L.push(`Si vous prenez tout : ${eur(c.ttcP)} une fois + ${eur(c.ttcM)} / mois (total ${c.mois ? c.mois + ' mois' : '1er mois'} : ${eur(c.totalTTC)}).`);
  }
  const eco = (c.remP + c.remM * c.moisCalc) * t;
  if (eco > 0) L.push(`Remise incluse : ${eur(eco)} d'économie.`);
  L.push('');
  L.push(`Offre valable jusqu'au ${fmtDate(addDays(today(), num(s.validite)))}.`);
  if (s.visuels.demoUrl) L.push('Démonstration : ' + s.visuels.demoUrl);
  const v = s.vendeur;
  if (v.nom || v.telephone) { L.push(''); L.push([v.nom, v.societe, v.telephone, v.email].filter(Boolean).join(' · ')); }
  return L.join('\n');
}

function Check() {
  return <svg className="mt-0.5 h-5 w-5 shrink-0 text-emerald-600" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0l4-4z" clipRule="evenodd"/></svg>;
}

function OffreCard({ o, i, c, principale }) {
  return (
    <div className={'avoid-break overflow-hidden rounded-3xl ' + (principale ? 'border-2 border-accent' : 'border border-gray-200')}>
      <div className={'flex flex-wrap items-start justify-between gap-4 px-5 py-5 sm:px-6 ' + (principale ? 'bg-accent text-white' : 'bg-gray-50')}>
        <div className="flex min-w-0 items-start gap-3">
          <span className={'mt-1 grid h-6 w-6 shrink-0 place-items-center rounded-md border-2 ' + (principale ? 'border-white/80' : 'border-gray-400')} aria-hidden="true" />
          <div className="min-w-0">
            <p className={'text-xs font-bold uppercase tracking-wider ' + (principale ? 'text-white/75' : 'text-gray-500')}>
              {principale ? o.tag : `Option ${i} · ${o.tag}`}
            </p>
            <p className="font-display text-2xl font-semibold leading-tight">{o.nom}</p>
            {o.explication && <p className={'mt-1.5 max-w-md text-sm leading-snug ' + (principale ? 'text-white/85' : 'text-gray-600')}>{o.explication}</p>}
          </div>
        </div>
        <div className="tabular sm:text-right">
          {o.ttcP > 0 && <p className="font-display text-[30px] font-semibold leading-none">{eur(o.ttcP)}<span className={'ml-1 text-sm font-sans font-medium ' + (principale ? 'text-white/75' : 'text-gray-500')}>TTC</span></p>}
          {o.ttcP > 0 && <p className={'text-sm ' + (principale ? 'text-white/75' : 'text-gray-500')}>une seule fois · {eur(o.htP)} HT</p>}
          {o.ttcM > 0 && <p className={'font-display font-semibold leading-none ' + (o.ttcP > 0 ? 'mt-2 text-xl' : 'text-[30px]')}>{o.ttcP > 0 ? '+ ' : ''}{eur(o.ttcM)}<span className={'ml-1 text-sm font-sans font-medium ' + (principale ? 'text-white/75' : 'text-gray-500')}>TTC / mois</span></p>}
          {o.ttcM > 0 && <p className={'text-sm ' + (principale ? 'text-white/75' : 'text-gray-500')}>{c.mois ? `pendant ${c.mois} mois` : 'sans engagement'} · {eur(o.htM)} HT</p>}
        </div>
      </div>
      <ul className="divide-y divide-gray-100 px-5 sm:px-6">
        {o.items.map(p => (
          <li key={p.id} className="flex gap-3 py-3">
            <Check />
            <div className="min-w-0 flex-1">
              <p className="font-semibold leading-snug">{p.nom}{qteLabel(p) && <span className="font-normal text-gray-500"> · {qteLabel(p)}</span>}</p>
              <p className="text-sm leading-snug text-gray-600">{p.description}</p>
            </div>
            {p.type === 'mensuel' && <span className="h-fit shrink-0 rounded-full bg-sky-50 px-2.5 py-1 text-[11px] font-semibold text-sky-800">chaque mois</span>}
          </li>
        ))}
      </ul>
    </div>
  );
}

function Proposal({ s, c, numero, onClose, toast }) {
  const cl = s.client, v = s.vendeur;
  const t = 1 + num(s.tva) / 100;
  const obj = s.reponses.objectif || [];
  const demande = s.reponses.demande || [];
  const economie = (c.remP + c.remM * c.moisCalc) * t;
  const validite = fmtDate(addDays(today(), num(s.validite)));
  const base = c.offres.find(o => o.id === 'base');
  const options = c.offres.filter(o => o !== base);
  const DIRE = { 'Shooting photo': 'un shooting photo', 'Vidéos': 'des vidéos', 'Contenus pour mes écrans en boutique': 'des contenus pour vos écrans en boutique',
    'Site internet': 'un site internet', 'Réseaux sociaux': 'de l\'aide sur vos réseaux sociaux' };
  const liste = (xs) => xs.length > 1 ? xs.slice(0, -1).join(', ') + ' et ' + xs[xs.length - 1] : xs[0];
  const intro = base
    ? `Vous nous avez demandé ${demande.length ? liste(demande.map(d => DIRE[d] || d.toLowerCase())) : liste(base.items.map(p => p.nom.toLowerCase()))}. Voici le prix de votre demande${options.length ? `, puis ${options.length === 1 ? 'une option' : options.length + ' options'} pour aller plus loin, à ajouter seulement si vous le souhaitez` : ''}.`
    : 'Voici les offres préparées pour vous. Cochez celles que vous choisissez.';
  const text = buildText(s, c, numero);
  const subject = `Votre proposition ${cl.entreprise ? '– ' + cl.entreprise : ''} (${numero})`;

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); toast('Récapitulatif copié dans le presse-papiers.'); }
    catch { toast('Copie impossible : sélectionnez le texte manuellement.'); }
  };
  const whatsapp = () => {
    window.open(`https://wa.me/${waNumber(cl.telephone)}?text=${encodeURIComponent(text)}`, '_blank');
    toast('WhatsApp est ouvert avec le message prérempli. Vérifiez-le puis appuyez sur Envoyer.');
  };
  const email = () => {
    window.location.href = `mailto:${encodeURIComponent(cl.email || '')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
    toast('Votre messagerie est ouverte avec le message prérempli. Joignez le PDF puis envoyez.');
  };

  const Line = ({ l, v, strong, minus }) => (
    <div className={'flex justify-between gap-4 py-1 ' + (strong ? 'font-semibold text-ink' : 'text-gray-600')}>
      <span>{l}</span><span className={'tabular ' + (minus ? 'text-emerald-700' : '')}>{v}</span>
    </div>
  );
  const cell = (n) => n > 0 ? eur(n) : '—';

  return (
    <div id="proposal-overlay" className="fixed inset-0 z-50 overflow-y-auto bg-gray-900/40 backdrop-blur-sm sm:p-6">
      <div className="no-print sticky top-0 z-10 mx-auto flex max-w-[860px] flex-wrap items-center gap-2 bg-white/95 px-4 py-3 shadow-sm backdrop-blur sm:rounded-t-2xl">
        <button onClick={onClose} className="rounded-xl px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">← Modifier</button>
        <div className="ml-auto flex flex-wrap gap-2">
          <button onClick={() => window.print()} className="rounded-xl bg-ink px-4 py-2 text-sm font-semibold text-white">PDF</button>
          <button onClick={copy} className="rounded-xl border border-gray-200 px-4 py-2 text-sm font-medium">Copier</button>
          <button onClick={whatsapp} className="rounded-xl bg-[#25D366] px-4 py-2 text-sm font-semibold text-white">WhatsApp</button>
          <button onClick={email} className="rounded-xl border border-gray-200 px-4 py-2 text-sm font-medium">Email</button>
        </div>
      </div>

      <article id="proposal" className="mx-auto max-w-[860px] bg-white px-5 py-8 text-[15px] leading-relaxed shadow-xl sm:rounded-b-2xl sm:px-12 sm:py-10">
        {/* En-tête */}
        <header className="avoid-break flex items-start justify-between gap-6">
          <div className="min-w-0">
            <p className="text-xs font-semibold uppercase tracking-[.18em] text-gray-500">Proposition · N° {numero} · valable jusqu'au {validite}</p>
            <h1 className="mt-2 font-display text-[28px] font-semibold leading-tight sm:text-4xl">Votre projet pour {cl.entreprise || 'votre commerce'}</h1>
            <p className="mt-2 text-gray-600">{[cl.responsable, cl.adresse].filter(Boolean).join(' · ')}</p>
          </div>
          {s.visuels.logo && <img src={s.visuels.logo} alt="" className="h-16 w-24 shrink-0 rounded-lg object-cover sm:h-20 sm:w-32" />}
        </header>

        {/* 1. Les offres, chacune avec son prix */}
        <section className="mt-8">
          <p className="max-w-2xl text-lg leading-snug text-gray-800">{intro}</p>
          <p className="mt-1 text-sm text-gray-500">Tous les prix sont affichés TTC, la TVA ({s.tva} %) est comprise.</p>
          <div className="mt-6 space-y-5">
            {c.offres.map((o, i) => <OffreCard key={o.id} o={o} i={base ? i : i + 1} c={c} principale={o === base || (!base && i === 0)} />)}
            {c.offres.length === 0 && <p className="text-gray-500">Aucune prestation sélectionnée.</p>}
          </div>
          {c.offres.length > 1 && (
            <div className="avoid-break mt-5 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-gray-900 px-5 py-4 text-white sm:px-6">
              <p className="font-semibold">Si vous prenez tout</p>
              <p className="tabular text-right">
                <span className="font-display text-xl font-semibold">{prixOffre({ ttcP: c.ttcP, ttcM: c.ttcM }, c)}</span>
                <span className="block text-sm text-white/70">soit {eur(c.totalTTC)} TTC {c.mois ? `sur ${c.mois} mois` : 'le 1er mois'}</span>
              </p>
            </div>
          )}
          {economie > 0 && <p className="mt-3 text-sm font-semibold text-emerald-700">✓ Remise déjà déduite : {eur(economie)} TTC d'économie{c.mois ? ` sur ${c.mois} mois` : ''} si vous prenez tout.</p>}
        </section>

        {/* 2. Quand vous payez */}
        {c.offres.length > 0 && (
          <section className="avoid-break mt-10">
            <h2 className="font-display text-2xl font-semibold">Quand vous payez</h2>
            <p className="mt-1 text-sm text-gray-500">Vous ne payez que les offres que vous cochez.</p>
            <div className="mt-4 overflow-x-auto rounded-2xl border border-gray-200">
              <table className="w-full text-[13px] sm:text-sm">
                <thead className="bg-gray-50 text-left text-xs uppercase tracking-wide text-gray-500">
                  <tr>
                    <th className="px-3 py-3 font-semibold sm:px-4">Offre</th>
                    {s.acompte.actif && c.ttcP > 0 && <th className="px-2 py-3 text-right font-semibold sm:px-3">Commande<span className="block font-normal normal-case">acompte {s.acompte.pct} %</span></th>}
                    {c.ttcP > 0 && <th className="px-2 py-3 text-right font-semibold sm:px-3">Livraison</th>}
                    {c.ttcM > 0 && <th className="px-3 py-3 text-right font-semibold sm:px-4">Par mois</th>}
                  </tr>
                </thead>
                <tbody className="tabular divide-y divide-gray-100">
                  {c.offres.map(o => (
                    <tr key={o.id}>
                      <td className="px-3 py-3 font-semibold leading-snug sm:px-4">{o.nom}</td>
                      {s.acompte.actif && c.ttcP > 0 && <td className="whitespace-nowrap px-2 py-3 text-right sm:px-3">{cell(o.acompte)}</td>}
                      {c.ttcP > 0 && <td className="whitespace-nowrap px-2 py-3 text-right sm:px-3">{cell(o.ttcP - o.acompte)}</td>}
                      {c.ttcM > 0 && <td className="whitespace-nowrap px-3 py-3 text-right sm:px-4">{cell(o.ttcM)}</td>}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="mt-3 whitespace-pre-line text-sm text-gray-600">{s.paiement}</p>
          </section>
        )}

        {/* 3. Pourquoi */}
        {(s.presentation.trim() || obj.length > 0) && (
          <section className="avoid-break mt-10">
            <h2 className="font-display text-2xl font-semibold">Votre objectif</h2>
            {s.presentation.trim() && <p className="mt-2 whitespace-pre-line text-gray-700">{s.presentation}</p>}
            {obj.length > 0 && <div className="mt-3 flex flex-wrap gap-2">{obj.map(o => <span key={o} className="rounded-full bg-gray-100 px-3.5 py-1.5 text-sm font-medium">{o}</span>)}</div>}
          </section>
        )}

        {(s.visuels.photos.length > 0 || s.visuels.demoUrl) && (
          <section className="avoid-break mt-8">
            {s.visuels.photos.length > 0 && (
              <div className="grid grid-cols-3 gap-2">{s.visuels.photos.slice(0, 3).map((ph, i) => <img key={i} src={ph} alt="" className="aspect-[4/3] w-full rounded-xl object-cover" />)}</div>
            )}
            {s.visuels.demoUrl && (
              <a href={s.visuels.demoUrl} className="mt-3 flex items-center justify-between gap-3 rounded-2xl border border-gray-200 px-5 py-4 hover:bg-gray-50">
                <span className="min-w-0"><span className="block font-semibold">Voir la démonstration en ligne</span><span className="block truncate text-sm text-gray-500">{s.visuels.demoUrl}</span></span>
                <span className="text-xl text-accent">→</span>
              </a>
            )}
          </section>
        )}

        {/* 4. Détail du prix, bloc par bloc */}
        <section className="mt-10 border-t border-gray-200 pt-8">
          <h2 className="font-display text-2xl font-semibold">Détail du prix</h2>
          <p className="mt-1 text-sm text-gray-500">Bloc par bloc : chaque prestation, sa quantité et son prix unitaire (HT), puis le total du bloc.</p>
          <div className="mt-5 space-y-5">
            {c.offres.map((o, i) => {
              const remP = o.bP - o.htP, remM = o.bM - o.htM;
              const unit = (p) => qteTexte(p) ? `${qteTexte(p)} × ${eur(num(p.prix))}` : '';
              return (
                <div key={o.id} className="avoid-break overflow-hidden rounded-2xl border border-gray-200">
                  <p className="bg-gray-50 px-4 py-3 font-semibold sm:px-5">{o.id === 'base' ? '★ ' : (i ? i + '. ' : '')}{o.nom}</p>
                  <table className="w-full text-[13px] sm:text-sm">
                    <tbody className="tabular divide-y divide-gray-100">
                      {o.items.map(p => (
                        <tr key={p.id} className="align-top">
                          <td className="px-4 py-2.5 sm:px-5">
                            <span className="text-ink">{p.nom}</span>
                            {unit(p) && <span className="block text-gray-500">{unit(p)}</span>}
                          </td>
                          <td className="whitespace-nowrap px-4 py-2.5 text-right sm:px-5">{eur(c.line(p))} HT{p.type === 'mensuel' && <span className="block text-gray-500">par mois</span>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className={'grid gap-x-8 border-t border-gray-200 bg-gray-50/60 px-4 py-3 text-sm sm:px-5 ' + (o.bP > 0 && o.bM > 0 ? 'sm:grid-cols-2' : '')}>
                    {o.bP > 0 && (
                      <div>
                        <p className="font-semibold">Une seule fois</p>
                        {remP > 0.005 && <Line l="Avant remise" v={eur(o.bP) + ' HT'} />}
                        {remP > 0.005 && <Line minus l={'Remise' + (s.remises.ponctuel.mode === '%' ? ` ${s.remises.ponctuel.valeur} %` : '')} v={'− ' + eur(remP) + ' HT'} />}
                        <Line l="Total HT" v={eur(o.htP)} />
                        <Line l={`TVA ${s.tva} %`} v={eur(o.ttcP - o.htP)} />
                        <Line strong l="Total TTC" v={eur(o.ttcP)} />
                      </div>
                    )}
                    {o.bM > 0 && (
                      <div>
                        <p className="font-semibold">Par mois</p>
                        {remM > 0.005 && <Line l="Avant remise" v={eur(o.bM) + ' HT'} />}
                        {remM > 0.005 && <Line minus l={'Remise' + (s.remises.mensuel.mode === '%' ? ` ${s.remises.mensuel.valeur} %` : '')} v={'− ' + eur(remM) + ' HT'} />}
                        <Line l="Total HT / mois" v={eur(o.htM)} />
                        <Line l={`TVA ${s.tva} %`} v={eur(o.ttcM - o.htM)} />
                        <Line strong l="Total TTC / mois" v={eur(o.ttcM)} />
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
          {c.offres.length > 1 && (
            <div className="avoid-break mt-5 grid gap-x-8 rounded-2xl bg-gray-900 px-4 py-4 text-sm text-white sm:grid-cols-2 sm:px-5">
              <p className="font-semibold sm:col-span-2">Si vous prenez tous les blocs</p>
              {c.ttcP > 0 && <div className="flex justify-between py-1"><span className="text-white/70">Une seule fois</span><span className="tabular">{eur(c.htP)} HT · <strong>{eur(c.ttcP)} TTC</strong></span></div>}
              {c.ttcM > 0 && <div className="flex justify-between py-1"><span className="text-white/70">Par mois</span><span className="tabular">{eur(c.htM)} HT · <strong>{eur(c.ttcM)} TTC</strong></span></div>}
            </div>
          )}
        </section>

        {/* 5. Inclus, conditions */}
        <section className="avoid-break mt-8 grid gap-6 border-t border-gray-200 pt-8 text-sm sm:grid-cols-2">
          {c.mens.length > 0 && s.inclus.trim() && (
            <div>
              <p className="font-semibold">Toujours inclus dans les abonnements</p>
              <ul className="mt-2 space-y-1 text-gray-700">{s.inclus.split('\n').filter(Boolean).map(l => <li key={l} className="flex gap-2"><span className="text-emerald-600">✓</span>{l}</li>)}</ul>
            </div>
          )}
          <div>
            <p className="font-semibold">Engagement et validité</p>
            {c.mens.length > 0 && <p className="mt-2 text-gray-700">{c.mois ? `Abonnements : engagement de ${c.mois} mois à partir de la mise en route.` : 'Abonnements sans engagement : ils s\'arrêtent quand vous le souhaitez.'}</p>}
            <p className="mt-2 text-gray-700">Cette offre est valable jusqu'au <strong>{validite}</strong>.</p>
          </div>
        </section>

        {/* 6. Accord */}
        <section className="avoid-break mt-8 grid gap-6 border-t border-gray-200 pt-8 sm:grid-cols-2">
          <div>
            <p className="text-sm font-semibold">Bon pour accord</p>
            <p className="text-sm text-gray-500">Offres choisies (cochées ci-dessus), date et signature</p>
            <div className="mt-2 h-24 rounded-xl border border-dashed border-gray-300" />
          </div>
          <div className="text-sm">
            <p className="font-semibold">Votre contact</p>
            {v.nom && <p className="mt-1">{v.nom}{v.societe && v.societe.toLowerCase() !== v.nom.toLowerCase() ? ' · ' + v.societe : ''}</p>}
            {(v.telephone || v.email) && <p className="text-gray-600">{[v.telephone, v.email].filter(Boolean).join(' · ')}</p>}
            {v.siret && <p className="text-gray-500">SIRET {v.siret}</p>}
            <p className="mt-2 text-gray-500">Une question ? Appelez-moi, je vous réponds directement.</p>
          </div>
        </section>
      </article>
      <div className="no-print h-10" />
    </div>
  );
}

/* ============================ Application ============================ */
function App() {
  const [s, setS] = useState(load);
  const [open, setOpen] = useState({ client: true });
  const [showProposal, setShowProposal] = useState(false);
  const [preview, setPreview] = useState(null);
  const [msg, setMsg] = useState('');
  const timer = useRef();

  useEffect(() => {
    try { localStorage.setItem(STORE, JSON.stringify(s)); }
    catch { toast('Mémoire locale pleine : retirez quelques photos.'); }
  }, [s]);

  const toast = (m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(''), 4500); };
  const set = (patch) => setS(prev => ({ ...prev, ...(typeof patch === 'function' ? patch(prev) : patch) }));
  const setClient = (k, v) => set(p => ({ client: { ...p.client, [k]: v } }));
  const setVendeur = (k, v) => set(p => ({ vendeur: { ...p.vendeur, [k]: v } }));
  const setPrest = (id, patch) => set(p => ({ prestations: p.prestations.map(x => x.id === id ? { ...x, ...patch } : x) }));
  const toggle = (k) => setOpen(o => ({ ...o, [k]: !o[k] }));

  const c = useMemo(() => compute(s), [s]);
  const sugg = useMemo(() => suggestions(s.reponses), [s.reponses]);
  const numero = useMemo(() => {
    const d = today();
    return `DEV-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${(s.client.entreprise || 'X').replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'X'}`;
  }, [s.client.entreprise]);

  const answer = (q, o) => set(p => {
    const cur = p.reponses[q.id] || [];
    const next = q.multi ? (cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o]) : (cur.includes(o) ? [] : [o]);
    return { reponses: { ...p.reponses, [q.id]: next } };
  });

  const addPhotos = async (files) => {
    const out = [];
    for (const f of files) { try { out.push(await compress(f, 1400, 0.8)); } catch {} }
    set(p => ({ visuels: { ...p.visuels, photos: [...p.visuels.photos, ...out].slice(0, 12) } }));
  };
  const addLogo = async (f) => { if (!f) return; try { const d = await compress(f, 600, 0.9); set(p => ({ visuels: { ...p.visuels, logo: d } })); } catch { toast('Image illisible.'); } };

  const nouveauClient = () => {
    if (!confirm('Commencer un nouveau client ? La fiche, les réponses, la sélection et les visuels seront effacés. Vos tarifs et vos coordonnées sont conservés.')) return;
    set(p => ({ ...DEFAULTS, client: blankClient, visuels: { logo: '', photos: [], demoUrl: '' }, prestations: p.prestations.map(x => ({ ...x, selected: false })), vendeur: p.vendeur,
      inclus: p.inclus, paiement: p.paiement, validite: p.validite, tva: p.tva, offres: p.offres }));
    setOpen({ client: true });
  };

  const addCustom = (type, offre = 'base') => set(p => ({ prestations: [...p.prestations, { id: 'perso-' + Date.now(), type, nom: 'Nouvelle prestation', description: 'Description de la prestation', prix: 0, qte: 1, unite: '', selected: true, offre }] }));

  const answered = QUESTIONS.filter(q => (s.reponses[q.id] || []).length || (s.notes[q.id] || '').trim());
  const clientHint = [s.client.entreprise, s.client.responsable].filter(Boolean).join(' · ') || 'Coordonnées du commerçant';

  const generate = () => {
    if (!c.sel.length) { toast('Cochez au moins une prestation avant de générer la proposition.'); setOpen(o => ({ ...o, offre: true })); return; }
    setShowProposal(true);
    window.scrollTo(0, 0);
  };

  // appelée comme une fonction (et non <RemiseInput/>) pour que le champ garde le focus pendant la saisie
  const remiseInput = (k, label) => (
    <div>
      <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">{label}</p>
      <div className="flex items-center gap-2">
        <input type="number" inputMode="decimal" min="0" value={s.remises[k].valeur}
          onChange={e => set(p => ({ remises: { ...p.remises, [k]: { ...p.remises[k], valeur: e.target.value } } }))}
          className={inputCls + ' tabular w-28'} />
        <Segmented value={s.remises[k].mode} options={[{ v: '%', label: '%' }, { v: '€', label: '€' }]}
          onChange={v => set(p => ({ remises: { ...p.remises, [k]: { ...p.remises[k], mode: v } } }))} />
      </div>
    </div>
  );

  return (
    <>
      <div id="app-main">
        {/* Récapitulatif permanent */}
        <div className="sticky top-0 z-40 border-b border-gray-200 bg-white/90 backdrop-blur" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
          <div className="mx-auto flex max-w-5xl items-center gap-3 px-4 py-2.5 sm:gap-6 sm:px-6">
            <div className="grid flex-1 grid-cols-3 gap-2 sm:gap-6">
              {[['Création initiale', eur(c.htP), eur(c.ttcP) + ' TTC'],
                ['Mensualité', eur(c.htM), eur(c.ttcM) + ' TTC'],
                [c.mois ? `Total ${c.mois} mois` : 'Total 1er mois', eur(c.totalHT), eur(c.totalTTC) + ' TTC']].map(([l, v, sub]) => (
                <div key={l} className="min-w-0">
                  <p className="truncate text-[10.5px] font-medium uppercase tracking-wide text-gray-500 sm:text-[11px]">{l}</p>
                  <p className="tabular truncate text-[15px] font-semibold sm:text-lg">{v}<span className="ml-1 text-[10px] font-normal text-gray-400">HT</span></p>
                  <p className="tabular hidden truncate text-[11px] text-gray-500 sm:block">{sub}</p>
                </div>
              ))}
            </div>
            <button onClick={generate} className="hidden rounded-xl bg-accent px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:brightness-110 sm:block">Générer la proposition</button>
          </div>
        </div>

        <main className="mx-auto max-w-5xl space-y-4 px-4 pb-32 pt-6 sm:px-6">
          <div className="flex flex-wrap items-end justify-between gap-3 pb-2">
            <div>
              <h1 className="font-display text-2xl font-semibold sm:text-3xl">Proposition commerciale</h1>
              <p className="text-sm text-gray-500">Enregistrement automatique sur cet appareil.</p>
            </div>
            <button onClick={nouveauClient} className="rounded-xl border border-gray-200 bg-white px-3.5 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50">Nouveau client</button>
          </div>

          {/* 1. Fiche client */}
          <Section n="1" title="Fiche client" hint={clientHint} open={!!open.client} onToggle={() => toggle('client')}>
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Nom de l'entreprise"><input className={inputCls} value={s.client.entreprise} onChange={e => setClient('entreprise', e.target.value)} placeholder="Boulangerie du Port" /></Field>
              <Field label="Responsable"><input className={inputCls} value={s.client.responsable} onChange={e => setClient('responsable', e.target.value)} placeholder="Prénom Nom" autoComplete="off" /></Field>
              <Field label="Téléphone"><input className={inputCls} type="tel" inputMode="tel" value={s.client.telephone} onChange={e => setClient('telephone', e.target.value)} placeholder="06 12 34 56 78" autoComplete="off" /></Field>
              <Field label="Email"><input className={inputCls} type="email" inputMode="email" value={s.client.email} onChange={e => setClient('email', e.target.value)} placeholder="contact@commerce.fr" autoComplete="off" /></Field>
              <Field label="Adresse" className="sm:col-span-2"><input className={inputCls} value={s.client.adresse} onChange={e => setClient('adresse', e.target.value)} placeholder="Rue, code postal, ville" autoComplete="off" /></Field>
              <Field label="Secteur d'activité" className="sm:col-span-2">
                <input className={inputCls} list="secteurs" value={s.client.secteur} onChange={e => setClient('secteur', e.target.value)} placeholder="Boulangerie, restaurant, coiffure…" />
                <datalist id="secteurs">{['Boulangerie-pâtisserie', 'Restaurant', 'Café / bar', 'Salon de coiffure', 'Institut de beauté', 'Boutique de vêtements', 'Fleuriste', 'Épicerie fine', 'Boucherie', 'Artisan'].map(x => <option key={x} value={x} />)}</datalist>
              </Field>
            </div>
          </Section>

          {/* 2. Découverte */}
          <Section n="2" title="Découverte commerciale" hint={answered.length ? `${answered.length} / ${QUESTIONS.length} questions renseignées` : 'Questions à poser pendant le rendez-vous'}
            open={!!open.decouverte} onToggle={() => toggle('decouverte')}>
            <div className="space-y-6">
              {QUESTIONS.map((q, i) => (
                <div key={q.id}>
                  <p className="font-medium"><span className="mr-2 text-gray-400">{i + 1}.</span>{q.q}{q.multi && <span className="ml-2 text-xs font-normal text-gray-400">plusieurs choix</span>}</p>

                    {q.options.map(o => <Chip key={o} active={(s.reponses[q.id] || []).includes(o)} onClick={() => answer(q, o)}>{o}</Chip>)}
                  </div>
                  <input className={inputCls + ' mt-2.5 text-sm'} placeholder="Notes…" value={s.notes[q.id] || ''}

                </div>
              ))}

              {answered.length > 0 && (
                <div className="rounded-2xl bg-gray-50 p-5">
                  <p className="font-display text-lg font-semibold">Synthèse des besoins</p>

                    {answered.map(q => (
                      <li key={q.id}>

                        <span className="font-medium">{(s.reponses[q.id] || []).join(', ') || '—'}</span>

                      <button className="rounded-xl bg-ink px-3.5 py-2 text-sm font-semibold text-white"
                        onClick={() => { set(p => ({ prestations: p.prestations.map(x => sugg.has(x.id) ? { ...x, selected: true } : x) })); setOpen(o => ({ ...o, offre: true })); toast('Prestations suggérées cochées. Ajustez-les dans le constructeur d\'offre.'); }}>

                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          </Section>

          {/* 3. Constructeur d'offre */}
          <Section n="3" title="Constructeur d'offre" hint={c.sel.length ? `${c.sel.length} prestation${c.sel.length > 1 ? 's' : ''} sélectionnée${c.sel.length > 1 ? 's' : ''}` : 'Cochez les prestations, ajustez prix et descriptions'}
            open={!!open.offre} onToggle={() => toggle('offre')}>
            {(s.offres || OFFRES).map((o, i) => {

              const r = c.offres.find(x => x.id === o.id);
              return (
                <div key={o.id} className="mb-8 last:mb-0">
                  <div className="mb-3 flex flex-wrap items-baseline justify-between gap-2 border-b border-gray-100 pb-2">

                    <span className="tabular text-sm text-gray-500">{r ? [r.htP > 0 && eur(r.htP) + ' HT', r.htM > 0 && eur(r.htM) + ' HT / mois'].filter(Boolean).join(' + ') : 'rien de coché'}</span>

                  <div className="grid gap-3 lg:grid-cols-2">
                    {items.map(p => (
                      <PrestationCard key={p.id} p={p} offres={s.offres || OFFRES} suggested={sugg.has(p.id)} onChange={patch => setPrest(p.id, patch)}

                  </div>

                    </div>
                  </div>
                </div>
              </div>
              <div className="rounded-2xl bg-gray-50 p-5 text-sm">
                {[['Création HT', eur(c.brutP)], c.remP ? ['Remise création', '−' + eur(c.remP)] : null, ['Création TTC', eur(c.ttcP)],
                  ['Mensualité HT', eur(c.brutM)], c.remM ? ['Remise mensuelle', '−' + eur(c.remM)] : null, ['Mensualité TTC', eur(c.ttcM)]]

                  {c.acompte > 0 && <div className="flex justify-between py-1 text-gray-600"><span>Acompte ({s.acompte.pct} %)</span><span className="tabular">{eur(c.acompte)}</span></div>}
                </div>
              </div>
            </div>
          </Section>

          {/* 5. Visuels */}
          <Section n="5" title="Visuels et démonstration" hint={[s.visuels.logo && 'logo', s.visuels.photos.length && `${s.visuels.photos.length} photo(s)`, s.visuels.demoUrl && 'site de démo'].filter(Boolean).join(' · ') || 'Logo, photos du commerce, site de démonstration'}
            open={!!open.visuels} onToggle={() => toggle('visuels')}>
            <div className="grid gap-6 sm:grid-cols-[200px_1fr]">
              <div>
                <p className="mb-1.5 text-xs font-medium uppercase tracking-wide text-gray-500">Logo</p>
                <label className="grid aspect-square cursor-pointer place-items-center overflow-hidden rounded-2xl border border-dashed border-gray-300 bg-gray-50 text-sm text-gray-500 hover:border-gray-400">

              </Field>
              <div className="grid gap-5 sm:grid-cols-2">
                <Field label="Maintenance et services inclus (une ligne par élément)"><textarea rows={5} className={inputCls} value={s.inclus} onChange={e => set({ inclus: e.target.value })} /></Field>
                <Field label="Conditions de paiement"><textarea rows={5} className={inputCls} value={s.paiement} onChange={e => set({ paiement: e.target.value })} /></Field>
              </div>
              <div>
                <p className="mb-3 text-xs font-medium uppercase tracking-wide text-gray-500">Vos coordonnées (conservées d'un client à l'autre)</p>
                <div className="grid gap-4 sm:grid-cols-2">
                  {[['nom', 'Votre nom'], ['societe', 'Votre société'], ['telephone', 'Téléphone'], ['email', 'Email'], ['siret', 'SIRET']].map(([k, l]) => (
                    <Field key={k} label={l}><input className={inputCls} value={s.vendeur[k]} onChange={e => setVendeur(k, e.target.value)} /></Field>
                  ))}
                </div>
              </div>
            </div>
          </Section>
        </main>

        {/* Bouton principal mobile */}
        <div className="fixed inset-x-0 bottom-0 z-40 border-t border-gray-200 bg-white/95 p-3 backdrop-blur sm:hidden" style={{ paddingBottom: 'calc(.75rem + env(safe-area-inset-bottom))' }}>
          <button onClick={generate} className="w-full rounded-xl bg-accent py-3.5 text-base font-semibold text-white shadow-sm active:brightness-110">Générer la proposition</button>
        </div>

        {preview !== null && (
          <div className="fixed inset-0 z-[60] grid place-items-center bg-black/90 p-4" onClick={() => setPreview(null)}>
            <img src={s.visuels.photos[preview]} alt="" className="max-h-[85vh] max-w-full rounded-lg object-contain" />
            <p className="absolute bottom-6 text-sm text-white/70">Touchez pour fermer</p>
          </div>
        )}
      </div>

      {showProposal && <Proposal s={s} c={c} numero={numero} onClose={() => setShowProposal(false)} toast={toast} />}
      <Toast msg={msg} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
